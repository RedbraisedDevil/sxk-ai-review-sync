<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识点总览 · 上信考 AI 备考</title>
<meta name="description" content="上海市高等学校信息技术水平考试（人工智能技术及应用）知识点三级总结：一句话、教材原文与讲解、教材截图。">
<style>
/* ===== 设计令牌：与主程序同一套（主色 #0D9488／背景 #F0FDFA／强调 #EA580C），
   深色主题只覆盖变量，组件样式一律引用变量，换主题不会漏掉某块底色 ===== */
:root{
  --bg:#F0FDFA; --surface:#FFFFFF;
  --ink:#0B2422; --ink-2:#475569; --ink-3:#64748B;
  --line:#D7E6E3;
  --brand:#0D9488; --brand-text:#0F766E; --brand-soft:#E8F1F4;
  --accent:#EA580C; --err:#DC2626; --err-soft:#FEF2F2; --ok-soft:#ECFDF5;
  --need:#B45309; --need-soft:#FFF7ED; --need-line:#FED7AA;
  --r:10px; --r-s:6px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
  --shadow:0 1px 2px rgba(11,36,34,.06), 0 8px 24px -18px rgba(11,36,34,.28);
  --t-ok-fg:#065F46; --t-ok-line:#A7F3D0; --t-ok-strong:#059669; --t-ok-on:#FFFFFF;
  --t-err-fg:#991B1B; --t-err-line:#FECACA; --t-err-on:#FFFFFF;
  --t-warm:#FFF7ED; --t-warm-line:#F0D3AC; --t-warm-fg:#B45309;
  --t-paper:#F8FAFA; --t-paper2:#FBFEFD;
  --t-slate:#F1F5F9;
  --t-memo-bg:#F2FBF9; --t-memo-line:#BFE3DC; --t-memo-fg:#33534F;
  --t-c38a-bg:oklch(0.955 0.028 178); --t-c38a-line:oklch(0.87 0.045 178);
  --t-dig-bg:#F3EEFB; --t-dig-line:#D8C8EF; --t-dig-fg:#5B3E8C;
  --t-scroll:#C8D8D5; --t-scroll-h:#A9C2BE;
  --t-scrim:rgba(11,36,34,.72);
  --font-num:"Lexend","Source Sans 3",system-ui,sans-serif;
  --font-cjk:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Noto Sans SC",monospace;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B1514; --surface:#111E1D;
  --ink:#E8F3F1; --ink-2:#A8BFBC; --ink-3:#8AA5A1;
  --line:#253937;
  --brand:#2DD4BF; --brand-text:#5EEAD4; --brand-soft:#15302D;
  --accent:#FB923C; --err:#F87171; --err-soft:#2A1516; --ok-soft:#0F2A22;
  --need:#FBBF24; --need-soft:#2A1F0D; --need-line:#5A411A;
  --shadow:0 1px 2px rgba(0,0,0,.55), 0 8px 24px -18px rgba(0,0,0,.9);
  --t-ok-fg:#6EE7B7; --t-ok-line:#1F5A46; --t-ok-strong:#34D399; --t-ok-on:#06231A;
  --t-err-fg:#FCA5A5; --t-err-line:#5E2222; --t-err-on:#2A0B0B;
  --t-warm:#2A1F0E; --t-warm-line:#5C421C; --t-warm-fg:#FBBF24;
  --t-paper:#152321; --t-paper2:#13201E;
  --t-slate:#1A2422;
  --t-memo-bg:#0F2A26; --t-memo-line:#1E4A44; --t-memo-fg:#A7D8D2;
  --t-c38a-bg:#10312D; --t-c38a-line:#1E4A44;
  --t-dig-bg:#1E1830; --t-dig-line:#3B3260; --t-dig-fg:#C4B5FD;
  --t-scroll:#2A4643; --t-scroll-h:#3A5B57;
  --t-scrim:rgba(0,0,0,.82);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--font-cjk); font-size:16px; line-height:1.68;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; font-weight:600; line-height:1.35}
p{margin:0 0 10px}
button{font:inherit; color:inherit; cursor:pointer; background:none; border:0}
a{color:var(--brand-text); text-decoration:none}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--r-s)}
.num{font-family:var(--font-num); font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.tiny{font-size:13.5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
mark{background:var(--t-warm); color:var(--t-warm-fg); border-radius:3px; padding:0 2px}

/* ===== 顶部栏 ===== */
.topbar{
  position:sticky; top:0; z-index:30; background:var(--surface);
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:var(--sp-3); flex-wrap:wrap;
  padding:10px var(--sp-4);
}
.brand{display:flex; align-items:center; gap:10px; font-weight:600; letter-spacing:.01em}
.brand .logo{width:26px;height:26px;border-radius:7px;background:var(--brand);display:grid;place-items:center;color:#fff;font-size:14px;font-weight:700}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--ink-3);letter-spacing:.02em}
.topbar .grow{flex:1 1 auto}
.iconbtn{border:1px solid var(--line); border-radius:var(--r-s); padding:5px 10px; font-size:13.5px; color:var(--ink-2); background:var(--surface)}
.iconbtn:hover{border-color:var(--brand); color:var(--brand-text)}
.syncbadge{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-3);
  border:1px solid var(--line); border-radius:999px; padding:4px 10px; background:var(--surface);
  cursor:pointer; font-family:inherit}
.syncbadge:hover{border-color:var(--brand); color:var(--brand-text)}
.syncbadge .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.syncbadge.on .dot{background:var(--t-ok-strong)}
.syncbadge.err .dot{background:var(--err)}

/* ===== 同步码配置弹窗 ===== */
.dlg{border:1px solid var(--line); border-radius:14px; padding:22px; max-width:400px; width:calc(100% - 40px);
  background:var(--surface); color:var(--ink); box-shadow:0 16px 48px rgba(0,0,0,.18)}
.dlg::backdrop{background:rgba(15,23,42,.45)}
.dlg h3{font-size:16px; margin-bottom:6px}
.dlg input{width:100%; margin:12px 0 8px; padding:9px 11px; font:inherit; font-family:var(--font-num);
  color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:var(--r-s); letter-spacing:.04em}
.dlg input:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft)}
.dlgrow{display:flex; gap:8px; align-items:center; margin-top:16px}
.dlgrow .grow{flex:1}

/* ===== 提示条 ===== */
.banner{
  padding:9px var(--sp-4); font-size:14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  background:var(--t-warm); color:var(--t-warm-fg); border-bottom:1px solid var(--t-warm-line);
}
.banner.info{background:var(--brand-soft); color:var(--brand-text); border-color:var(--line)}
.banner[hidden]{display:none}
.banner .btn{font-size:13px;border:1px solid currentColor;border-radius:var(--r-s);padding:2px 8px;color:inherit}

/* ===== 双栏 ===== */
.layout{display:grid; grid-template-columns:minmax(0,1fr); align-items:start}
@media(min-width:1000px){
  .layout{grid-template-columns:392px minmax(0,1fr); height:calc(100vh - 56px)}
  .rail{height:100%; overflow:auto; border-right:1px solid var(--line)}
  .detail{height:100%; overflow:auto}
}
.rail{background:var(--surface); min-width:0}

/* 搜索 */
.searchwrap{padding:var(--sp-3) var(--sp-3) var(--sp-2); position:sticky; top:0; background:var(--surface); z-index:5; border-bottom:1px solid var(--line)}
.searchbox{display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:var(--r); padding:7px 10px; background:var(--bg)}
.searchbox:focus-within{border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft)}
.searchbox input{flex:1; border:0; background:none; font:inherit; color:var(--ink); outline:none; min-width:0}
.searchbox kbd{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-3); border:1px solid var(--line); border-radius:4px; padding:0 5px; background:var(--surface)}

/* 状态 chips */
.chips{display:flex; gap:6px; flex-wrap:wrap; padding:10px var(--sp-3) 6px}
.chip{
  border:1px solid var(--line); border-radius:999px; padding:4px 11px; font-size:13.5px; color:var(--ink-2); background:var(--surface);
}
.chip .n{font-family:var(--font-num); margin-left:5px; color:var(--ink-3); font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--brand); border-color:var(--brand); color:#fff}
.chip[aria-pressed="true"] .n{color:rgba(255,255,255,.82)}
.chip.wrong .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--err);margin-right:5px;vertical-align:1px}
.chip.review .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--need);margin-right:5px;vertical-align:1px}
.chip.done .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--t-ok-strong);margin-right:5px;vertical-align:1px}
.chip.none .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink-3);margin-right:5px;vertical-align:1px}

/* 折叠筛选 */
.filters{padding:2px var(--sp-3) 10px; border-bottom:1px solid var(--line)}
.filters summary{font-size:13.5px; color:var(--ink-2); cursor:pointer; padding:6px 0; list-style:none}
.filters summary::-webkit-details-marker{display:none}
.filters summary::before{content:"▸ "; color:var(--ink-3)}
.filters[open] summary::before{content:"▾ "}
.frow{display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 2px}
.frow .lab{font-size:12.5px; color:var(--ink-3); width:34px; flex:none; line-height:26px}
.fchip{border:1px solid var(--line); border-radius:var(--r-s); padding:2px 9px; font-size:13px; color:var(--ink-2); background:var(--surface)}
.fchip[aria-pressed="true"]{border-color:var(--brand); color:var(--brand-text); background:var(--brand-soft)}
.sortrow{display:flex; align-items:center; gap:8px; padding:8px var(--sp-3); font-size:13.5px; color:var(--ink-2); border-bottom:1px solid var(--line)}
.sortrow select{font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:var(--r-s); padding:3px 6px}

/* 列表 */
.listhead{display:flex; justify-content:space-between; align-items:baseline; padding:9px var(--sp-3) 5px; font-size:12.5px; color:var(--ink-3)}
.list{list-style:none; margin:0; padding:0 0 var(--sp-5)}
.item{
  display:block; width:100%; text-align:left; padding:11px var(--sp-3) 11px 14px; border-left:3px solid transparent;
  border-bottom:1px solid var(--line); position:relative;
}
.item:hover{background:var(--t-paper)}
.item[aria-current="true"]{background:var(--brand-soft); border-left-color:var(--brand)}
.item .t{display:flex; gap:7px; align-items:baseline}
.item .t .name{font-weight:600; font-size:15px; line-height:1.45; flex:1; min-width:0; color:var(--ink)}
.item:hover .t .name{color:var(--brand-text)}
.item[aria-current="true"] .t .name{color:var(--brand-text)}
.item .path{font-size:12.5px; color:var(--ink-3); margin-top:2px}
.item .meta{display:flex; gap:9px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-2); margin-top:5px; font-family:var(--font-num)}
.item .meta .warn{color:var(--err)}
.item .meta .ok{color:var(--t-ok-strong)}
.dotstate{width:7px;height:7px;border-radius:50%;flex:none;margin-top:7px}
.s-wrong{background:var(--err)} .s-review{background:var(--need)} .s-mastered{background:var(--t-ok-strong)} .s-none{background:transparent; box-shadow:inset 0 0 0 1.5px var(--line)}

/* 详情 */
.detail{padding:var(--sp-5) var(--sp-4) 64px; min-width:0}
.dwrap{max-width:820px; margin:0 auto}
.crumb{font-size:13px; color:var(--ink-3); display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.crumb .sep{color:var(--line)}
.dtitle{font-size:26px; line-height:1.35; margin:10px 0 4px; letter-spacing:-.01em}
.badges{display:flex; gap:7px; flex-wrap:wrap; margin:10px 0 2px}
.badge{font-size:12.5px; border-radius:999px; padding:2.5px 10px; border:1px solid var(--line); color:var(--ink-2); background:var(--surface)}
.badge.b-must{background:var(--t-c38a-bg); border-color:var(--t-c38a-line); color:var(--brand-text)}
.badge.b-need{background:var(--need-soft); border-color:var(--need-line); color:var(--need)}
.badge.b-ext{background:var(--t-dig-bg); border-color:var(--t-dig-line); color:var(--t-dig-fg)}
.badge.b-wrong{background:var(--err-soft); border-color:var(--t-err-line); color:var(--t-err-fg)}
.badge.b-ok{background:var(--ok-soft); border-color:var(--t-ok-line); color:var(--t-ok-fg)}

.stats{display:flex; gap:0; flex-wrap:wrap; margin:var(--sp-4) 0; border:1px solid var(--line); border-radius:var(--r); overflow:hidden; background:var(--surface)}
.stats .cell{padding:10px 16px; border-right:1px solid var(--line); flex:1 1 96px; min-width:96px}
.stats .cell:last-child{border-right:0}
.stats .k{font-size:12px; color:var(--ink-3); letter-spacing:.02em}
.stats .v{font-family:var(--font-num); font-size:20px; line-height:1.3; font-weight:600}
.stats .v.small{font-size:15px; font-weight:500}

.sec{margin:var(--sp-5) 0 0}
.sechead{display:flex; align-items:baseline; gap:10px; margin-bottom:10px}
.sechead h2{font-size:15px; letter-spacing:.04em; color:var(--ink-2); text-transform:none}
.sechead .lv{font-family:var(--font-num); font-size:11.5px; color:#fff; background:var(--ink-2); border-radius:4px; padding:1px 6px; letter-spacing:.04em}
.sechead .hint{font-size:12.5px; color:var(--ink-3); margin-left:auto}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:var(--sp-4); box-shadow:var(--shadow)}
.oneline{font-size:19px; line-height:1.62; letter-spacing:.01em}
.kw{display:flex; gap:6px; flex-wrap:wrap; margin:12px 0 0}
.kw span{font-size:13px; background:var(--t-memo-bg); border:1px solid var(--t-memo-line); color:var(--t-memo-fg); border-radius:var(--r-s); padding:2px 9px}
.pit{margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); font-size:14.5px; color:var(--ink-2)}
.pit b{color:var(--accent); font-weight:600}

.tierbanner{display:flex; gap:8px; align-items:flex-start; font-size:13.5px; padding:9px 12px; border-radius:var(--r-s); margin-bottom:12px; border:1px solid}
.tb-textbook{background:var(--ok-soft); border-color:var(--t-ok-line); color:var(--t-ok-fg)}
.tb-paraphrase{background:var(--t-warm); border-color:var(--t-warm-line); color:var(--t-warm-fg)}
.tb-general{background:var(--t-dig-bg); border-color:var(--t-dig-line); color:var(--t-dig-fg)}
.tb-locator{background:var(--t-slate); border-color:var(--line); color:var(--ink-2)}

.seg{border:1px solid var(--line); border-radius:var(--r); background:var(--surface); padding:var(--sp-4); margin-bottom:12px}
.segtop{display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:12.5px; color:var(--ink-3); margin-bottom:8px}
.segtop .p{font-family:var(--font-num); background:var(--t-slate); border-radius:4px; padding:1px 7px; color:var(--ink-2)}
.segtop .tag{background:var(--brand-soft); color:var(--brand-text); border-radius:4px; padding:1px 7px}
.quote{font-size:15.5px; line-height:1.85; color:var(--ink); background:var(--t-paper2); border-left:3px solid var(--t-c38a-line); padding:10px 14px; border-radius:0 var(--r-s) var(--r-s) 0; white-space:pre-wrap; word-break:break-word}
.explain{margin-top:12px; font-size:15px; line-height:1.85; color:var(--ink-2)}
.explain .lab{display:inline-block; font-size:11.5px; letter-spacing:.04em; color:var(--accent); border:1px solid var(--t-warm-line); background:var(--t-warm); border-radius:4px; padding:0 6px; margin-right:6px; vertical-align:1px}

.shots{display:grid; gap:12px; grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){ .shots.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} }
.shot{border:1px solid var(--line); border-radius:var(--r); overflow:hidden; background:var(--t-paper); cursor:zoom-in}
.shot img{display:block; width:100%; height:auto}
.shot figcaption{font-size:12.5px; color:var(--ink-3); padding:7px 10px; border-top:1px solid var(--line); background:var(--surface)}
.noimg{font-size:13.5px; color:var(--ink-3); border:1px dashed var(--line); border-radius:var(--r); padding:14px; text-align:center}

.foot{margin-top:var(--sp-5); padding-top:14px; border-top:1px solid var(--line); font-size:12.5px; color:var(--ink-3); display:flex; gap:10px; flex-wrap:wrap; align-items:center}

.empty{padding:56px 20px; text-align:center; color:var(--ink-2)}
.empty h3{font-size:17px; margin-bottom:6px; color:var(--ink)}
.actions{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 0}
.btn{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:var(--r-s); padding:6px 12px; font-size:13.5px; color:var(--ink-2); background:var(--surface); text-decoration:none}
.btn:hover{border-color:var(--brand); color:var(--brand-text)}
.btn.primary{background:var(--brand); border-color:var(--brand); color:#fff}
.btn.primary:hover{color:#fff; filter:brightness(1.06)}

.lightbox{position:fixed; inset:0; background:var(--t-scrim); z-index:80; display:grid; place-items:center; padding:20px; cursor:zoom-out}
.lightbox[hidden]{display:none}
.lightbox img{max-width:min(1100px,96vw); max-height:92vh; border-radius:var(--r); box-shadow:0 20px 60px rgba(0,0,0,.4); background:#fff}
@media(prefers-reduced-motion:no-preference){
  .item,.chip,.fchip,.btn{transition:background .12s ease, border-color .12s ease, color .12s ease}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true">知</span>
    <span>知识点总览<small>三级总结 · 依据教材</small></span>
  </div>
  <span class="grow"></span>
  <button class="syncbadge" id="syncBadge" type="button" title="点击配置同步码"><span class="dot"></span><span id="syncText">读取本机记录…</span></button>
  <button class="iconbtn" id="themeBtn" aria-label="切换深浅主题">深浅</button>
</header>

<div class="banner" id="banner" hidden></div>

<dialog class="dlg" id="syncDlg">
  <h3>配置同步码</h3>
  <p class="tiny muted">填入你在主程序里设过的那串同步码，输一次本机记住。填对后错题、正确率、分类会按你的真实作答更新。</p>
  <input id="syncCodeInput" type="text" autocomplete="off" spellcheck="false" placeholder="例如 XK7-2418-9902">
  <p class="tiny muted" id="syncDlgHint"></p>
  <div class="dlgrow">
    <button class="btn" id="syncDlgClear" type="button">清除</button>
    <span class="grow"></span>
    <button class="btn" id="syncDlgCancel" type="button">取消</button>
    <button class="btn primary" id="syncDlgSave" type="button">保存并刷新</button>
  </div>
</dialog>

<main class="layout">
  <aside class="rail">
    <div class="searchwrap">
      <div class="searchbox">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="color:var(--ink-3);flex:none"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="搜知识点、关键词、原文…（按 / 聚焦）" autocomplete="off" aria-label="检索知识点">
        <kbd>/</kbd>
      </div>
      <div class="chips" id="stateChips" role="group" aria-label="按掌握状态筛选"></div>
    </div>

    <details class="filters" id="filters">
      <summary>更多筛选</summary>
      <div class="frow" data-dim="req"><span class="lab">要求</span></div>
      <div class="frow" data-dim="mod"><span class="lab">模块</span></div>
      <div class="frow" data-dim="tier"><span class="lab">口径</span></div>
      <div class="frow" data-dim="img"><span class="lab">截图</span></div>
    </details>

    <div class="sortrow">
      <label for="sort">排序</label>
      <select id="sort">
        <option value="syllabus">考纲顺序</option>
        <option value="weak">薄弱优先</option>
        <option value="count">题数多的在前</option>
        <option value="name">按名称</option>

<script>/* =========================================================================
   知识点总结软件 · 只读同步客户端（sxk-kp）
   目的：把主程序（sxk-ai-review）的作答记录与错题本读过来，用于「错题类/待复习/
   已掌握/未练」四档分类。
   边界（重要）：本文件**只读**，不写 localStorage、不回传云端。
   两个页面若互相写，同一份记录会被对方的旧快照覆盖；分类展示不需要写权限。
   协议与主程序保持逐字一致，由 tools/kp_step5_sync_contract.py 做漂移闸门。
   ========================================================================= */
(function (global) {
  'use strict';

  var NS = 'sxk.';
  var K_EP = NS + 'sync.endpoint.v1';
  var K_CODE = NS + 'sync.code.v1';
  var K_REC = NS + 'rec.v1';
  var K_MIS = NS + 'mis.v1';
  var K_MIS_DEL = NS + 'mis.del.v1';

  var DEFAULT_ENDPOINT = 'https://sxk-sync-api.pages.dev'; // 与主程序 DEFAULT_ENDPOINT 同值
  var KEY_PREFIX = 'sxk-sync-v1|';   // 主程序 keyFor(): SHA-256("sxk-sync-v1|"+code)
  var APP_ID = 'sxk-ai-review';      // 云端 payload.app，主程序 decryptPayload 校验
  var IV_BYTES = 12;                 // AES-GCM IV 长度；主程序 getRandomValues(new Uint8Array(12))
  var TIMEOUT_MS = 12000;

  var subtle = (global.crypto && global.crypto.subtle) ? global.crypto.subtle : null;
  var enc = new TextEncoder();
  var dec = new TextDecoder();

  function has(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }
  function badKey(k) { return k === '__proto__' || k === 'constructor' || k === 'prototype'; }

  /* 同步码规范化：去非十六进制、转大写、必须 32 位 —— 与主程序 normCode 同规则 */
  function normCode(raw) {
    var s = String(raw || '').toUpperCase().replace(/[^0-9A-F]/g, '');
    return s.length === 32 ? s : '';
  }
  function maskCode(code) {
    var c = normCode(code);
    return c ? (c.slice(0, 4) + '…' + c.slice(-4)) : '';
  }
  function normEndpoint(raw) {
    var s = String(raw || '').trim().replace(/\/+$/, '');
    if (!s) return '';
    var u;
    try { u = new URL(s); } catch (e) { return ''; }
    var local = (u.hostname === 'localhost' || u.hostname === '127.0.0.1');
    if (u.username || u.password) return '';
    if (u.protocol !== 'https:' && !(u.protocol === 'http:' && local)) return '';
    return u.origin + u.pathname.replace(/\/+$/, '');
  }

  function lsGet(key, dflt) {
    try {
      var raw = global.localStorage.getItem(key);
      if (raw === null || raw === undefined || raw === '') return dflt;
      return JSON.parse(raw);
    } catch (e) { return dflt; }
  }
  function lsGetStr(key) {
    try { return global.localStorage.getItem(key) || ''; } catch (e) { return ''; }
  }

  function b64ToBytes(str) {
    var bin = atob(String(str || '')), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }
  function bytesToHex(buf) {
    var a = new Uint8Array(buf), s = '';
    for (var i = 0; i < a.length; i++) s += ('0' + a[i].toString(16)).slice(-2);
    return s;
  }
  async function digestHex(str) {
    return bytesToHex(await subtle.digest('SHA-256', enc.encode(str)));
  }
  async function keyFor(code) {
    var h = await subtle.digest('SHA-256', enc.encode(KEY_PREFIX + code));
    return subtle.importKey('raw', h, 'AES-GCM', false, ['decrypt']);
  }
  async function decryptPayload(box, code) {
    if (!box || box.v !== 1 || !box.iv || !box.data) throw new Error('云端数据格式不对');
    var key = await keyFor(code);
    var plain;
    try {
      plain = await subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(box.iv) }, key, b64ToBytes(box.data));
    } catch (e) {
      throw new Error('同步码不匹配或云端数据损坏');
    }
    var obj = JSON.parse(dec.decode(plain));
    if (!obj || obj.app !== APP_ID || !obj.records || typeof obj.records !== 'object') {
      throw new Error('云端不是本程序的进度');
    }
    return obj;
  }

  function recValue(payload, key) {
    var env = payload && payload.records ? payload.records[key] : null;
    return env && typeof env === 'object' && has(env, 'v') ? env.v : null;
  }

  /* ---------- 合并：与主程序 mergeRecMaps / mergeMisList / mergeDelMaps 同规则 ---------- */
  function mergeRecMaps(local, remote) {
    var out = {}, k;
    local = (local && typeof local === 'object' && !Array.isArray(local)) ? local : {};
    remote = (remote && typeof remote === 'object' && !Array.isArray(remote)) ? remote : {};
    for (k in local) if (has(local, k) && !badKey(k)) out[k] = local[k];
    for (k in remote) {
      if (!has(remote, k) || badKey(k)) continue;
      var a = out[k], b = remote[k];
      if (!a || (Number(b && b.ts) || 0) > (Number(a && a.ts) || 0)) out[k] = b;
    }
    return out;
  }
  function mergeDelMaps(local, remote) {
    var out = {}, k;
    local = (local && typeof local === 'object' && !Array.isArray(local)) ? local : {};
    remote = (remote && typeof remote === 'object' && !Array.isArray(remote)) ? remote : {};
    for (k in local) if (has(local, k) && !badKey(k)) out[k] = Number(local[k]) || 0;
    for (k in remote) {
      if (!has(remote, k) || badKey(k)) continue;
      var t = Number(remote[k]) || 0;
      if (!has(out, k) || t > (Number(out[k]) || 0)) out[k] = t;
    }
    return out;
  }
  function mergeMisList(local, remote, tomb) {
    var map = Object.create(null), t = tomb || {};
    function put(m) {
      if (!m || !m.id || badKey(String(m.id))) return;
      map[String(m.id)] = m;
    }
    function list(v) { return Array.isArray(v) ? v : []; }
    list(local).forEach(put);
    list(remote).forEach(function (m) {
      if (!m || !m.id || badKey(String(m.id))) return;
      var a = map[String(m.id)];
      if (!a || (Number(m.ts) || 0) > (Number(a.ts) || 0)) map[String(m.id)] = m;
    });
    return Object.keys(map).map(function (k) {
      var m = map[k], tt = Number(t[k]) || 0;
      return (tt && (Number(m.ts) || 0) <= tt) ? null : m;
    }).filter(Boolean).sort(function (a, b) { return (Number(b.ts) || 0) - (Number(a.ts) || 0); });
  }

  /* ---------- 拉取 ---------- */
  async function api(conf, path) {
    var ctrl = new AbortController();
    var to = setTimeout(function () { ctrl.abort(); }, TIMEOUT_MS);
    try {
      return await fetch(conf.endpoint + path, {
        cache: 'no-store', signal: ctrl.signal, headers: { Accept: 'application/json' }
      });
    } finally { clearTimeout(to); }
  }
  async function pull(conf) {
    var id = await digestHex(conf.code);
    var r = await api(conf, '/v1/sync/' + id);
    if (r.status === 404) return null;
    if (!r.ok) throw new Error('云端返回 HTTP ' + r.status);
    var box = await r.json();
    if (!box || box.empty || !box.data) return null;
    return { payload: await decryptPayload(box, conf.code), updatedAt: box.updatedAt || 0 };
  }

  function friendly(e) {
    if (!e) return '网络错误';
    if (e.name === 'AbortError') return '连接超时';
    var m = String(e.message || '');
    if (/Failed to fetch|NetworkError|Load failed|Network request failed/i.test(m)) return '网络不可用或服务器地址错误';
    return m || '网络错误';
  }

  /* ---------- 对外接口 ---------- */
  var cache = null;

  function localSnapshot() {
    return {
      rec: lsGet(K_REC, {}) || {},
      mis: lsGet(K_MIS, []) || [],
      del: lsGet(K_MIS_DEL, {}) || {}
    };
  }
  function config() {
    var endpoint = normEndpoint(lsGetStr(K_EP) || DEFAULT_ENDPOINT) || DEFAULT_ENDPOINT;
    var code = normCode(lsGetStr(K_CODE));
    return { endpoint: endpoint, code: code, masked: maskCode(code) };
  }

  /* load({force:true}) → {rec, mis, del, meta}
     meta = {mode:'cloud'|'local'|'none', configured, at, error, codeMasked, endpoint}
     mode: cloud=云端拉取成功；local=有本地记录但没拉云端（未配码/失败）；none=本机完全没记录
     **任何失败都不抛**：分类退回本机记录，页面顶部提示一行即可。 */
  async function load(opts) {
    if (cache && !(opts && opts.force)) return cache;
    var conf = config();
    var snap = localSnapshot();
    var meta = {
      mode: 'local', configured: !!(conf.code && subtle), at: 0, error: '',
      codeMasked: conf.masked, endpoint: conf.endpoint, pushed: false
    };
    if (!conf.code || !subtle) {
      meta.mode = (Object.keys(snap.rec).length || snap.mis.length) ? 'local' : 'none';
      cache = { rec: snap.rec, mis: snap.mis, del: snap.del, meta: meta };
      return cache;
    }
    try {
      var got = await pull(conf);
      if (got && got.payload) {
        var rRec = recValue(got.payload, 'rec.v1');
        var rMis = recValue(got.payload, 'mis.v1');
        var rDel = recValue(got.payload, 'mis.del.v1');
        if (rRec && (typeof rRec !== 'object' || Array.isArray(rRec))) rRec = null;
        if (rMis && !Array.isArray(rMis)) rMis = null;
        if (rDel && (typeof rDel !== 'object' || Array.isArray(rDel))) rDel = null;
        snap.del = mergeDelMaps(snap.del, rDel || {});
        snap.rec = mergeRecMaps(snap.rec, rRec || {});
        snap.mis = mergeMisList(snap.mis, rMis || [], snap.del);
        meta.mode = 'cloud';
        meta.at = got.updatedAt || 0;
      } else {
        meta.mode = (Object.keys(snap.rec).length || snap.mis.length) ? 'local' : 'none';
        meta.at = 0;
      }
    } catch (e) {
      meta.mode = (Object.keys(snap.rec).length || snap.mis.length) ? 'local' : 'none';
      meta.error = friendly(e);
    }
    cache = { rec: snap.rec, mis: snap.mis, del: snap.del, meta: meta };
    return cache;
  }

  /* 四档判定：对一个知识点下的题 id 集合算状态
     qids: string[] → {total, practiced, wrong, correct, rate, state}
     state: 'wrong'（有活跃错题）| 'review'（无错题但练过错）| 'mastered'（练过全对）| 'none'（未练） */
  function stats(qids, data) {
    var rec = (data && data.rec) || {}, mis = (data && data.mis) || [];
    var ids = Array.isArray(qids) ? qids : [];
    var wrongSet = Object.create(null), i;
    for (i = 0; i < mis.length; i++) if (mis[i] && mis[i].id) wrongSet[String(mis[i].id)] = true;
    var practiced = 0, correct = 0, wrong = 0, missedOnce = 0;
    for (i = 0; i < ids.length; i++) {
      var id = String(ids[i]);
      if (wrongSet[id]) wrong++;
      var r = rec[id];
      if (r) {
        practiced++;
        if (r.ok === true) correct++;
        else missedOnce++;
      }
    }
    var total = ids.length;
    var state;
    if (wrong > 0) state = 'wrong';
    else if (practiced === 0) state = 'none';
    else if (correct === practiced && missedOnce === 0) state = 'mastered';
    else state = 'review';
    return {
      total: total, practiced: practiced, wrong: wrong, correct: correct,
      rate: practiced ? Math.round(correct / practiced * 100) : null,
      state: state
    };
  }

  global.KPSync = {
    load: load, stats: stats, config: config,
    normCode: normCode, maskCode: maskCode,
    /* 供探针/自测用：不参与页面渲染 */
    _merge: { rec: mergeRecMaps, mis: mergeMisList, del: mergeDelMaps },
    _const: { DEFAULT_ENDPOINT: DEFAULT_ENDPOINT, KEY_PREFIX: KEY_PREFIX, APP_ID: APP_ID, IV_BYTES: IV_BYTES }
  };
})(typeof window !== 'undefined' ? window : this);
</script>
