var KP_DATA = {"schema":"kp-1","count":107,"cards":[{"id":"kp-基础-人工智能定义-起源","模块":"基础模块","知识领域":"人工智能概述","知识单元":"人工智能基本概念","知识点":"人工智能定义、起源","要求":"理解","考纲来源":"官方","题数":20,"题id":["38A-A-01","38A-B-01","38A-F-05","TB-DX4-HW-01","TB-DX4-HW-02","TB-DX4-HW-03","TB-DX4-HW-04","TB-DX4-HW-46","TB-DX4-HW-61","TB-DX4-HW-62","TB-DX4-HW-67","TB-DX4-HW-69","SEC2-CH1-01","SEC2-CH1-04","DIG-01-01","DIG-01-02","DIG-01-03","DIG-01-04","DIG-01-05","DIG-01-06"],"教材":"yl","教材名":"人工智能引论","章节":"1.1 人工智能的起源","书内页":3,"PDF页":18,"状态":"完整","L1":{"一句话":"人工智能指以机器为载体实现的人类智能或生物智能；1955 年麦卡锡等人起草的达特茅斯项目建议书首次使用 artificial intelligence 一词，并把“用计算机模拟人的智能”列为前沿研究目标。","关键词":["达特茅斯","麦卡锡","以机器为载体","符号逻辑·联结主义·行为学派"],"易错点":"常把图灵测试（1950）当成“人工智能”一词的起点；术语起点是 1955 年项目建议书、1956 年达特茅斯会议。定义句的落点是“以机器为载体”，不是“机器像人一样思考”。"},"L2":{"档":"locator","段":[{"n":1,"文":"）学院开展“让机器能像人那样认知、思考和学习，即用计算机模拟人的智能”这样的前沿研究。这份项目建议书列举了人工智能需要研究的七个方面的问题，分别是自动计算模拟人脑高级功能、使用通用语言进行计算机编程以模仿人脑推理、神经元相互连接形成概念、对计算复杂性的度量、算法自我提升、算法的抽象能力和随机性与创造力。从那个时代开始，人工智能沿着模拟人类某方面功能（如感知、推理和运动等）而不断发展，如计算机视觉算法识别特定对象、自然语言理解算法进行人机问答、无人驾驶汽车在特定场景中行进等。从人工智能的计算性和智能性角度而言，可给出如下的人工智能定义：人工智能是以机器为载体实现的人类智能或生物智能。这里就产生了两个问题：承载计算之能的器械如何产生，如何利用计算之器来模拟人类智能。对前一个问题的研究使得人类从手工计算时代迈入了自动计算时代，对后一个问题的研究形成了符号逻辑（以推理为核心）、联结主义（以统计机器学习为手段）和行为学派（从环境交互过程中进行策略学习）等不同的人工智能研究方法。1.2可计算载体：形式化与机械化早期的数学概念（如公理或定理）一般通过自然语言来描述，如","页":"书内 p.3 / PDF p.18","书内页":3,"PDF页":18,"讲解":"这段话交代了三件事。第一，术语的出处：一份由麦卡锡等人起草的项目建议书，提出“让机器能像人那样认知、思考和学习，即用计算机模拟人的智能”，并列出七个值得研究的问题，从模拟人脑高级功能到算法的抽象能力与创造力。第二，教材给出的定义落点——“人工智能是以机器为载体实现的人类智能或生物智能”，重心在“载体是机器”，而不是“必须像人”。第三，由此派生的两条研究路线：器械（计算载体）怎么造，以及怎么用计算之器模拟智能；后者又分出符号逻辑、联结主义、行为学派三条路子。","讲解来源":"self","核对":"locator","原文核对":"无法比对"}]},"L3":{"img":"bookimg/yl-p18.jpg","页来源":"pdf-render","核对":"verified"}},{"id":"kp-基础-人工智能研究方向","模块":"基础模块","知识领域":"人工智能概述","知识单元":"人工智能的发展历史","知识点":"人工智能研究方向","要求":"知道","考纲来源":"官方","题数":16,"题id":["38A-B-10","38A-C-01","TB-DX4-HW-43","TB-DX4-HW-45","TB-DX4-HW-47","TB-DX4-HW-48","TB-DX4-HW-49","TB-DX4-HW-51","TB-DX4-HW-52","TB-DX4-HW-64","TB-DX4-HW-72","TB-DX4-HW-73","SEC2-CH1-02","SEC2-CH1-05","DIG-02-01","DIG-02-02"],"教材":"dx4","教材名":"大学信息技术4—人工智能基础与实践","章节":"1.2 人工智能研究内容","书内页":10,"PDF页":23,"状态":"完整","L1":{"一句话":"教材把人工智能的研究内容归纳为五部分：知识工程、机器感知、机器思维、机器学习、机器行为——考纲所说的“研究方向”就是这五块。","关键词":["知识工程","机器感知","机器思维","机器学习","机器行为"],"易错点":"容易只背“知识表示、推理”这类细项，漏掉五部分的总框架；也容易把“机器行为”当成机器人硬件，它指的是智能体对外表现出的行动能力。"},"L2":{"档":"locator","段":[{"n":1,"文":"定位说明：教材本节标题为「人工智能研究内容」，正文按知识工程、机器感知、机器思维、机器学习、机器行为五部分展开，即考纲所称「人工智能研究方向」；节首页 p.10 为总起段。\n1.2人工智能研究内容人工智能研究的内容涵盖面非常广，包括知识与推理、搜索与求解、学习与发现、发明与创造、感知与响应、记忆与联想、理解与交流等很多方面，本节将其归纳为知识工程、机器感知、机器思维、机器学习和机器行为五部分内容，进行简单介绍。1.2.1知识工程知识工程（KnowledgeEngineering）是在计算机上建立专家系统的技术。图灵奖获得者、知识工程的建立者费根鲍姆（Feigenbaum）将知识工程定义为：将知识集成到计算机系统从而完成只有特定领域专家才能完成的复杂任务。知识工程包括知识表示（KnowledgeRepresentation）、知识获取（KnowledgeAcquisition）、知识推理（KnowledgeReasoning）、知识集成（KnowledgeIntegration）和知识存储（KnowledgeStorage)等多个活动。在大数据时代，知识工程是从","页":"书内 p.10 / PDF p.23","书内页":10,"PDF页":23,"讲解":"这一段是本节的总起，作用是把“研究内容”收成一个可记忆的框架。教材先说研究面很广——知识与推理、搜索与求解、学习与发现、发明与创造、感知与响应、记忆与联想、理解与交流，然后用五部分归纳：知识工程（在计算机上建专家系统，含知识表示、获取、推理、集成）、机器感知、机器思维、机器学习、机器行为。考试里凡是问“人工智能包括哪些研究方向”，答案就是这五块；问某技术属于哪一块，按“感知—思维—学习—行为—知识”对号入座。","讲解来源":"self","核对":"locator","原文核对":"部分相符"}]},"L3":{"img":"bookimg/dx4-p23.jpg","focus":"img/kp-基础-人工智能研究方向.jpg","bbox":[0.0898,0.1026,0.9287,0.5749],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-人工智能流派","模块":"基础模块","知识领域":"人工智能概述","知识单元":"人工智能的发展历史","知识点":"人工智能流派","要求":"知道","考纲来源":"官方","题数":10,"题id":["TB-DX4-HW-05","TB-DX4-HW-63","TB-DX4-HW-65","TB-DX4-HW-66","TB-DX4-HW-68","TB-YL-HW-51","SEC2-CH1-03","DIG-03-01","DIG-03-02","DIG-03-03"],"教材":"dx4","教材名":"大学信息技术4—人工智能基础与实践","章节":"1.1.3 人工智能的学派","书内页":7,"PDF页":20,"状态":"完整","L1":{"一句话":"人工智能研究主要有三家代表性学派：符号主义、连接主义、行为主义——分别对应“用逻辑推理”“用统计学习”“从环境交互中学策略”三条路线。","关键词":["符号主义","连接主义","行为主义"],"易错点":"把符号主义说成“神经网络”，或把连接主义说成“专家系统”，正好互换；三家不是替代关系，而是长期并存的三条技术路线。"},"L2":{"档":"locator","段":[{"n":1,"文":"人工智能领域的派系之分由来已久，从人工智能历史来看，对于人工智能的研究主要有符号主义、连接主义和行为主义三家具有代表性的理论学派，三家学派都提出了自己的观点，它们的发展趋势反映了时代发展的特点。","页":"书内 p.7 / PDF p.20","书内页":7,"PDF页":20,"讲解":"这段话只是把三家的名字和关系摆出来：符号主义、连接主义、行为主义是三家有代表性的理论学派，各自有主张，其消长反映时代特点。它本身没有展开三家的技术细节，所以复习时要自己把对应关系补齐——符号主义对应逻辑与知识表示（专家系统），连接主义对应神经网络与统计机器学习，行为主义对应智能体与环境的交互、强化学习。教材在 1.1 节用一节篇幅讲学派，通常考“某方法属于哪一派”或“三派的根本分歧在哪”。","讲解来源":"self","核对":"locator","原文核对":"通过"}]},"L3":{"img":"bookimg/dx4-p20.jpg","focus":"img/kp-基础-人工智能流派.jpg","bbox":[0.0564,0.1922,0.893,0.5635],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-智能计算系统定义与组成","模块":"基础模块","知识领域":"人工智能概述","知识单元":"智能计算系统","知识点":"智能计算系统定义与组成","要求":"理解","考纲来源":"官方","题数":18,"题id":["TB-DX4-HW-07","TB-DX4-HW-44","TB-DX4-HW-71","TB-DX4-HW-74","TB-YL-HW-52","RAW-YL-9-04","RAW-YL-9-05","RAW-YL-9-06","RAW-YL-9-09","RAW-YL-9-10","SEC2-CH1-09","SEC2-CH1-10","SEC2-CH1-11","SEC2-PR1-01","SEC2-PR1-02","DIG-04-01","DIG-04-02","DIG-04-03"],"教材":"dx4","教材名":"大学信息技术4—人工智能基础与实践","章节":"1.4 智能计算系统","书内页":25,"PDF页":38,"状态":"完整","L1":{"一句话":"智能计算系统的硬件通常是异构系统（CPU＋智能芯片，如 GPU、TPU、寒武纪处理器），软件侧要提供编程环境，由前端编程语言、深度学习框架、编程平台三部分组成。","关键词":["异构系统","CPU＋智能芯片","GPU/TPU","前端语言·框架·平台"],"易错点":"把“编程环境”只记成深度学习框架，漏掉前端语言与编程平台；也容易把 CPU 当成可省略的部分——CPU 负责通用计算与系统控制，智能芯片负责并行数值计算，二者分工。"},"L2":{"档":"locator","段":[{"n":1,"文":"智能计算系统的硬件部分一般采用异构系统，即 CPU+智能芯片，这些智能芯片可以是图形处理单元（GPU）、张量处理单元（TPU）或者寒武纪深度学习处理器等。智能计算系统一般需要提供一套编程环境，编程环境主要包括了前端编程语言、深度学习框架和编程平台三部分。","页":"书内 p.25 / PDF p.38","书内页":25,"PDF页":38,"讲解":"这两句是本节的关键区分：硬件形态＝异构，即 CPU 加智能芯片；智能芯片列举了 GPU、TPU、寒武纪深度学习处理器。软件形态＝一套编程环境，含前端编程语言、深度学习框架、编程平台三部分。理解时抓住“分工”：CPU 是通才，管通用计算与系统控制；智能芯片是专才，管高效率、低成本的并行数值计算，所以异构比同构性能与能效更高。说这一定义时，“硬件形态—软件形态”要成对给出，只讲一半就不完整。","讲解来源":"self","核对":"locator","原文核对":"对不上"}]},"L3":{"img":"bookimg/dx4-p38.jpg","focus":"img/kp-基础-智能计算系统定义与组成.jpg","bbox":[0.0633,0.1156,0.8976,0.43],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-人工智能典型应用领域与场景","模块":"基础模块","知识领域":"人工智能概述","知识单元":"人工智能应用","知识点":"人工智能典型应用领域与场景","要求":"知道","考纲来源":"官方","题数":21,"题id":["38A-D-03","38A-D-09","38A-G-06","TB-DX4-HW-09","TB-DX4-HW-42","TB-DX4-HW-54","TB-DX4-HW-56","TB-DX4-HW-60","TB-DX4-HW-76","TB-DX4-HW-77","TB-DX4-HW-86","TB-DX4-HW-87","TB-DX4-HW-90","SEC2-CH1-08","SEC2-CH2-01","SEC2-CH2-03","SEC2-PR1-03","SEC2-PR2-01","DIG-05-01","DIG-05-02","DIG-05-03"],"教材":"dx4","教材名":"大学信息技术4—人工智能基础与实践","章节":"1.3 人工智能技术与应用","书内页":15,"PDF页":28,"状态":"完整","L1":{"一句话":"教材按技术方向组织典型应用：模式识别、自然语言处理、计算机视觉等；同一应用场景往往由多种技术共同支撑，只是侧重点不同。","关键词":["模式识别","自然语言处理","计算机视觉","多技术共同支撑"],"易错点":"把“应用领域”等同于“产品名称”（如人脸识别 App）；考试问的是技术方向。另一处易错是把模式识别与计算机视觉当成互斥的两块——教材把计算机视觉视为模式识别的一个重要方面。"},"L2":{"档":"locator","段":[{"n":1,"文":"定位说明：教材 §1.3「人工智能技术与应用」按模式识别、自然语言处理、计算机视觉等技术方向介绍典型应用，对应考纲「人工智能典型应用领域与场景」；节首 p.15 为总起段。\n1.3人工智能技术与应用目前，随着人工智能算法的不断改进、计算机网络技术尤其是移动互联网技术的广泛使用，人工智能技术已经应用到越来越多的领域。本节将从技术角度介绍人工智能常见的应用领域。当然，任何一种人工智能的应用场景都是由多种技术共同支撑而实现的，只是它们的侧重点各有不同。1.3.1模式识别模式识别（PatternRecognition，PR）是指对表征事物或现象的各种形式（数值、文字或逻辑关系）的信息进行处理和分析，以对事物或现象进行描述、辨认、分类和解释的过程，是信息科学和人工智能的重要组成部分。模式识别常用的算法有K近邻算法（K-NearestNeighbor，KNN）、贝叶斯分类器（BayesClassifier）和主成分分析法（PrincipalComponentsAnalysis，PCA）等。使用模式识别首先需采集生物特征信息，如指纹、人脸、语音等，接着需对原始数据进行预处理","页":"书内 p.15 / PDF p.28","书内页":15,"PDF页":28,"讲解":"这一段给出本节的组织方式：不从行业切入，而从技术切入——模式识别、自然语言处理、计算机视觉等，各自介绍典型应用。紧接着一句很关键的限定：任何一种人工智能应用场景都由多种技术共同支撑，只是侧重点不同。这句话是判断“某场景用了什么技术”类题目的依据——答案可以不止一个。随后教材先讲模式识别：对数值、文字或逻辑关系形式的信息进行处理分析，以描述、辨认、分类和解释事物，常用 KNN、贝叶斯分类器、主成分分析等算法。","讲解来源":"self","核对":"locator","原文核对":"部分相符"}]},"L3":{"img":"bookimg/dx4-p28.jpg","focus":"img/kp-基础-人工智能典型应用领域与场景.jpg","bbox":[0.0552,0.1107,0.8953,0.5855],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-多维数据的处理基础","模块":"基础模块","知识领域":"人工智能数据处理基础","知识单元":"Numpy 数据类型","知识点":"多维数据的处理基础","要求":"知道","考纲来源":"官方","题数":21,"题id":["TB-DX4-EX-01","TB-DX4-EX-02","TB-DX4-EX-03","TB-DX4-EX-04","TB-DX4-EX-05","TB-DX4-HW-123","TB-DX4-HW-124","TB-DX4-HW-133","TB-DX4-HW-134","TB-DX4-HW-135","TB-DX4-HW-142","TB-DX4-HW-17","TB-DX4-HW-18","TB-DX4-HW-19","SEC2-CH4-01","SEC2-CH4-02","SEC2-CH4-03","SEC2-PR4-01","SEC2-PR4-02","DIG-06-01","DIG-06-02"],"教材":"dx4","教材名":"大学信息技术4—人工智能基础与实践","章节":"4.1 NumPy 数据类型","书内页":160,"PDF页":173,"状态":"完整","L1":{"一句话":"NumPy 的核心是 ndarray，一个封装了相同数据类型的 n 维数组；靠 ndim、shape、size、dtype、itemsize 五个属性描述维数、形状、元素个数、元素类型与单元素字节数。","关键词":["ndarray","ndim/shape/size","dtype/itemsize","同类型元素"],"易错点":"把 shape 与 size 记混：shape 是尺寸元组（n 行 m 列即 (n,m)），size 是元素总个数（n×m）；也容易忽略“元素类型必须相同”这个前提。"},"L2":{"档":"locator","段":[{"n":1,"文":"定位说明：教材 §4.1.1 以 NumPy 的 ndarray 对象讲解一维、二维及多维数组的属性与索引，对应考纲「多维数据的处理基础」；节首 p.160 即 ndarray 定义段。\n4.1.1多维数组对象ndarrayNumPy的核心是ndarray对象。ndarray对象是封装了相同数据类型的n维数组，可以表示一维数组、二维数组以及多维数组。访问ndarray对象的属性值，可以获取数组的维数、形状、元素个数、数据类型等数据，narray对象的常用属性如下表4-1-1所示。表4-1-1ndarray对象的常用属性属性说明ndim返回整数，表示多维数组的维数shape返回整数元组，表示多维数组的尺寸，例如n行m列的数组的形状为（n，m）size返回整数，表示多维数组总的元素个数dtype返回data-type，表示多维数组元素的数据类型itemsize返回int，表示数组中每个元素的字节大小1.创建多维数组对象（1）一维数组对象的创建●调用array（）函数创建一维数组使用NumPy中的array（）函数可以创建一维数组，其格式如下所示：numpy.array(obje","页":"书内 p.160 / PDF p.173","书内页":160,"PDF页":173,"讲解":"这段是 ndarray 的定义与属性表，考试常直接考属性含义。要记牢：ndarray 是“同类型元素”的 n 维数组，可以是一维、二维或多维；五个属性分别是 ndim（维数，返回整数）、shape（尺寸元组，n 行 m 列写作 (n,m)）、size（元素总个数）、dtype（元素数据类型）、itemsize（每个元素占多少字节）。理解方式：shape 描述“怎么排”，size 描述“一共多少个”，二者相乘关系是 size＝各维长度的乘积；dtype 与 itemsize 描述“每个格子多大”。","讲解来源":"self","核对":"locator","原文核对":"部分相符"}]},"L3":{"img":"bookimg/dx4-p173.jpg","focus":"img/kp-基础-多维数据的处理基础.jpg","bbox":[0.107,0.0668,0.9402,0.3909],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-表格数据的处理基础","模块":"基础模块","知识领域":"人工智能数据处理基础","知识单元":"Pandas 数据类型","知识点":"表格数据的处理基础","要求":"知道","考纲来源":"官方","题数":22,"题id":["TB-DX4-EX-06","TB-DX4-EX-07","TB-DX4-EX-08","TB-DX4-EX-09","TB-DX4-EX-10","TB-DX4-HW-125","TB-DX4-HW-126","TB-DX4-HW-127","TB-DX4-HW-128","TB-DX4-HW-129","TB-DX4-HW-136","TB-DX4-HW-137","TB-DX4-HW-138","TB-DX4-HW-139","TB-DX4-HW-143","TB-DX4-HW-20","SEC2-CH4-04","SEC2-CH4-05","SEC2-PR4-03","SEC2-PR4-04","DIG-07-01","DIG-07-02"],"教材":"dx4","教材名":"大学信息技术4—人工智能基础与实践","章节":"4.2 Pandas 数据类型","书内页":176,"PDF页":189,"状态":"完整","L1":{"一句话":"Pandas 是 Python 的第三方数据分析库，代码风格接近 NumPy，但在表格数据处理上更有优势；两种常用数据结构是 Series（带索引的一维数组）与 DataFrame（二维表）。","关键词":["Series","DataFrame","values/index","Anaconda 默认集成"],"易错点":"把 Series 说成“二维表”，或把 DataFrame 说成“只能存数值”；Series 的 values 存值、index 存索引，二者要分开说。"},"L2":{"档":"locator","段":[{"n":1,"文":"4.2Pandas数据类型Pandas是Python的一个第三方库，由PyData团队开发，常用于数据分析。Pandas的代码风格与NumPy相似，但在表格数据的处理上更有优势。Pandas拥有更加便捷的数据载人方法，提供对缺失数据处理和数据归一化处理，同时支持数据格式转换，以及过滤重复数Series和据，是一个优秀的数据处理分析工具。Pandas有两种常用的数据类型DataFrame。Pandas库已被默认安装在Anaconda中。由于使用Pandas库时，往往需要使用到NumPy库，因此本节下文的描述中，默认已将这两个库同时导人，代码如下：import pandas as pdimportnumpyasnp4.2.1SeriesSeries是一种带索引（Index）的类似一维数组的数据结构。它拥有两个属性values和index：values是一indexvalues个值数组，用于存储一组任","页":"书内 p.176 / PDF p.189","书内页":176,"PDF页":189,"讲解":"这段交代 Pandas 的定位与两种数据结构。定位：第三方库、PyData 团队开发、常用于数据分析、风格像 NumPy 但更擅长表格；优势具体列了四件——便捷的数据载入、缺失数据处理与归一化、数据格式转换、过滤重复数据。数据结构只有两种：Series 与 DataFrame。Series 被定义为“带索引的类似一维数组的结构”，拥有 values（存值）与 index（索引）两个属性；DataFrame 是二维表。教材还提醒 Pandas 默认装在 Anaconda 里，用之前通常连同 NumPy 一起导入。","讲解来源":"self","核对":"locator","原文核对":"通过"}]},"L3":{"img":"bookimg/dx4-p189.jpg","focus":"img/kp-基础-表格数据的处理基础.jpg","bbox":[0.1047,0.1018,0.9436,0.5871],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-Matplotlib-绘图基础","模块":"基础模块","知识领域":"人工智能数据处理基础","知识单元":"数据可视化","知识点":"Matplotlib 绘图基础","要求":"掌握","考纲来源":"官方","题数":11,"题id":["TB-DX4-EX-11","TB-DX4-HW-130","TB-DX4-HW-131","TB-DX4-HW-132","TB-DX4-HW-141","TB-DX4-HW-22","SEC2-CH4-11","DIG-08-03","DIG-08-04","DIG-08-05","DIG-08-06"],"教材":"dx4","教材名":"大学信息技术4—人工智能基础与实践","章节":"4.4 数据可视化","书内页":207,"PDF页":220,"状态":"完整","L1":{"一句话":"Matplotlib 是基于 Python 的开源绘图包，用一行行函数调用就能画出折线图、直方图、条形图、散点图等专业图表，是“字不如表、表不如图”的落地工具。","关键词":["开源绘图包","折线图/直方图/条形图/散点图","pyplot"],"易错点":"把“直方图（hist）”与“条形图（bar）”当成同一个：直方图看分布，条形图比大小；也容易忘记 matplotlib 需要在 Notebook 里加内联显示设置。"},"L2":{"档":"locator","段":[{"n":1,"文":"4.4数据可视化数据可视化是指将采集或模拟的数据用统计图表和信息图方式呈现，从而明确、清晰、直观、有效地传递信息。简而言之，字不如表，表不如图。4.4.1Matplotlib基础Matplotlib是基于Python语言的开源项目，旨在为Python提供一个数据绘图包，实现专业的绘图功能。Matplotlib可以方便地完成绘图，生成折线图、直方图、条形图、散点图等。如需要获得更加完整的函数资料，可以访问Matplotlib官网。在浏览器中输人网址https：//matplotlib.org/，进人Matplotlib官网查询界面，如图4-4-1所示。在右上角的搜索栏中输人Matplotlib函数名直接进行搜索，可以查找到更加具体的函数定义和解释。matpltlibInstallationDocumentationExamplesTutorialsContributingMatplotio.Python plottingmodulesMatplotlib:VisualizationwithPythonLatestrelease3.3.1:","页":"书内 p.207 / PDF p.220","书内页":207,"PDF页":220,"讲解":"这段先给数据可视化下定义：把采集或模拟的数据用统计图表和信息图呈现，从而清晰直观地传递信息，并用“字不如表，表不如图”点出价值。然后落到 Matplotlib：Python 的开源项目，目标是提供数据绘图包、实现专业绘图，能方便地生成折线图、直方图、条形图、散点图等。学习路径上教材建议直接查官网（matplotlib.org）搜函数名，这提示考试不会考冷门参数，而是考“哪种图用来干什么”以及基本调用顺序（准备数据—绘图—设置—显示）。","讲解来源":"self","核对":"locator","原文核对":"通过"}]},"L3":{"img":"bookimg/dx4-p220.jpg","focus":"img/kp-基础-Matplotlib-绘图基础.jpg","bbox":[0.0587,0.1059,0.8999,0.6205],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-常见图表类型绘制-2D-散点图-3D-散点图-折线图-条形图-箱型图-饼图等","模块":"基础模块","知识领域":"人工智能数据处理基础","知识单元":"数据可视化","知识点":"常见图表类型绘制（2D 散点图、3D 散点图、折线图、条形图、箱型图、饼图等）","要求":"掌握","考纲来源":"官方","题数":13,"题id":["38A-A-12","TB-DX4-EX-12","TB-DX4-HW-144","TB-DX4-HW-145","TB-DX4-HW-146","TB-DX4-HW-21","TB-DX4-HW-23","SEC2-CH4-09","SEC2-CH4-10","SEC2-PR4-05","SEC2-PR4-06","DIG-08-01","DIG-08-02"],"教材":"dx4","教材名":"大学信息技术4—人工智能基础与实践","章节":"4.4 数据可视化（常见图表）","书内页":211,"PDF页":224,"状态":"完整","L1":{"一句话":"Matplotlib 用一组同名函数对应一类图：scatter 散点图、plot 折线图、bar 条形图、boxplot 箱型图、pie 饼图；散点图用于看两变量的相关性与趋势。","关键词":["scatter/plot/bar/boxplot/pie","相关性","2D 与 3D 散点"],"易错点":"把函数名与图种对错位（如用 bar 画饼图）；也容易把散点图的用途说成“看分布形状”，教材强调的是判断两变量是否相关、强弱、正负与趋势。"},"L2":{"档":"locator","段":[{"n":1,"文":"定位说明：教材 §4.4.2「常见图表类型」列出 scatter、plot、bar、boxplot、pie 等绘制函数及示例，对应考纲「常见图表类型绘制」；节首 p.211 为图表类型总起段。\nFigure1口y=sin（x)andy=cos（x)1.000.750.500.250.000.25-0.50-0.751.00x=6.30152y=-0.489915图443函数sinx和cosx在[0.2π]上的图象4.4.2常见图表类型Matplotlib提供了丰富的图形绘制函数，如scatter（散点图）、plot（折线图）、bar（条形图）、boxplot（箱型图）、pie（饼图）等。1.2D散点图2D散点图，顾名思义就是由一些散乱的点组成的2D图表，这些点在哪个位置，是由其X值和Y值确定的。2D散点图通常用于研究两组变量之间的数据相关性。从散点图可以简单判断两个变量是否有相关关系、相关关系的强弱、是正相关还是负相关、相关的趋势如何等。Pyplot模块提供了scatter（）函数绘制2D散点图，其常用格式如下所示：matplotlib.pyplot.scatter(x,y,s,","页":"书内 p.211 / PDF p.224","书内页":211,"PDF页":224,"讲解":"这段列出“图—函数”的对应表：scatter 散点图、plot 折线图、bar 条形图、boxplot 箱型图、pie 饼图，并说明 Matplotlib 提供的是丰富但成体系的绘制函数。接着专门讲 2D 散点图：图上每个点的位置由 X 值和 Y 值决定，因此它最典型的用途是研究两组变量之间的数据相关性——从点的分布可以粗略判断是否相关、相关强弱、正相关还是负相关、趋势如何。记忆方法：要比较“两组数有没有关系”就用散点图，要看“随时间怎么变”才用折线图。","讲解来源":"self","核对":"locator","原文核对":"部分相符"}]},"L3":{"img":"bookimg/dx4-p224.jpg","focus":"img/kp-基础-常见图表类型绘制-2D-散点图-3D-散点图-折线图-条形图-箱型图-饼图等.jpg","bbox":[0.0575,0.3868,0.8953,0.5293],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-机器学习定义及原理","模块":"基础模块","知识领域":"机器学习基础","知识单元":"机器学习基本概念","知识点":"机器学习定义及原理","要求":"理解","考纲来源":"官方","题数":7,"题id":["38A-B-02","TB-DX4-HW-162","TB-DX4-HW-172","TB-DX4-HW-24","TB-DX4-HW-50","SEC2-CH1-07","DIG-10-05"],"教材":"yl","教材名":"人工智能引论","章节":"4.1 机器学习基本概念","书内页":99,"PDF页":114,"状态":"完整","L1":{"一句话":"机器学习通过对数据的优化学习，建立能刻画数据中语义概念或分布结构等信息的模型；训练就是用有标签或无标签数据不断优化模型参数，从而提升性能。","关键词":["优化学习","建模型","有标签/无标签","参数优化"],"易错点":"把机器学习说成“让计算机自己写规则”；它是从数据里拟合出映射，规则由参数承载，不是人工写死的 if-else。"},"L2":{"档":"locator","段":[{"n":1,"文":"定位说明：教材 §4.1「机器学习基本概念」开篇给出机器学习的定义（通过对数据的优化学习建立模型），对应考纲「机器学习定义及原理」；节首 p.99 为定义段。\n4.1机器学习基本概念4.1机器学习基本概念机器学习基本概念机器学习通过对数据的优化学习，建立能够刻画数据中所蕴含语义概念或分布结构等信息的模型。在模型学习过程中，采用合适手段利用有标签数据或无标签数据，对模型参数不断进行优化，从而提升模型性能。从数据利用的角度，可将机器学习划分为监督学习（supervisedlearning）、无监督学习（unsupervisedlearning）及半监督学习（semi-supervisedlearning）等。监督学习是一种在实践中运用最为广泛的机器学习方法，其目标是给定带有标注信息数据的训练集D={（x，y）}=1，学习一个从输入x到输出y的映射。x可以是文档、图像、音频或蛋白质结构等数据或者数据的特征表达，y：为所对应的论文类别、人脸对象、歌曲语音或生命功能等语义内容，其中D被称为训练集，n是训练样例的数量。监督学习算法从假设空间学习得到一个最优映","页":"书内 p.99 / PDF p.114","书内页":99,"PDF页":114,"讲解":"这段是机器学习的定义句，两个动作要分清：一是“建立模型”，模型要能刻画数据里蕴含的语义概念或分布结构；二是“优化参数”，用合适手段拿有标签或无标签数据反复调整参数，把性能提上去。随后教材按“数据利用方式”做第一次分类：监督学习、无监督学习、半监督学习。并以监督学习为例给出形式化写法——给定带标注的训练集 D={(x,y)}，学习从输入 x 到输出 y 的映射，x 可以是文档、图像、音频，y 是对应类别。这段话是后面所有算法（分类、回归、聚类）的共同起点。","讲解来源":"self","核对":"locator","原文核对":"部分相符"}]},"L3":{"img":"bookimg/yl-p114.jpg","focus":"img/kp-基础-机器学习定义及原理.jpg","bbox":[0.1013,0.0252,0.9402,0.4153],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-无监督学习-聚类-特征降维-概念","模块":"基础模块","知识领域":"机器学习基础","知识单元":"机器学习基本概念","知识点":"无监督学习（聚类、特征降维）概念","要求":"理解","考纲来源":"官方","题数":13,"题id":["38A-D-02","GUIDE-SINGLE-01","TB-DX4-HW-150","TB-DX4-HW-167","TB-DX4-HW-169","TB-DX4-HW-170","TB-DX4-HW-176","TB-DX4-HW-177","TB-DX4-HW-188","TB-DX4-HW-29","TB-DX4-HW-33","TB-YL-HW-05","SEC2-PR5-03"],"教材":"yl","教材名":"人工智能引论","章节":"4.1 机器学习基本概念；4.5 聚类；4.7 无监督降维","书内页":99,"PDF页":114,"状态":"完整","L1":{"一句话":"无监督学习用没有标注的数据建模，典型任务是聚类（把相似样本分成若干簇）与特征降维（把高维压到低维，如主成分分析）。","关键词":["无标注","聚类","降维","PCA"],"易错点":"把聚类说成“有监督的分类”——聚类没有标签，簇的含义事后才解释；降维不等于“删掉几列”，它常是重新构造低维特征。"},"L2":{"档":"locator","段":[{"n":1,"文":"习基本概念4.1机器学习基本概念机器学习基本概念机器学习通过对数据的优化学习，建立能够刻画数据中所蕴含语义概念或分布结构等信息的模型。在模型学习过程中，采用合适手段利用有标签数据或无标签数据，对模型参数不断进行优化，从而提升模型性能。从数据利用的角度，可将机器学习划分为监督学习（supervisedlearning）、无监督学习（unsupervisedlearning）及半监督学习（semi-supervisedlearning）等。监督学习是一种在实践中运用最为广泛的机器学习方法，其目标是给定带有标注信息数据的训练集D={（x，y）}=1，学习一个从输入x到输出y的映射。x可以是文档、图像、音频或蛋白质结构等数据或者数据的特征表达，y：为所对应的论文类别、人脸对象、歌曲语音或生命功能等语义内容，其中D被称为训练集，n是训练样例的数量。监督学习算法从假设空间学习得到一个最优映射函数f（又称决策函数），映射函数f将输入数据映射到语义标注空间，实现数据的分类和识别。无监督学习则是直接从无标签数据{x，i=1，\"，n}出发学习映射函数，而半监督学习在学习映射函","页":"书内 p.99 / PDF p.114","书内页":99,"PDF页":114,"讲解":"这段话先建立三分法：按数据利用方式分为监督学习、无监督学习、半监督学习；无监督学习的关键特征就是数据本身不带标注。在此基础上教材展开监督学习的形式化描述（训练集 D={(x,y)}、学习映射 f、f 又称决策函数），用来对照说明“无监督缺少 y”。理解要点是把两类任务的产出对比记：监督学习产出“输入到标签的映射”，无监督学习产出的是数据自身的结构——聚类给出分组，降维给出低维表示。考试常以“下列属于无监督学习的是”形式出现，聚类与降维（PCA）是标准答案。","讲解来源":"self","核对":"locator","原文核对":"通过"}]},"L3":{"img":"bookimg/yl-p114.jpg","focus":"img/kp-基础-无监督学习-聚类-特征降维-概念.jpg","bbox":[0.1013,0.0252,0.9402,0.4153],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-有监督学习-分类-回归-概念","模块":"基础模块","知识领域":"机器学习基础","知识单元":"机器学习基本概念","知识点":"有监督学习（分类、回归）概念","要求":"理解","考纲来源":"官方","题数":18,"题id":["TB-DX4-HW-148","TB-DX4-HW-153","TB-DX4-HW-156","TB-DX4-HW-158","TB-DX4-HW-178","TB-DX4-HW-184","TB-DX4-HW-186","TB-DX4-HW-208","TB-DX4-HW-26","TB-YL-HW-04","TB-YL-HW-23","SEC2-CH5-05","SEC2-CH5-06","SEC2-CH5-07","SEC2-PR2-02","SEC2-PR6-03","DIG-09-01","DIG-09-02"],"教材":"yl","教材名":"人工智能引论","章节":"4.1 机器学习基本概念","书内页":99,"PDF页":114,"状态":"完整","L1":{"一句话":"有监督学习用带标注的数据学习输入到输出的映射：输出是离散类别时称分类，输出是连续数值时称回归。","关键词":["有标签","映射 f","分类（离散）","回归（连续）"],"易错点":"用“数据量大小”区分分类与回归（判据是输出类型）；也容易把“逻辑回归”当成回归任务——名字里有回归，做的是分类。"},"L2":{"档":"locator","段":[{"n":1,"文":"定位说明：教材 §4.1 按数据利用方式把机器学习划分为监督学习、无监督学习与强化学习，并说明监督学习使用有标签数据，对应考纲「有监督学习（分类、回归）概念」；节首 p.99 为该分类段。\n4.1机器学习基本概念4.1机器学习基本概念机器学习基本概念机器学习通过对数据的优化学习，建立能够刻画数据中所蕴含语义概念或分布结构等信息的模型。在模型学习过程中，采用合适手段利用有标签数据或无标签数据，对模型参数不断进行优化，从而提升模型性能。从数据利用的角度，可将机器学习划分为监督学习（supervisedlearning）、无监督学习（unsupervisedlearning）及半监督学习（semi-supervisedlearning）等。监督学习是一种在实践中运用最为广泛的机器学习方法，其目标是给定带有标注信息数据的训练集D={（x，y）}=1，学习一个从输入x到输出y的映射。x可以是文档、图像、音频或蛋白质结构等数据或者数据的特征表达，y：为所对应的论文类别、人脸对象、歌曲语音或生命功能等语义内容，其中D被称为训练集，n是训练样例的数量。监督学习算法从假设空间学习得到一个最优映","页":"书内 p.99 / PDF p.114","书内页":99,"PDF页":114,"讲解":"这段仍是 4.1 节的总起段，重点在监督学习：它是在实践中运用最广泛的方法，目标是给定带标注的训练集 D={(x,y)}，学习从输入 x 到输出 y 的映射。教材随后说明 x 与 y 可以是什么（文档/图像/音频 → 类别、人脸、语音、生命功能），并给出术语：D 是训练集，n 是训练样例数量，学到的映射函数 f 又称决策函数。判断分类还是回归，只看 y：离散或定性（是否生病、是否垃圾邮件）就是分类，连续或定量就是回归。这也是后面线性回归、KNN、决策树各归其位的依据。","讲解来源":"self","核对":"locator","原文核对":"部分相符"}]},"L3":{"img":"bookimg/yl-p114.jpg","focus":"img/kp-基础-有监督学习-分类-回归-概念.jpg","bbox":[0.1013,0.0252,0.9402,0.4153],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-数据预处理-含特征工程","模块":"基础模块","知识领域":"机器学习基础","知识单元":"机器学习基本概念","知识点":"数据预处理（含特征工程）","要求":"掌握","考纲来源":"官方","题数":13,"题id":["TB-DX4-EX-14","TB-DX4-HW-166","TB-DX4-HW-38","TB-YL-HW-25","TB-YL-HW-58","SEC2-CH4-06","SEC2-CH4-07","SEC2-CH4-08","SEC2-CH5-03","SEC2-PR5-01","SEC2-EX6-02","DIG-09-03","DIG-13-01"],"教材":"dx4","教材名":"大学信息技术4—人工智能基础与实践","章节":"4.3 表格数据处理","书内页":197,"PDF页":210,"状态":"完整","L1":{"一句话":"数据预处理主要处理两类脏数据：缺失值（用 dropna 删除、用填充补上）与重复值；处理完再做统计分析与特征加工，才谈得上建模。","关键词":["缺失值","dropna","重复数据","统计分析"],"易错点":"以为 dropna 会修改原对象——默认返回新对象、不改原数据；axis=0 与 axis=1 记反（0 沿列方向检查、删行，1 沿行方向检查、删列）。"},"L2":{"档":"locator","段":[{"n":1,"文":"4.3表格数据处理Pandas中的DataFrame适合处理表格数据，它支持对获取的原始数据进行进一步的加工和再处理。这里的处理包括对数据进行预处理和对数据进行统计分析。前者包括缺失数据的处理和重复数据的处理，后者包括应用统计函数和分组运算。4.3.1数据预处理数据预处理包括对缺失数据处理和重复数据的处理。1.缺失数据的处理对缺失数据的处理主要包括缺失数据的清除或填充，Pandas为DataFrame数据提供了对应的处理函数。（1）缺失数据的清除dropna（）函数用于删除缺失值所在的行或列，在默认情况下返回新的对象，同时该函数不会改变原始对象，其格式如下：DataFrame.dropna(axis=0,how='any',thresh=None,inplace=False,...)其中，axis表示删除缺失值所在的行或者列，值为0表示沿列方向检查删除行，值为1表示沿行方向检查删除列；how表示是否全为缺失值才进行移除，值为any表示行/列中只要包含缺失值就会进行移除，值为all表示行/列","页":"书内 p.197 / PDF p.210","书内页":197,"PDF页":210,"讲解":"这段先给 DataFrame 的用途定位：适合处理表格数据，支持对原始数据进一步加工，处理分两类——预处理与统计分析；预处理含缺失数据处理与重复数据处理，统计分析含统计函数与分组运算。接着讲缺失值处理的两条路：清除与填充，并给出 dropna 的函数签名 DataFrame.dropna(axis=0, how='any', thresh=None, inplace=False)。参数含义要逐一看：axis=0 表示沿列方向检查、删除缺失值所在的行，axis=1 则删列；how 控制“全部缺失才删”还是“任一缺失就删”；inplace 决定是否原地修改。这段是操作类考题的高频出处。","讲解来源":"self","核对":"locator","原文核对":"通过"}]},"L3":{"img":"bookimg/dx4-p210.jpg","focus":"img/kp-基础-数据预处理-含特征工程.jpg","bbox":[0.0564,0.1124,0.8907,0.6238],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-模型训练基本概念","模块":"基础模块","知识领域":"机器学习基础","知识单元":"机器学习基本概念","知识点":"模型训练基本概念","要求":"掌握","考纲来源":"官方","题数":14,"题id":["38A-A-14","38A-C-02","38A-D-05","38A-E-06","38A-E-07","GUIDE-CODE-03","TB-DX4-HW-174","TB-DX4-HW-28","TB-DX4-HW-75","TB-YL-HW-21","SEC2-CH2-02","SEC2-CH5-01","SEC2-PR5-02","DIG-09-05"],"教材":"yl","教材名":"人工智能引论","章节":"4.1 机器学习基本概念","书内页":99,"PDF页":114,"状态":"完整","L1":{"一句话":"训练就是在训练集上反复调整模型参数、让损失尽量小的过程；参数不是人定的，是数据“优化”出来的，训练完成即得到可用模型。","关键词":["参数优化","迭代","损失","泛化"],"易错点":"把“模型结构”与“模型参数”混为一谈：结构是人设计的（层数、核大小），参数是训练学出来的（权重、偏置）。"},"L2":{"档":"locator","段":[{"n":1,"文":"定位说明：教材 §4.1 讲模型学习过程中对模型参数不断优化、提升性能，对应考纲「模型训练基本概念」；节首 p.99 为训练概念总起段。\n4.1机器学习基本概念4.1机器学习基本概念机器学习基本概念机器学习通过对数据的优化学习，建立能够刻画数据中所蕴含语义概念或分布结构等信息的模型。在模型学习过程中，采用合适手段利用有标签数据或无标签数据，对模型参数不断进行优化，从而提升模型性能。从数据利用的角度，可将机器学习划分为监督学习（supervisedlearning）、无监督学习（unsupervisedlearning）及半监督学习（semi-supervisedlearning）等。监督学习是一种在实践中运用最为广泛的机器学习方法，其目标是给定带有标注信息数据的训练集D={（x，y）}=1，学习一个从输入x到输出y的映射。x可以是文档、图像、音频或蛋白质结构等数据或者数据的特征表达，y：为所对应的论文类别、人脸对象、歌曲语音或生命功能等语义内容，其中D被称为训练集，n是训练样例的数量。监督学习算法从假设空间学习得到一个最优映","页":"书内 p.99 / PDF p.114","书内页":99,"PDF页":114,"讲解":"这段是训练概念的总起：机器学习通过对数据的优化学习建立模型，在模型学习过程中用合适手段（有标签或无标签数据）对模型参数不断优化，从而提升性能。抓住三层含义：训练的对象是“参数”，不是结构；训练的手段是“优化”，通常靠迭代与损失下降；训练的目的写在“提升模型性能”上，而性能最终要在没见过的数据上体现（即泛化）。这段话虽然短，却是后面损失函数、梯度下降、反向传播三节的共同前提——它们都在回答“参数怎么被优化”。","讲解来源":"self","核对":"locator","原文核对":"部分相符"}]},"L3":{"img":"bookimg/yl-p114.jpg","focus":"img/kp-基础-模型训练基本概念.jpg","bbox":[0.1013,0.0252,0.9402,0.4153],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-性能评估","模块":"基础模块","知识领域":"机器学习基础","知识单元":"机器学习基本概念","知识点":"性能评估","要求":"掌握","考纲来源":"官方","题数":12,"题id":["38A-B-04","TB-DX4-HW-173","TB-DX4-HW-179","TB-DX4-HW-181","TB-DX4-HW-189","TB-DX4-HW-25","TB-YL-HW-73","SEC2-CH5-02","SEC2-PR2-07","SEC2-PR5-06","SEC2-EX5-02","DIG-09-04"],"教材":"yl","教材名":"人工智能引论","章节":"4.2 模型评估与参数估计","书内页":100,"PDF页":115,"状态":"完整","L1":{"一句话":"性能评估看模型在训练集与测试集上表现是否一致，也就是泛化能力；衡量差异靠损失函数，常用 0-1、平方、绝对、对数（对数似然）四种。","关键词":["泛化能力","损失函数","0-1/平方/绝对/对数"],"易错点":"把“训练集准确率高”当成性能好——真正的判据是测试集；也容易把 0-1 损失与准确率混为一谈（前者是错误率口径的损失，后者是正确比例）。"},"L2":{"档":"locator","段":[{"n":1,"文":"定位说明：教材 §4.2「模型评估与参数估计」讲泛化能力、损失函数与模型性能度量，对应考纲「性能评估」；节首 p.100 为评估概念总起段。\n4.2模型评估与参数估计机器学习模型评估与参数估计在机器学习中，需要保证模型在训练集上所取得的性能与在测试集上所取得的性能保持一致，即模型具有泛化能力（generalization）。将映射函数记为f，第i个训练数据记为（x，y)，f对x的预测结果记为y（即=f(x)），可定义损失函数Loss（f(x)，y）来估量预测值和真实值y之间的差异。显然，在训练过程中希望映射函数在训练集上的累加差异最小，即min≥Loss（f(x)，y)。i=1常用的损失函数包括0-1损失函数、平方损失函数、绝对损失函数和对数损失函数（又称为对数似然函数）。表4.1给出了若干损失函数的定义。表4.1常见损失函数的定义损失函数名称损失函数定义{1,f（x）≠yLoss（y，f（x,））=0-1损失函数0,f（x,）=y平方损失函数Loss（y，f（x;))=（y-f（x））²绝对损失函数Loss（yf（x））=1y","页":"书内 p.100 / PDF p.115","书内页":100,"PDF页":115,"讲解":"这段把评估的前提说清楚了：模型在训练集上的性能和测试集上必须一致，这个一致性就叫泛化能力。随后给出估计差异的工具——损失函数 Loss(f(x), y)，用来度量预测值与真实值的差距；训练时希望训练集上的累加差异最小，即最小化各样本损失之和。教材列了四种常用损失：0-1 损失（预测错记 1、对记 0）、平方损失、绝对损失、对数损失（又称对数似然函数）。复习时把“泛化”当结论、把“损失”当度量，二者不要混着答：泛化是目标，损失是可计算的代理指标。","讲解来源":"self","核对":"locator","原文核对":"部分相符"}]},"L3":{"img":"bookimg/yl-p115.jpg","focus":"img/kp-基础-性能评估.jpg","bbox":[0.1116,0.0782,0.8941,0.4373],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-线性回归","模块":"基础模块","知识领域":"机器学习基础","知识单元":"机器学习基础方法","知识点":"线性回归","要求":"掌握","考纲来源":"官方","题数":20,"题id":["38A-A-04","38A-H-02","TB-DX4-EX-15","TB-DX4-HW-159","TB-DX4-HW-160","TB-DX4-HW-161","TB-DX4-HW-163","TB-DX4-HW-164","TB-DX4-HW-165","TB-DX4-HW-182","TB-DX4-HW-183","TB-DX4-HW-192","TB-DX4-HW-193","TB-YL-EX-11","SEC2-CH5-08","SEC2-CH5-09","SEC2-CH5-10","SEC2-PR5-04","SEC2-PR5-05","SEC2-EX5-03"],"教材":"dx4","教材名":"大学信息技术4—人工智能基础与实践","章节":"5.3 回归","书内页":261,"PDF页":274,"状态":"完整","L1":{"一句话":"线性回归用一条最佳拟合线（回归线）在因变量 Y 与自变量 X 之间建立关系；一个自变量叫一元线性回归，两个及以上叫多元线性回归。","关键词":["最佳拟合线","一元/多元","连续输出"],"易错点":"把“逻辑回归”归到回归类——教材明确：预测变量离散或定性时属于分类，逻辑回归属于该类；线性回归只做连续量预测。"},"L2":{"档":"locator","段":[{"n":1,"文":"称为多元多项式回归。多项式回归问题可以通过变量转换化为多元线性回归问题来解决。5.3.2线性回归线性回归依据回归的目标可分为两类：如果预测的变量是离散的或定性的，称其为分类，如医生判断病人是否生病，收件箱对邮件分为正常邮件和垃圾邮件等。逻辑回归属于该类。如果预测的变量是连续的或定量的，则称其为回归。本节只讨论回归问题。线性回归使用最佳的拟合线（回归线）在因变量Y和自变量X间建立一种关系。线性回归模型是线性预测函数，模型参数通过样本数据来估计。在这种技术中，自变量可以是连续的也可以是离散的。常见的线性回归有一元线性回归和多元线性回归。如果回归分析中只包括一个自变量和一个因变量，且二者的关系可用一条直线近似表示，称为一元线性回归分析，也称为单变量线性回归。在二维空间线性是一条直线。它是线性回归最简单的形式。如果回归分析中包括两个或两个以上的自变量，且因变量和自变量之间是线性关系，则称为多元线性回归分析。在三维空间线性关系表示一个平面，在多维空间线性关系表示一个超平面。1.一元线性回归一元线性回归用来分析单个输入变量影响输出变量的问题，例如可使用一元线性回归模","页":"书内 p.261 / PDF p.274","书内页":261,"PDF页":274,"讲解":"这段先给回归与分类划界：预测变量离散或定性（是否生病、是否垃圾邮件）叫分类，逻辑回归属于这一类；预测变量连续或定量才叫回归。本节只讨论回归。接着定义线性回归：用最佳的拟合线在因变量 Y 和自变量 X 间建立关系，模型是线性预测函数，参数由样本数据估计；自变量可以是连续也可以是离散。细分两种：只含一个自变量与一个因变量、关系可用直线近似，是一元（单变量）线性回归，二维空间里就是一条直线；含两个以上自变量且关系线性，是多元线性回归，三维空间里表现为一个平面。","讲解来源":"self","核对":"locator","原文核对":"通过"}]},"L3":{"img":"bookimg/dx4-p274.jpg","focus":"img/kp-基础-线性回归.jpg","bbox":[0.0506,0.3477,0.8895,0.6963],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-K-近邻算法","模块":"基础模块","知识领域":"机器学习基础","知识单元":"机器学习基础方法","知识点":"K 近邻算法","要求":"掌握","考纲来源":"官方","题数":13,"题id":["38A-H-01","GUIDE-CODE-04","TB-DX4-EX-13","TB-DX4-HW-154","TB-DX4-HW-155","TB-DX4-HW-157","TB-DX4-HW-175","TB-DX4-HW-180","TB-DX4-HW-191","TB-DX4-HW-31","TB-DX4-HW-32","SEC2-CH5-11","SEC2-EX5-01"],"教材":"dx4","教材名":"大学信息技术4—人工智能基础与实践","章节":"5.2 分类","书内页":253,"PDF页":266,"状态":"完整","L1":{"一句话":"KNN 的分类流程是：算新样本与所有已知样本的距离，取距离最近的 K 个（K 通常不超过 20），按这 K 个里出现次数最多的类别给新样本定类。","关键词":["距离","K 个最近邻","多数投票","惰性学习"],"易错点":"以为 KNN 需要先训练出参数——它是惰性的，把样本存下来、预测时才算距离；也容易把 K 取偶数（二分类时票数可能打平，通常取奇数）。"},"L2":{"档":"locator","段":[{"n":1,"文":"LogisticRegression，逻辑回归）算法、决策树（DecisionTree）算法、SVM（SupportVectorMachine）算法、ANN（ArtificialNeuralNetwork，人工神经网络）算法等。本节将通过KNN算法介绍分类算法的原理和实现方法。5.2.2KNN算法1.KNN算法概述K-近邻算法通过计算不同特征之间的距离进行分类。它输人新样本及K的工作原理是：存在一个样本集，样本集中每个样本都存在标签，即已知每一个样本与所属类别的对应关系。输人没有标签计算新样本与每个已知样本的距离的新样本后，将新样本与数据集中已有的所有样本进行逐一比较，选择样本数据集中前K个最相似的样本（这就是K-近邻对距离排序，得到K个最算法中K的出处，通常K是不大于20的数）。根据这K个样近邻样本本中出现次数最多的类别作为新样本的类别。统计K-最近邻样本中每个使用K-近邻算法将未知类别属性的数据划分到某个类类标号出现的次数中，其基本过程如下：·计算已知类别数据集中的点与当前点之间的距离；选择出现频率最大的类标号作为测试数据的类标号·按照距离递增升序排","页":"书内 p.253 / PDF p.266","书内页":253,"PDF页":266,"讲解":"这段讲 KNN 的完整判定链条，值得按顺序背：前提是有标签的样本集；输入无标签新样本后，把它与数据集里所有样本逐一比较、计算距离；对距离排序，取前 K 个最相似的样本（K 通常不大于 20，这正是“K-近邻”里 K 的出处）；最后统计这 K 个样本中每个类标号出现的次数，把出现次数最多的类别作为新样本的类别。理解要点：KNN 没有显式训练过程，模型的“知识”就是整个样本集；K 越小越受噪声影响，K 越大越平滑。教材把它放在分类算法一节，与逻辑回归、决策树、SVM、ANN 并列。","讲解来源":"self","核对":"locator","原文核对":"通过"}]},"L3":{"img":"bookimg/dx4-p266.jpg","focus":"img/kp-基础-K-近邻算法.jpg","bbox":[0.061,0.0733,0.8976,0.1995],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-K-Means-聚类","模块":"基础模块","知识领域":"机器学习基础","知识单元":"机器学习基础方法","知识点":"K-Means 聚类","要求":"掌握","考纲来源":"官方","题数":16,"题id":["38A-G-11","38A-I-01","TB-DX4-HW-147","TB-DX4-HW-149","TB-DX4-HW-151","TB-DX4-HW-152","TB-DX4-HW-190","TB-DX4-HW-30","TB-YL-HW-24","TB-YL-HW-71","TB-YL-HW-72","SEC2-CH5-12","SEC2-CH5-13","SEC2-PR5-07","SEC2-PR5-08","SEC2-EX5-04"],"教材":"dx4","教材名":"大学信息技术4—人工智能基础与实践","章节":"5.4 聚类","书内页":275,"PDF页":288,"状态":"完整","L1":{"一句话":"K-Means 是最简单的无监督学习算法之一，属于基于划分的聚类：以距离衡量相似性，把样本划成 K 个紧凑且相互独立的簇。","关键词":["无监督","基于划分","距离","簇"],"易错点":"把 K-Means 当成分类（它没有标签，簇号本身没有语义）；也容易说它“一定得到全局最优”——结果依赖初始中心，常需多次初始化。"},"L2":{"档":"locator","段":[{"n":1,"文":"据点划分到不同的簇中，最直接的方法就是计算数据点之间的相似性，从而将相似的数据点划分到同一簇中。数据之间的相似性也可以用距离远近来表示。在聚类算法中，距离计算方法与分类算法相类似，具体的计算公式可参见5.2.1节。聚类算法可应用于市场分析、商业经营、图像处理、决策支持以及模式识别等领域，主要算法包括以下几类：基于分层的聚类算法、基于划分的聚类算法、基于密度的聚类算法、基于网格的聚类算法、基于模型的聚类算法等。在不同的应用场景中，以上算法的表现各有优劣。本节将通过K-Means算法介绍聚类算法的实现方法。5.4.2 K-Means聚类算法1.K-Means聚类算法概述K-Means算法是一种最简单的无监督学习算法，其属于基于划分的聚类算法，也被誉为数据挖掘的十大经典算法之一。K-Means聚类算法利用距离作为两个数据记录相似性的评价指标，两个数据的距离越近，其相似度越大。该算法认为簇是由距离相近的对象组成的，因此把得到紧凑且独立的作为最终目标。K-Means聚类算法可以描述为：给定样本数据集D={x，x2，，xm），x；是一个n维的向量，代表数据集中的","页":"书内 p.275 / PDF p.288","书内页":275,"PDF页":288,"讲解":"这段先给聚类的一般逻辑：把数据点划分到不同簇，最直接的办法是算相似性，相似性用距离远近表示，距离算法与分类一节相同。然后列聚类算法的五类：基于分层、基于划分、基于密度、基于网格、基于模型，并说明不同场景各有优劣。最后落到 K-Means：它是最简单的无监督学习算法，属于基于划分的一类，被誉为数据挖掘十大经典算法之一；以距离作为两条记录相似性的评价指标，距离越近相似度越大；算法的目标是得到“紧凑且独立”的簇。这段是判断“某算法属于哪类聚类”的直接依据。","讲解来源":"self","核对":"locator","原文核对":"通过"}]},"L3":{"img":"bookimg/dx4-p288.jpg","focus":"img/kp-基础-K-Means-聚类.jpg","bbox":[0.0564,0.1116,0.8941,0.5855],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-PCA","模块":"基础模块","知识领域":"机器学习基础","知识单元":"机器学习基础方法","知识点":"PCA","要求":"知道","考纲来源":"官方","题数":11,"题id":["TB-DX4-HW-168","TB-DX4-HW-171","TB-DX4-HW-187","TB-DX4-HW-194","TB-YL-HW-26","TB-YL-HW-27","SEC2-CH5-14","SEC2-CH5-15","SEC2-CH5-16","SEC2-CH5-17","SEC2-PR5-09"],"教材":"dx4","教材名":"大学信息技术4—人工智能基础与实践","章节":"5.5 降维","书内页":289,"PDF页":302,"状态":"完整","L1":{"一句话":"PCA（主成分分析）是最基本的无监督降维算法：把 n 维特征映射到 k 维，这 k 维是重新构造出来的相互正交的新特征，称为主成分。","关键词":["无监督降维","正交","主成分","n 维→k 维"],"易错点":"以为 PCA 只是“挑几个原特征留下”——它是线性组合出新特征；也容易把 PCA 与 LDA 混：PCA 不看标签，LDA 用类别信息（监督降维）。"},"L2":{"档":"locator","段":[{"n":1,"文":"分析（PrincipalComponentAnalysis，PCA）算法。除此之外，还有线性判别分析（LinearDiscriminantAnalysis，LDA）、多维标度分析（MultidimensionalScaling，MDS）、局部线性嵌人（LocallyLinearEmbedding，LLE)等。本节将通过PCA算法介绍降维算法的实现方法。5.5.2PCA降维算法1.PCA算法概述PCA（PrincipalComponentAnalysis，主成分分析）是一种使用最广泛的降维算法，也是最基本的无监督降维算法。PCA的主要思想是将n维特征映射到k维上，这k维特征是在原有n维特征的基础上重新构造出来的新的正交特征，因此也被称为主成分。所谓正交是指两个向量的夹角为90度，对于三维空间来说，正交可以简单地理解为垂直。也就是说，PCA将一系列可能相关联的高维变量，减少为一系列被称为主成分的低维度的线形无关的合成变量，并且要使得数据的主要信息保留下来。一个二维数据集可以通过把点投影到一个一维低维度子空间来减少维度，这样，数据集中的每一个实例会由单个值来","页":"书内 p.289 / PDF p.302","书内页":289,"PDF页":302,"讲解":"这段先摆出降维算法家族：PCA 之外还有线性判别分析（LDA）、多维标度分析（MDS）、局部线性嵌入（LLE）等。然后讲 PCA 的思想：把 n 维特征映射到 k 维上，这 k 维不是在原特征里挑，而是在原有 n 维基础上重新构造出来的新正交特征，因此叫“主成分”。教材还专门解释正交——两个向量夹角 90 度，三维空间里可简单理解为垂直。换成一句话：PCA 把一组可能彼此相关的高维变量，压缩成一组低维、线性无关的合成变量，同时尽量保住原数据的信息。一个关键判断：PCA 属于无监督降维，不需要标签。","讲解来源":"self","核对":"locator","原文核对":"通过"}]},"L3":{"img":"bookimg/dx4-p302.jpg","focus":"img/kp-基础-PCA.jpg","bbox":[0.2094,0.2533,0.7411,0.3738],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-人工神经网络基础","模块":"基础模块","知识领域":"深度学习基础","知识单元":"神经网络基本概念","知识点":"人工神经网络基础","要求":"掌握","考纲来源":"官方","题数":23,"题id":["38A-B-07","38A-G-08","TB-DX4-HW-195","TB-DX4-HW-196","TB-DX4-HW-197","TB-DX4-HW-200","TB-DX4-HW-201","TB-DX4-HW-207","TB-DX4-HW-209","TB-DX4-HW-211","TB-DX4-HW-213","TB-DX4-HW-216","TB-DX4-HW-55","TB-YL-HW-31","TB-YL-HW-76","TB-YL-HW-77","SEC2-CH6-01","SEC2-CH6-02","SEC2-CH6-03","SEC2-CH6-04","SEC2-CH6-05","SEC2-CH6-06","SEC2-PR2-03"],"教材":"yl","教材名":"人工智能引论","章节":"5.1 人工神经网络概述","书内页":139,"PDF页":154,"状态":"完整","L1":{"一句话":"人工神经网络始于 1943 年麦卡洛克与皮茨提出的 MCP 神经元：对输入信号线性加权组合，再用符号函数输出结果，用来模拟大脑的活动模式。","关键词":["MCP 神经元","1943","线性加权＋符号函数","神经网络雏形"],"易错点":"把 MCP 说成“多层网络”——它只是单个神经元模型；也容易把年份记成 1956（那是达特茅斯会议）。"},"L2":{"档":"locator","段":[{"n":1,"文":"5.1人工神经网络概述5.1人工神经网络概述长久以来，研究者不断探索人类认知的神经基础，这不仅需要精确刻画不同层面的认知现象（如从所观测行为来推测神经元、神经系统和神经回路的工作机理），进而对在不同层面所观测现象人工神经网络概述之间的因果联系在现有计算载体上进行机械实现，以启发人工智能模型来提高性能和扩展认知能力。1943年，神经科学家瓦伦·麦卡洛克（WarrenMcCulloch）和逻辑学家沃尔特·皮茨（WalterPitts）合作提出了“McCulloch-Pitts（MCP）neuron”的思想。MCP可对输入信号进行线性加权组合，再用符号函数来输出线性加权组合结果，以模拟大脑复杂的活动模式。MCP是最早的神经网络雏形（McCullocheta","页":"书内 p.139 / PDF p.154","书内页":139,"PDF页":154,"讲解":"这段讲神经网络的起点。前面一句交代动因：研究者想刻画认知的神经基础，并把这些机理在现有计算载体上“机械实现”，用来启发人工智能模型。接着给出关键史实：1943 年，神经科学家麦卡洛克与逻辑学家皮茨合作提出 McCulloch-Pitts（MCP）神经元思想。MCP 做两件事：对输入信号进行线性加权组合；再用符号函数把加权结果输出，从而模拟大脑复杂的活动模式。教材明确称 MCP 为“最早的神经网络雏形”。考试常考“神经网络最早模型是什么、谁提出、哪一年、做了什么运算”，四个点要齐。","讲解来源":"self","核对":"locator","原文核对":"通过"}]},"L3":{"img":"bookimg/yl-p154.jpg","focus":"img/kp-基础-人工神经网络基础.jpg","bbox":[0.107,0.0269,0.9482,0.4169],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-前向传播","模块":"基础模块","知识领域":"深度学习基础","知识单元":"神经网络基本概念","知识点":"前向传播","要求":"掌握","考纲来源":"官方","题数":10,"题id":["38A-A-21","TB-DX4-HW-217","SEC2-CH6-12","DIG-10-03","DIG-10-04","DIG-21-03","DIG-21-04","DIG-21-05","DIG-21-06","DIG-21-07"],"教材":"yl","教材名":"人工智能引论","章节":"5.2 前馈神经网络","书内页":141,"PDF页":156,"状态":"完整","L1":{"一句话":"前馈神经网络由输入层、隐藏层、输出层组成，每层神经元只与相邻层相连，信息从输入层逐层向后传到输出层，这个方向单向的过程就是前向传播。","关键词":["输入层—隐藏层—输出层","逐层传递","同层不连","单向"],"易错点":"以为同层神经元之间有连接（教材明确：同一层内没有任何连接）；也容易忽略“后续层不向前序层回传信息”这个限定——回传是反向传播的事。"},"L2":{"档":"locator","段":[{"n":1,"文":"定位说明：教材 §5.2「前馈神经网络」讲输入层—隐藏层—输出层的逐层信息传递（后文即前向传播），对应考纲「前向传播」；节首 p.141 为网络结构总起段。\n5.2前馈神经网络5.2前馈神经网络前馈神经网络作为最基础的神经网络，一般包括输入层、隐藏层和输出层。每层神经元只和相邻层的神经元相连，即每层神经元只接收相邻前序神经层中神经元传来的信息，只给相邻后续神经层中的神经元传递信息。在前馈神经网络中，同一层的神经元之间没有任何连接，后续神经层不向其前序相邻神经层传递任何信息。前馈神经网络是目前应用最为广泛的神经网络之一。在正式介绍前馈神经网络之前，先介绍神经元、感知机和激活函数等概念。5.2.1神经元在生物学中，神经元细胞有兴奋与抑制两种状态。大多数神经元细胞在正常情况下处于抑制状态，一旦某个神经元受到刺激并且电位超过一定的阈值，这个神经元x1细胞就被激活，处于兴奋状态，并向其他WiX2W2神经元传递信息。基于神经元细胞的结如果（·）>0，则输出1X3Wixi构特性与信息传递方式，神经科学家瓦W'3=1如果D（·）0，则输出0线性加权求和输出伦·","页":"书内 p.141 / PDF p.156","书内页":141,"PDF页":156,"讲解":"这段是前馈网络的结构总述，前向传播的定义就藏在这里。三条结构约束要逐条记住：网络一般包括输入层、隐藏层、输出层；每层神经元只和相邻层相连，只接收相邻前序层传来的信息、只向相邻后续层传递信息；同一层神经元之间没有任何连接，后续层不向前序层传任何信息。由此得到“前馈”二字的含义——信息单向流动。前向传播就是输入数据沿这个方向一层层算出输出的过程；与之相对，误差从输出端往回传的是反向传播。判断“前向/反向”类题目，看信息流向即可。","讲解来源":"self","核对":"locator","原文核对":"部分相符"}]},"L3":{"img":"bookimg/yl-p156.jpg","focus":"img/kp-基础-前向传播.jpg","bbox":[0.1116,0.0228,0.9551,0.3119],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-激活函数","模块":"基础模块","知识领域":"深度学习基础","知识单元":"神经网络基本概念","知识点":"激活函数","要求":"理解","考纲来源":"官方","题数":12,"题id":["38A-C-06","38A-F-06","TB-DX4-HW-34","TB-DX4-HW-36","TB-DX4-HW-37","TB-YL-HW-30","SEC2-CH6-07","SEC2-CH6-08","SEC2-CH6-09","SEC2-CH6-10","SEC2-PR6-01","DIG-10-01"],"教材":"yl","教材名":"人工智能引论","章节":"5.2 前馈神经网络","书内页":141,"PDF页":156,"状态":"完整","L1":{"一句话":"激活函数把线性加权求和的结果与阈值比较后转成输出：以符号函数为例，累加值 ≥0 输出 1，<0 输出 −1，从而使感知机能做两类线性分类。","关键词":["线性加权求和","偏置 b","阈值","符号函数"],"易错点":"以为激活函数只是“可选项”——没有它，多层网络等价于一层线性变换；也容易忘记偏置项 b 属于加权求和的组成部分。"},"L2":{"档":"locator","段":[{"n":1,"文":"经网络，称为感知机。早期的感知机结构和MCP模型相似，由一个输人层和一个输出层构成，因此也被称为“单层感知机”。感知机的输入层负责接收实数值的输入向量，输出层则能输出1或一1两个值。单层感知机可作为一种两类线性分类模型，如图5.2所示。X1W1X2W2X3W'3如果Φ（·）≥0，wix+bΦ(·)如果D（·)<0，Wn激活函数输出线性加权求和图5.2感知机模型对于具有n个输入及对应连接权重系数为w的感知机，首先通过线性加权得到输人数据的累加结果x=wx+w2x2++b。这里x，x2，，x,为感知机的输人，b为偏置项（bias）。然后将作为激活函数Φ（·）的输人，激活函数会将与某一阈值（此例中阈值为0）进行比较，如果大于该值，则感知器输出为1；否则输出为-1。通过这样的操作，输入数据被分类为1或一1这两个不同类别。单层感知机与MCP模型在连接权重的设置上不同，即感知机中的连接权重参数并不是预先设定好的，而是通过多次迭代训练得到的。具体而言，单层感知机通过构建损失函数来计算模型预测值与数据真实值之间的“误差”，通过最小化损失函数取值来优化模型参数。","页":"书内 p.141 / PDF p.156","书内页":141,"PDF页":156,"讲解":"这段以感知机为例把激活函数的作用讲透。感知机由输入层与输出层构成（单层感知机），输入层接收实数值向量，输出层输出 1 或 −1。计算分两步：先做线性加权，把 n 个输入 x 各自乘权重 w 再求和并加偏置 b，得到累加结果；再把这个结果作为激活函数 Φ(·) 的输入，Φ 将它与阈值（本例为 0）比较——大于等于 0 输出 1，小于 0 输出 −1，于是输入被分成两类。教材还点出感知机与 MCP 的关键差别：MCP 的连接权重是预设的，感知机的权重是通过多次迭代训练得到的。这解释了为什么“学习”发生在权重上。","讲解来源":"self","核对":"locator","原文核对":"对不上"}]},"L3":{"img":"bookimg/yl-p156.jpg","focus":"img/kp-基础-激活函数.jpg","bbox":[0.1116,0.0228,0.9551,0.3119],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-损失函数","模块":"基础模块","知识领域":"深度学习基础","知识单元":"神经网络基本概念","知识点":"损失函数","要求":"理解","考纲来源":"官方","题数":7,"题id":["38A-B-05","38A-B-06","DIG-10-02","DIG-23-02","DIG-23-03","DIG-23-04","DIG-23-05"],"教材":"yl","教材名":"人工智能引论","章节":"5.3 神经网络参数优化","书内页":147,"PDF页":162,"状态":"完整","L1":{"一句话":"损失函数又称代价函数，用来计算模型预测值与真实值之间的误差；神经网络训练就是用它算出误差、再据此优化参数，最常用均方误差与交叉熵。","关键词":["代价函数","误差度量","均方误差","交叉熵"],"易错点":"把损失函数与激活函数混为一谈；也容易把“损失越小”直接等同于“泛化越好”——损失是在训练数据上算的。"},"L2":{"档":"locator","段":[{"n":1,"文":"利用反向传播算法将损失函数计算所得误差从输出端出发，由后向前传递给神经网络中的每个单元，然后通过梯度下降算法对神经网络中的参数进行更新。随着迭代的进行，模型预测所得与真实值y之间的误差逐步缩小，模型预测准确率得以提升，预测的能力得以增强，当选代达到一定轮次或准确率达到一定水平时，则可认为模型参数已被优化完毕。5.3.1损失函数损失函数（lossfunction）又称为代价函数（costfunction），用来计算模型预测值与真实值之间的误差。损失函数是神经网络设计中的一个重要组成部分。通过定义与任务相关的良好损失函数，在训练过程中可根据损失函数来计算神经网络的误差大小，进而优化神经网络参数。下面介绍两种最常用的损失函数：均方误差损失函数和交叉熵损失函数。1.均方误差损失函数均方误差损失函数通过计算预测值与实际值之间距离（即误差）的平方来衡量模","页":"书内 p.147 / PDF p.162","书内页":147,"PDF页":162,"讲解":"这段给出损失函数的定义与作用链：先由反向传播把损失函数算出的误差从输出端由后向前传给网络中每个单元，再由梯度下降更新参数；迭代下去，预测值与真实值 y 的误差逐步缩小，准确率上升；当迭代到一定轮次或准确率达到一定水平，就认为参数优化完毕。定义句很明确：损失函数又称代价函数，用来计算模型预测值与真实值之间的误差，是神经网络设计的重要组成部分——损失选得好不好，直接决定训练往哪个方向走。教材接着介绍两种最常用损失：均方误差（用误差平方衡量）与交叉熵。","讲解来源":"self","核对":"locator","原文核对":"通过"}]},"L3":{"img":"bookimg/yl-p162.jpg","focus":"img/kp-基础-损失函数.jpg","bbox":[0.1185,0.0236,0.9597,0.1621],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-过拟合与欠拟合","模块":"基础模块","知识领域":"深度学习基础","知识单元":"神经网络基本概念","知识点":"过拟合与欠拟合","要求":"理解","考纲来源":"官方","题数":10,"题id":["38A-A-05","38A-C-04","38A-D-06","38A-F-04","38A-G-04","TB-DX4-HW-27","TB-YL-HW-74","SEC2-CH5-04","DIG-09-06","DIG-09-07"],"教材":"yl","教材名":"人工智能引论","章节":"4.2 模型评估与参数估计（过拟合与欠拟合）","书内页":101,"PDF页":116,"状态":"完整","L1":{"一句话":"过拟合是模型把训练数据的细节甚至噪声也学了进去，表现为训练集表现好、新数据表现差；缓解办法是正则化，用来提升泛化能力。","关键词":["过拟合","正则化","泛化能力","参数过多"],"易错点":"以为过拟合只发生在小数据上——教材明确指出深度神经网络结构复杂、参数众多，本身就很容易过拟合；也容易把“训练误差大”叫过拟合（那是欠拟合）。"},"L2":{"档":"locator","段":[{"n":1,"文":"深度神经网络结构复杂、参数众多，很容易造成过拟合（over-fitting）。为了缓解神经网络在训练过程中出现的过拟合现象，需要采取一些正则化技术来提升神经网络的泛化能力（generalization）。","页":"书内 p.101 / PDF p.116","书内页":101,"PDF页":116,"讲解":"这段话很短但信息密度高。第一句给出成因：深度神经网络结构复杂、参数众多，因此很容易造成过拟合（over-fitting）。第二句给出对策：为了缓解训练过程中的过拟合，需要采取一些正则化技术来提升神经网络的泛化能力。理解要点是把三者串起来——参数容量过大 → 模型记住了训练集的偶然细节 → 在新数据上表现下降（过拟合）→ 用正则化约束模型复杂度 → 泛化能力回升。反向的欠拟合则是模型太简单、训练集上都学不好。答题时“过拟合＝训练好测试差”这个对照一定要写出来。","讲解来源":"self","核对":"locator","原文核对":"对不上"}]},"L3":{"img":"bookimg/yl-p116.jpg","focus":"img/kp-基础-过拟合与欠拟合.jpg","bbox":[0.1001,0.0252,0.9425,0.3721],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-序贯模型-Sequential","模块":"基础模块","知识领域":"深度学习基础","知识单元":"典型神经网络基础","知识点":"序贯模型（Sequential）","要求":"掌握","考纲来源":"官方","题数":15,"题id":["GUIDE-READ-06","TB-DX4-EX-16","TB-DX4-EX-17","TB-DX4-HW-210","TB-DX4-HW-215","TB-DX4-HW-218","TB-DX4-HW-39","SEC2-CH6-13","SEC2-CH6-14","SEC2-CH6-15","SEC2-CH6-16","SEC2-PR6-04","SEC2-PR6-05","SEC2-PR6-06","SEC2-EX6-01"],"教材":"dx4","教材名":"大学信息技术4—人工智能基础与实践","章节":"6.3 神经网络构建","书内页":320,"PDF页":333,"状态":"完整","L1":{"一句话":"Keras 的 Sequential 是序贯模型：把网络层按顺序线性堆叠即可搭出 CNN、RNN 等模型；标准流程是载入数据、预处理、构建模型、compile 编译、fit 训练、评估与预测。","关键词":["Sequential","线性堆叠","compile/fit","六步流程"],"易错点":"把 compile 与 fit 的作用记反——compile 配置优化器与损失，fit 才真正训练；也容易漏掉“数据预处理”这一步，直接跳到建模。"},"L2":{"档":"locator","段":[{"n":1,"文":"’tf version:',tf._version打印keras的版本信息print(kerasvexsion:',tf.kexas._versiontfversion:2.3.1keras version:2.4.0In[]:图63-2例6-3-1程序在JupyterNotebook运行结果Sequential模型（序贯模型）。通过对Sequential模型进行简单的网络层线性堆叠，就可以构建出卷积神经网络（CNN）、循环神经网络（RNN）等复杂的神经网络模型。利用Keras构建神经网络模型时，主要步骤为：载人数据、数据预处理、构建Sequential模型、利用compile函数进行编译、利用fit函数训练模型、模型的评估和对新数据的预测。例6-3-2利用Keras构建神经网络模型，对FashionMNIST数据集进行分类。FashionMNIST数据集由大小为28×28、分为10个类别的70000张灰色图像组成，其中60000张训练集图像，以及10000张测试集图像，类别标签与图像所表示的服装类别对应关系如表6-3-1所示。▼表63-1类别标签与服装","页":"书内 p.320 / PDF p.333","书内页":320,"PDF页":333,"讲解":"这段是 Keras 建模的骨架。先说 Sequential 模型是什么：通过简单地线性堆叠网络层，就能构建出卷积神经网络、循环神经网络这类复杂模型——注意“线性堆叠”四个字，说明它不支持分支结构。随后给出用 Keras 构建神经网络的完整步骤，顺序不要乱：载入数据、数据预处理、构建 Sequential 模型、用 compile 函数编译、用 fit 函数训练、模型评估和对新数据预测。后面用 Fashion-MNIST 举例（28×28 灰度图、10 类、70000 张，其中 60000 张训练），说明这套流程在真实数据集上怎么落地。步骤类考题按这六步答。","讲解来源":"self","核对":"locator","原文核对":"对不上"}]},"L3":{"img":"bookimg/dx4-p333.jpg","focus":"img/kp-基础-序贯模型-Sequential.jpg","bbox":[0.1013,0.1042,0.9402,0.6034],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-Transformer-基础","模块":"基础模块","知识领域":"深度学习基础","知识单元":"典型神经网络基础","知识点":"Transformer 基础","要求":"知道","考纲来源":"官方","题数":3,"题id":["38A-F-09","DIG-26-01","DIG-26-02"],"教材":"yl","教材名":"人工智能引论","章节":"5.6 注意力机制","书内页":168,"PDF页":183,"状态":"完整","L1":{"一句话":"Transformer 用自注意力（self-attention）计算句中单词两两之间的关联强度：用查询向量与键向量算关联度、归一化后对值向量加权求和，并且可以并行计算。","关键词":["自注意力","查询/键/值向量","并行计算","2017 谷歌"],"易错点":"把注意力权重直接说成“词向量”——权重是对值向量加权用的；也容易忽略它相对 RNN 的优势：不必一个词一个词自回归处理，可并行。"},"L2":{"档":"locator","段":[{"n":1,"文":"：≥α×v，这个结果作为在当前句子语境下单词w“意在”与其他单词的关联程度（self-attention）。这里的查询向量、键向量和值向量可从搜索引擎角度来理解：查询向量为搜索单词，键向量为被搜索物品的描述信息（如标题等），值向量为被搜索物品的语义内容。于是可如下理解自注意力关联：在每个单词具有自身内容（值向量表示）的基础上，给定自然语言句子，计算给定单词和句子中其他单词之间的归一化关联度，利用关联度大小对每个单词的自身内容进行调整和加权取和，以反映每个单词在句子中因上下文语义而与其他单词之间的自注意力。当然，也可引l人“多头”注意力（multi-headedattention）机制，从更多角度来挖掘某个单词与其他单词之间的概率关联。同时也应该了解，某个单词的自注意力关联可并行计算，而不像循环神经网络那样，需要通过自回归的方式一个单词接着一个单词处理。一旦计算得到单词和其他单词所形成的自注意力关联后，Transformer再将这些自注意力关联通过前向（feed-forward）神经网络进行非线性映射。非线性变换的引l入能帮助模型捕捉到更丰富的特征和语","页":"书内 p.168 / PDF p.183","书内页":168,"PDF页":183,"讲解":"这段讲自注意力的机制与直觉。先给注意力的两层含义：自然语言里是句子级或篇章级中单词因上下文而共同出现的概率；机器翻译里是源语言单词与目标语言单词之间的关联。然后给出 Transformer 的出处与核心：2017 年谷歌研究人员提出，引入自注意力来计算句中单词之间的概率关联。教材用一个类比降低理解门槛：查询向量像搜索词，键向量像被搜物品的描述（标题），值向量像被搜物品的语义内容——先用查询与键算关联度，再按关联度对值向量加权求和。最后强调工程优势：自注意力可并行计算，不像循环神经网络必须自回归地一个词接一个词处理。","讲解来源":"self","核对":"locator","原文核对":"对不上"}]},"L3":{"img":"bookimg/yl-p183.jpg","focus":"img/kp-基础-Transformer-基础.jpg","bbox":[0.1208,0.0757,0.901,0.4862],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-图像分割与分类","模块":"基础模块","知识领域":"计算机视觉基础","知识单元":"计算机视觉方法基础","知识点":"图像分割与分类","要求":"知道","考纲来源":"官方","题数":6,"题id":["38A-D-04","TB-DX4-HW-53","TB-DX4-HW-78","TB-DX4-HW-79","TB-DX4-HW-81","TB-DX4-HW-84"],"教材":"yl","教材名":"人工智能引论","章节":"5.8.2 图像分类与目标定位","书内页":174,"PDF页":189,"状态":"完整","L1":{"一句话":"图像分类与目标定位是机器视觉的核心问题之一：不仅要把图像分到不同类别，还要对图像中的视觉对象给出位置。","关键词":["分类","定位","包围盒","核心问题"],"易错点":"把“分类”与“分割”当成一回事：分类给整图一个标签，分割要逐像素划分区域；也容易漏掉“定位”这一步，只答分类。"},"L2":{"档":"locator","段":[{"n":1,"文":"图像分类与目标定位（image classification and object localization）是机器视觉领域的核心问题之一，其不仅将图像分为不同类别，而且要对图像中的视觉对象进行定位。","页":"书内 p.174 / PDF p.189","书内页":174,"PDF页":189,"讲解":"这句话是本节的核心命题，只有两层意思但要分清：第一层是分类——把图像分为不同类别；第二层是定位——对图像中的视觉对象进行定位。所以它比纯分类多了一个“在哪里”的输出。教材在下一段展开定位的表示方法：用包围盒（bounding box）描述，即矩形框左上角的横坐标与纵坐标，加上框的高度与宽度，共四个参数。理解时可以对照：分类输出标签、定位输出四个数、检测输出多个“标签＋框”。这段虽短，却是后面 R-CNN 家族与 YOLO 一系列方法的总纲。","讲解来源":"self","核对":"locator","原文核对":"通过"}]},"L3":{"img":"bookimg/yl-p189.jpg","focus":"img/kp-基础-图像分割与分类.jpg","bbox":[0.1208,0.6523,0.8999,0.9357],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-目标检测与识别","模块":"基础模块","知识领域":"计算机视觉基础","知识单元":"计算机视觉方法基础","知识点":"目标检测与识别","要求":"知道","考纲来源":"官方","题数":3,"题id":["38A-D-08","38A-F-08","DIG-28-01"],"教材":"yl","教材名":"人工智能引论","章节":"第5章 · 5.8.2 图像分类与目标定位","书内页":175,"PDF页":190,"状态":"完整","L1":{"一句话":"目标检测在分类之外还要定位，位置用包围盒的四个参数表示；算法分两类——基于候选区域（R-CNN 家族）与单次检测（SSD、YOLO）。","关键词":["包围盒四参数","候选区域","单次检测","多任务学习"],"易错点":"把 YOLO 说成两阶段方法（它是单阶段代表）；也容易把包围盒参数说成 6 个或 8 个——教材明确是 4 个。"},"L2":{"档":"locator","段":[{"n":1,"文":"教材原句（YL p.175）：单次目标检测方法的典型代表有SSD、YOLO等；不经过候选区域检测，直接对输入图像进行处理而得到视觉对象区域预测结果。\n图像分类与目标定位是机器视觉领域的核心问题之一，其不仅将图像分为不同类别，而且要对图像中的视觉对象进行定位。已有算法可分为基于候选区域的目标检测方法和单次目标检测方法两类。","页":"书内 p.175 / PDF p.190","书内页":175,"PDF页":190,"讲解":"这段把检测的表示与流派讲全。表示：视觉对象的位置用包围盒表示，即矩形框左上角的横坐标、纵坐标，以及框的高度与宽度——四个参数。流派分两类：一是基于候选区域的目标检测，先产生候选区域再判断，典型代表 R-CNN、Fast R-CNN、Faster R-CNN；二是单次目标检测，不经过候选区域这一步，直接对输入图像处理得到区域预测，也称单阶段模型，典型代表 SSD、YOLO。最后点出任务性质：检测要同时完成回归（位置判断）与分类（物体识别）两个任务，这种同时解决两个及以上问题的任务叫多任务学习。","讲解来源":"self","核对":"locator","原文核对":"对不上"}]},"L3":{"img":"bookimg/yl-p190.jpg","focus":"img/kp-基础-目标检测与识别.jpg","bbox":[0.1093,0.43,0.8895,0.7907],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-语音识别-说话人-关键词-认证-增强","模块":"基础模块","知识领域":"语音处理基础","知识单元":"语音处理方法基础","知识点":"语音识别（说话人、关键词、认证、增强）","要求":"知道","考纲来源":"官方","题数":3,"题id":["38A-A-06","DIG-29-01","DIG-29-02"],"教材":"yl","教材名":"人工智能引论","章节":"10.4 语音识别与合成","书内页":305,"PDF页":320,"状态":"完整","L1":{"一句话":"语音处理包含语音增强、语音分离、说话人识别、语音识别、语音合成等任务，其中语音识别（ASR）把语音信号自动翻译为文本单词。","关键词":["ASR","语音增强/分离","说话人识别","共振峰匹配"],"易错点":"把“语音识别”与“说话人识别”混为一谈：前者识别“说了什么”，后者识别“谁在说”；也容易忘记语音信号是数字序列，语音处理是数字信号处理的一个特例。"},"L2":{"档":"locator","段":[{"n":1,"文":"向。语音信号通常以数字序列形式进行记录，因此语音处理可以看作数字信号处理的一个特例。语音处理领域包含许多不同的任务，包括语音增强、语音分离、说话人识别、语音识别、语音合成等。语音处理技术能够让机器“听懂”和“说出”人类的语言，实现更为自然的人机交互，提高用户体验和便利性。本节将着重介绍语音处理领域中最为核心的两项任务：语音识别和语音合成。10.4.1语音识别技术语音识别（automatic speechrecognition，ASR）是将语音信号自动翻译为文本单词的技术。语音识别有着悠久的历史，并有着多次重大的创新。近年来，得益于深度学习技术的进步，语音识别技术也得到了飞速发展。1.早期发展语音识别技术最早可以追溯到20世纪中叶。1952年，来自贝尔实验室的研究者设计出了首个语音识别系统Audrey（Davisetal.，1952），该系统通过记录不同发音的共振峰变化实现声音片段和文本单词之间的匹配。在1962年举行的西雅图世界博览会上，IBM公司展示了具备语音识别功能的计算机Shoebox，其根据音高变化来识别对应单词。然而，当时的语音识别技术还存在巨","页":"书内 p.305 / PDF p.320","书内页":305,"PDF页":320,"讲解":"这段先给语音处理划定范围。前提：语音信号通常以数字序列记录，因此语音处理可看作数字信号处理的一个特例。接着列出领域内的任务：语音增强、语音分离、说话人识别、语音识别、语音合成，并说明这些技术让机器能“听懂”和“说出”人类语言，实现更自然的人机交互。本节重点只讲两项最核心的任务——语音识别与语音合成。然后给出语音识别的定义：把语音信号自动翻译为文本单词的技术（ASR），并交代早期史实：1952 年贝尔实验室的 Audrey 系统通过记录不同发音的共振峰变化，把声音片段与文本单词匹配起来。这段是“概念＋历史”的标准考法。","讲解来源":"self","核对":"locator","原文核对":"通过"}]},"L3":{"img":"bookimg/yl-p320.jpg","focus":"img/kp-基础-语音识别-说话人-关键词-认证-增强.jpg","bbox":[0.1059,0.0252,0.9448,0.3404],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-语音合成-如文本到语音","模块":"基础模块","知识领域":"语音处理基础","知识单元":"语音处理方法基础","知识点":"语音合成（如文本到语音）","要求":"知道","考纲来源":"官方","题数":3,"题id":["38A-E-09","DIG-30-01","DIG-30-02"],"教材":"yl","教材名":"人工智能引论","章节":"10.4 语音识别与合成","书内页":305,"PDF页":320,"状态":"完整","L1":{"一句话":"语音合成把文本变成人声：声学模型把文本转成声学特征，声码器把特征转成音频，整条链路称 TTS；最早的做法是把预录语音片段拼接起来。","关键词":["TTS","声学模型","声码器","拼接合成"],"易错点":"把声学模型与声码器的分工颠倒；也容易把 CTC 当成合成方法——CTC 属于识别一侧的对齐思路。"},"L2":{"档":"locator","段":[{"n":1,"文":"CTC方法聚焦于一个输入序列（如语音序列）到一个输出序列（如单词序列）的结果，只关心模型预测的输出序列是否与真实序列接近（相同），而不用关心所预测输出序列中的每个结果在某些时间点上是否与输入的序列正好对齐。识别tEEhEeEE\\bEECEEaEEEtE对齐he\\bc图10.13连接时序分类模型的语音识别过程10.4.2语音合成技术语音合成（speechsynthesis）是一种通过机器合成人声的技术。将文本转换为声学特征的系统称为声学模型（acousticmodel），将声学特征输入转换为音频输出的系统则称为声码器（vocoder），完整的从文本到语音的转换系统称为TTS（text-to-speech）系统。1.基于拼接的语音合成最传统的语音合成方法通过将预录制的语音片段拼接在一起，以形成完整的语音。由于原始音频来自真人的录制，因此合成的语音通常具有较为真实的发音效果。但是，这类方法往往缺少语音、语调之间的自然变化，且在语音连贯性上有所欠缺。基于拼接的合成方法又根据基本单位的不同分为三种主要类型：①单元选择合成，其将每段录音按照音素、音节、单词、短语或句","页":"书内 p.305 / PDF p.320","书内页":305,"PDF页":320,"讲解":"这段开头先用 CTC 收束识别部分：CTC 只关心模型预测的输出序列是否与真实序列接近，而不要求每个输出结果在时间点上与输入精确对齐，所以它解决的是“对齐难”的问题，图 10.13 展示的就是这个思路。随后转入合成：语音合成（speech synthesis）是用机器合成人声的技术，其中把文本转换为声学特征的系统叫声学模型，把声学特征转成音频输出的系统叫声码器，二者串起来就是 TTS（text-to-speech）系统。最后介绍最传统的路线——基于拼接的合成：把预录制的语音片段拼在一起，优点是发音真实（来自真人录音），缺点是语调缺少自然变化、连贯性差。","讲解来源":"self","核对":"locator","原文核对":"对不上"}]},"L3":{"img":"bookimg/yl-p320.jpg","focus":"img/kp-基础-语音合成-如文本到语音.jpg","bbox":[0.1059,0.0252,0.9448,0.3404],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-垂直任务类-机器翻译-问答系统-信息抽取等","模块":"基础模块","知识领域":"自然语言处理基础","知识单元":"自然语言处理方法基础","知识点":"垂直任务类（机器翻译、问答系统、信息抽取等）","要求":"知道","考纲来源":"官方","题数":7,"题id":["38A-C-09","TB-DX4-HW-08","TB-DX4-HW-57","TB-DX4-HW-59","TB-DX4-HW-85","TB-YL-EX-14","SEC2-CH2-12"],"教材":"yl","教材名":"人工智能引论","章节":"10.2 自然语言中的机器翻译","书内页":300,"PDF页":315,"状态":"完整","L1":{"一句话":"机器翻译是自然语言处理里的重要应用：用计算机把一种自然语言的文本自动转换成另一种自然语言的文本，实现跨语言沟通。","关键词":["机器翻译","跨语言","文本到文本"],"易错点":"把机器翻译算进“语音识别”（那是语音到文本）；也容易忽略它是“文本到文本”的任务，与同声传译这种“语音＋翻译”复合场景不同。"},"L2":{"档":"locator","段":[{"n":1,"文":"机器翻译是人工智能领域中的一个重要应用，它旨在通过计算机自动将一种自然语言的文本转换为另一种自然语言的文本，实现跨语言的沟通和信息传递。","页":"书内 p.300 / PDF p.315","书内页":300,"PDF页":315,"讲解":"这句话给机器翻译下了最简定义，三个要素要在答题时说出来：主体是计算机、动作是自动转换、对象是“一种自然语言的文本→另一种自然语言的文本”，目的是跨语言的沟通与信息传递。理解时把它放到 NLP 任务谱系里看：词法、句法、语义分析是底层能力，机器翻译是面向垂直场景的复合任务，需要同时处理词义、语序和长距离依赖。考纲把“机器翻译、问答系统、信息抽取”并列为垂直任务类，正是因为它们都是“把 NLP 基础能力组装起来解决一个具体业务”的形态。","讲解来源":"self","核对":"locator","原文核对":"通过"}]},"L3":{"img":"bookimg/yl-p315.jpg","focus":"img/kp-基础-垂直任务类-机器翻译-问答系统-信息抽取等.jpg","bbox":[0.1105,0.202,0.8895,0.5594],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-智能社会概念","模块":"基础模块","知识领域":"人工智能应用基础","知识单元":"智能社会基础","知识点":"智能社会概念","要求":"知道","考纲来源":"官方","题数":4,"题id":["38A-B-09","TB-NOTE-01","DIG-32-01","DIG-32-02"],"教材":"yl","教材名":"人工智能引论","章节":"第8章 · 8.1.2 科技的双重属性（人机共融社会形态）","书内页":255,"PDF页":270,"状态":"完整","L1":{"一句话":"智能社会不是「到处都是智能设备」，而是人工智能深度嵌入社会运行后，形成的人与机、机与机、人机共融的新型社会形态——技术属性之外，还必须带上社会属性（价值观、道德、法律）。","易错":["把智能社会理解成「智能设备普及率」。设备只是表象，核心是社会形态变化。","把智能社会与智慧城市画等号。后者是前者的子集/载体。","只答技术属性、漏掉社会属性，在简答/多选题上失分。","把「人机共融」理解成「机器全面替代人」。"],"对比":[{"维度":"核心驱动","信息社会":"信息技术，解决信息流通","智能社会":"人工智能，解决感知决策与协同"},{"维度":"人机关系","信息社会":"人使用工具","智能社会":"人机共融、协同分工"},{"维度":"典型标志","信息社会":"互联网普及、数字化办公","智能社会":"城市大脑、无人驾驶、智能诊疗"},{"维度":"与智慧城市关系","信息社会":"—","智能社会":"智慧城市是其城市空间的具体载体"}]},"L2":{"档":"general","段":[{"n":1,"文":"人工智能是新一轮科技革命和产业变革的重要驱动力量……体现出其赋能社会的技术属性。同时，人工智能正创造和形成人与机、机与机及人机共融的新的社会形态，因此必须确保把人类价值观、道德观和法律法规贯穿于人工智能的产品和服务，赋予人工智能社会属性。","页":"《人工智能引论》8.1.2 节，书内 p.255","书内页":255,"PDF页":270,"讲解":"这段把“智能社会”的技术属性一句带过，重点落在社会属性上：人工智能是新一轮科技革命和产业变革的重要驱动力量，这是它的技术属性——赋能社会；同时它正在创造人与机、机与机、人机共融的新社会形态，因此必须把人类价值观、道德观和法律法规贯穿到产品和服务里，这就是社会属性。理解要点：智能社会不只是“智能设备变多”，而是社会运行方式与人机关系发生了变化，所以评价它必须同时用技术尺度和价值尺度。","讲解来源":"self","核对":"pending","原文核对":"通过"},{"n":2,"文":"智能城市、智能医疗、智能交通、智能物流、智能机器人、无人驾驶、智能手机、智能游戏、智能制造、智能社会、智能经济等都迫切需要人工智能的新发展。","页":"《人工智能引论》第 8 章，书内 p.256","书内页":255,"PDF页":270,"讲解":"这段用一串并列场景说明“谁在迫切需要人工智能”：智能城市、智能医疗、智能交通、智能物流、智能机器人、无人驾驶、智能手机、智能游戏、智能制造、智能社会、智能经济。它的作用不是让你背清单，而是让你看清“智能社会”是这些具体场景的总和——每个场景解决一类社会需求，合起来构成智能社会的应用面。答简答题时可以先用这句话铺开场景，再收回到“人机共融的社会形态”这个定义上。","讲解来源":"self","核对":"pending","原文核对":"对不上"}]},"L3":{"img":"bookimg/yl-p270.jpg","focus":"img/kp-基础-智能社会概念.jpg","bbox":[0.2612,0.5106,0.8815,0.645],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-智能交通概念","模块":"基础模块","知识领域":"人工智能应用基础","知识单元":"智能交通基础","知识点":"智能交通概念","要求":"知道","考纲来源":"官方","题数":3,"题id":["38A-A-11","DIG-33-01","DIG-33-02"],"教材":"yl","教材名":"人工智能引论","章节":"1.4 新一代人工智能（应用提及）","书内页":13,"PDF页":28,"状态":"完整","L1":{"一句话":"智能交通是把人工智能用于交通运行的组织与优化，属于教材列举的“迫切需要人工智能新发展”的典型社会场景之一。","关键词":["交通组织","典型场景","与智能城市并列"],"易错点":"把智能交通等同于“无人驾驶”——无人驾驶是其中一种载运技术，智能交通还包括信号调度、路网优化、交通流预测。"},"L2":{"档":"locator","段":[{"n":1,"文":"智能城市、智能医疗、智能交通、智能物流、智能机器人、无人驾驶、智能手机、智能游戏、智能制造、智能社会、智能经济等都迫切需要人工智能的新发展。","页":"书内 p.13 / PDF p.28","书内页":13,"PDF页":28,"讲解":"教材这句话是一串并列场景中的一员：智能城市、智能医疗、智能交通、智能物流、智能机器人、无人驾驶、智能手机、智能游戏、智能制造、智能社会、智能经济。它的价值在于给出“智能交通”的定位——属于人工智能赋能社会的典型场景，且与智能城市、无人驾驶并列而非包含。理解时把三者关系理顺：智能城市是更大的容器，智能交通是城市里的一个子系统，无人驾驶是交通系统里的一种载运方式。考试若问“智能交通属于哪类应用”，答“人工智能在社会领域的典型应用场景”即可。","讲解来源":"self","核对":"locator","原文核对":"无法比对"}]},"L3":{"img":"bookimg/yl-p28.jpg","页来源":"pdf-render","核对":"verified"}},{"id":"kp-基础-智能医疗概念","模块":"基础模块","知识领域":"人工智能应用基础","知识单元":"智能医疗基础","知识点":"智能医疗概念","要求":"知道","考纲来源":"官方","题数":3,"题id":["TB-NOTE-02","DIG-34-01","DIG-34-02"],"教材":"dx4","教材名":"大学信息技术4—人工智能基础与实践","章节":"第1章 · 1.3.2 计算机视觉（医疗影像分析）","书内页":16,"PDF页":29,"状态":"完整","L1":{"一句话":"智能医疗是用 AI 参与疾病筛查、诊断、治疗与健康管理；其中落地最成熟的一块是医学影像——让模型从 X 光、CT、MRI 里把病灶特征找出来，辅助医生判断。","易错":["把 AI 定位成「替代医生」。现阶段是辅助，责任主体仍是医生。","以为智能医疗只等于影像分析。影像只是最成熟的一块，还含药物研发、健康管理等。","把所有医疗 AI 都归到计算机视觉。临床决策、药物研发分别涉及 NLP、图神经网络等。","忽略可解释性要求，与推荐、创意类场景混为一谈。"],"对比":[{"维度":"核心任务","智能医疗":"疾病筛查、诊断、治疗辅助","智能创意":"内容生成（图、文、音、视频）"},{"维度":"对错误容忍度","智能医疗":"极低，误判可能危及生命","智能创意":"较高，可人工筛选修改"},{"维度":"关键要求","智能医疗":"可解释性、数据合规、临床验证","智能创意":"生成质量、风格可控、版权合规"},{"维度":"典型技术","智能医疗":"CNN 影像分析、多模态融合","智能创意":"GAN、扩散模型、大语言模型"}]},"L2":{"档":"general","段":[{"n":1,"文":"基于深度学习分析 X 光、CT 等医疗影像的多模态大数据，可提取疾病特征，辅助医生识别与诊断。（教材 1.3.2 节计算机视觉部分对医疗影像分析的表述）","页":"《大学信息技术4》1.3.2 节，书内 p.16","书内页":16,"PDF页":29,"讲解":"这句是教材在计算机视觉部分对医疗影像的表述，信息量集中在三点：数据是多模态大数据（X 光、CT 等影像）；方法是基于深度学习提取疾病特征；定位是“辅助医生识别与诊断”。第三点是定性关键——现阶段人工智能在医疗里是辅助角色，不是替代医生，责任主体仍是医生。理解时把“最成熟的一块”记住：医学影像分析之所以先落地，是因为影像数据量大、标注相对客观、判别标准较统一，而临床决策、药物研发则分别依赖文本理解与分子结构建模。","讲解来源":"self","核对":"pending","原文核对":"对不上"}]},"L3":{"img":"bookimg/dx4-p29.jpg","focus":"img/kp-基础-智能医疗概念.jpg","bbox":[0.099,0.2052,0.9367,0.8306],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-智能制造概念","模块":"基础模块","知识领域":"人工智能应用基础","知识单元":"智能制造基础","知识点":"智能制造概念","要求":"知道","考纲来源":"官方","题数":3,"题id":["TB-NOTE-03","DIG-35-01","DIG-35-02"],"教材":"dx4","教材名":"大学信息技术4—人工智能基础与实践","章节":"第1章 · 1.2.5 机器行为（智能制造定义）","书内页":13,"PDF页":26,"状态":"完整","L1":{"一句话":"智能制造的核心不是「多装几台机器人」，而是以计算机为核心集成相关技术，去取代、延伸和强化人在制造中的智能活动——让生产系统能感知、能判断、能自适应。","易错":["把智能制造等同于「机器换人」或机器人数量多。核心在智能活动，不在设备数量。","把自动化与智能化混为一谈。分界点是有没有感知与自主决策。","把三化顺序记乱，尤其把网络化放到数字化之前。","以为智能制造只作用于生产环节。它覆盖设计、生产、管理、服务全流程。"],"对比":[{"维度":"决策方式","传统自动化":"按预设程序执行，异常即停","智能制造":"感知状态、自主判断、动态调整"},{"维度":"对人的替代范围","传统自动化":"主要替代体力与重复操作","智能制造":"取代/延伸/强化人的智能活动（判断、优化）"},{"维度":"技术构成","传统自动化":"控制与机械为主","智能制造":"计算机 + 感知 + 网络 + 数据 + AI 的集成"},{"维度":"典型特征","传统自动化":"固定节拍、刚性产线","智能制造":"柔性排产、预测性维护、数字孪生"}]},"L2":{"档":"general","段":[{"n":1,"文":"智能制造以计算机为核心，集成有关技术，取代、延伸与强化专门人才在制造中的智能活动。（教材 1.2.5 节对智能制造的界定）","页":"《大学信息技术4》1.2.5 节，书内 p.13","书内页":13,"PDF页":26,"讲解":"这句话是教材对智能制造的界定，主干只有一层：以计算机为核心，集成有关技术，去取代、延伸与强化专门人才在制造中的智能活动。三个动词要分清——“取代”是替代重复性劳动，“延伸”是把人的能力扩展到人做不到的精度与规模，“强化”是让人判断得更准更快。判断要点：智能制造的衡量标准是“智能活动被集成了多少”，而不是“装了多少台机器人”。所以把智能制造说成“机器换人”或者“自动化程度高”都不准确，自动化按预设程序执行，智能化还要求感知与自主决策。","讲解来源":"self","核对":"pending","原文核对":"对不上"}]},"L3":{"img":"bookimg/dx4-p26.jpg","focus":"img/kp-基础-智能制造概念.jpg","bbox":[0.0621,0.7345,0.9494,0.9894],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-智能创意概念","模块":"基础模块","知识领域":"人工智能应用基础","知识单元":"智能创意基础","知识点":"智能创意概念","要求":"知道","考纲来源":"官方","题数":3,"题id":["TB-NOTE-04","DIG-36-01","DIG-36-02"],"教材":"yl","教材名":"人工智能引论","章节":"附录 A.6 生成式对抗学习","书内页":326,"PDF页":341,"状态":"完整","L1":{"一句话":"智能创意是让机器生成文本、图像、音乐、视频等原本被认为需要「创造力」的内容。核心套路是生成式模型——GAN 让生成器和判别器互相较劲，扩散模型则从噪声里一步步「去噪」出画面。","易错":["把 GAN 训练完成的判据说成「D 的输出接近 1」。接近 1 说明 D 被彻底骗过，不是均衡。","以为扩散模型也是一次生成。它是多步迭代去噪。","把智能创意等同于「AI 有自主意识」。它仍是概率建模下的内容生成。","忽略版权与深度伪造风险，在伦理类题目上丢分。"],"对比":[{"维度":"训练方式","GAN":"生成器与判别器对抗博弈","扩散模型":"学习从加噪到去噪的逆向过程"},{"维度":"生成起点","GAN":"随机噪声，一次前向出结果","扩散模型":"随机噪声，多步迭代去噪"},{"维度":"训练稳定性","GAN":"易震荡、模式崩溃，调参难","扩散模型":"相对稳定，质量高但采样慢"},{"维度":"典型用途","GAN":"图像风格转换、人脸生成、数据增强","扩散模型":"文生图、图像编辑、超分"}]},"L2":{"档":"general","段":[{"n":1,"文":"教材附录 A.6 介绍生成式对抗学习：由一个生成器与一个判别器组成，生成器力图产生以假乱真的样本，判别器力图区分真实样本与生成样本，二者在对抗中共同提升。","页":"《人工智能引论》附录 A.6，书内 p.326（要点转述）","书内页":326,"PDF页":341,"讲解":"这段出自教材附录对生成式对抗学习的介绍，是“智能创意”的技术底座：系统由一个生成器与一个判别器组成，生成器力图产生以假乱真的样本，判别器力图区分真实样本与生成样本，二者在对抗中共同提升。理解要点是把“对抗”看成训练机制而非目的——目标是让生成器产出足够真实的内容，这正是文本、图像、音乐等创意内容生成的核心套路。答“智能创意靠什么技术”时，先答生成式模型（GAN 为代表），再补一句扩散模型走的是“加噪—去噪”的另一条路。","讲解来源":"self","核对":"pending","原文核对":"对不上"}]},"L3":{"img":"bookimg/yl-p341.jpg","页来源":"scan","核对":"pending"}},{"id":"kp-基础-智能推荐概念","模块":"基础模块","知识领域":"人工智能应用基础","知识单元":"智能推荐基础","知识点":"智能推荐概念","要求":"知道","考纲来源":"官方","题数":3,"题id":["38A-A-07","38A-A-10","38A-C-07"],"教材":"dx4","教材名":"大学信息技术4—人工智能基础与实践","章节":"第2章 · 2.1.1 图像识别体验（推荐系统应用提及）","书内页":37,"PDF页":50,"状态":"完整","L1":{"一句话":"智能推荐是一种信息过滤机制：收集显式反馈（评分、收藏）与隐式反馈（浏览、点击、购买、停留），结合物品属性与上下文，预测兴趣并从海量候选中筛选排序推送。","关键词":["信息过滤","显式/隐式反馈","个性化推送","千人千面"],"易错点":"以为推荐只靠“用户评分”——隐式反馈（点击、停留）往往占大头；也容易把它当成搜索，搜索是用户主动表达需求，推荐是系统主动供给。"},"L2":{"档":"locator","段":[{"n":1,"文":"教材原句（DX4 p.37）：识别图像中的场景或者物品，将识别的标签融入推荐系统，可实现个性化准确推送。\n智能推荐（个性化推荐）是一种信息过滤机制：通过收集并分析用户的显式反馈（评分、收藏）与隐式反馈（浏览、点击、购买、停留），结合物品内容属性与上下文信息，用机器学习算法预测用户对物品的兴趣，并从海量候选中筛选、排序、推送个性化内容。其核心目标是缓解信息过载、提升用户决策效率与平台转化率，常被称为「千人千面」。\n来源：NVIDIA 术语页《什么是推荐系统？》；百度百科「个性化推荐」词条；帆软《什么是智能推荐系统？》。","页":"书内 p.37 / PDF p.50","书内页":37,"PDF页":50,"讲解":"这段先引用教材原句作为落点：识别图像中的场景或物品，把识别标签融入推荐系统，就能实现个性化准确推送——说明推荐常与视觉识别联动。随后给出智能推荐的定义：一种信息过滤机制，输入是显式反馈（评分、收藏）与隐式反馈（浏览、点击、购买、停留），加上物品内容属性与上下文信息；方法是机器学习算法预测用户对物品的兴趣；输出是从海量候选中筛选、排序、推送的个性化内容。核心目标有两条：缓解信息过载、提升用户决策效率与平台转化率，也就是常说的“千人千面”。这段末尾的来源标注说明它属通用表述，不是教材原文。","讲解来源":"self","核对":"locator","原文核对":"对不上"}]},"L3":{"img":"bookimg/dx4-p50.jpg","focus":"img/kp-基础-智能推荐概念.jpg","bbox":[0.0598,0.5098,0.8953,0.9267],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-智慧教育概念","模块":"基础模块","知识领域":"人工智能应用基础","知识单元":"智慧教育基础","知识点":"智慧教育概念","要求":"知道","考纲来源":"官方","题数":3,"题id":["38A-G-07","DIG-38-01","DIG-38-02"],"教材":"dx4","教材名":"大学信息技术4—人工智能基础与实践","章节":"第1章 · 1.3.3 自然语言处理（用户画像建模）","书内页":17,"PDF页":30,"状态":"完整","L1":{"一句话":"智慧教育是用人工智能、大数据、物联网等技术重构教育生态，核心是数据驱动的个性化学习路径与智能测评，目标是“人人皆学、处处能学、时时可学”。","关键词":["个性化学习路径","智能测评","泛在学习","用户画像"],"易错点":"把智慧教育等同于“上网课”——媒介变了不等于模式变了，判据是有没有数据驱动的个性化；也容易把“知识追踪”和“知识图谱”混为一谈。"},"L2":{"档":"locator","段":[{"n":1,"文":"教材原句（DX4 p.17）：可用于智能交互、深度问答、内容建模、用户画像建模和语义分析等场景。推荐系统个性化推送见 §2.1.1（p.37）。\n智慧教育是数字时代的教育新形态：运用人工智能、大数据、物联网等新一代信息技术，构建智能化、个性化、泛在化的教育生态。其核心是通过技术赋能与数据驱动，变革传统教学模式，实现规模化教育与个性化培养的有机结合；典型特征包括个性化学习路径、智能测评与学情分析、智能教学辅助、泛在学习环境，目标是构建「人人皆学、处处能学、时时可学」的终身学习体系。\n来源：百度百科「智慧教育」词条（2026-07）；《智慧教育：人工智能时代的教育变革》论文摘要（AMiner）。","页":"书内 p.17 / PDF p.30","书内页":17,"PDF页":30,"讲解":"这段先给教材落点：自然语言处理可用于智能交互、深度问答、内容建模、用户画像建模和语义分析，其中“用户画像建模”正是智慧教育刻画学习者特征的技术入口；个性化推送则可参见推荐系统一节。随后是通用表述：智慧教育是数字时代的教育新形态，用人工智能、大数据、物联网等新一代信息技术构建智能化、个性化、泛在化的教育生态；核心是技术赋能与数据驱动，变革教学模式，实现规模化教育与个性化培养的有机结合；典型特征包括个性化学习路径、智能测评与学情分析、智能教学辅助、泛在学习环境；目标是“人人皆学、处处能学、时时可学”的终身学习体系。","讲解来源":"self","核对":"locator","原文核对":"对不上"}]},"L3":{"img":"bookimg/dx4-p30.jpg","focus":"img/kp-基础-智慧教育概念.jpg","bbox":[0.0575,0.145,0.8941,0.5293],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-机器人概念","模块":"基础模块","知识领域":"人工智能应用基础","知识单元":"机器人基础","知识点":"机器人概念","要求":"知道","考纲来源":"官方","题数":4,"题id":["38A-C-10","38A-D-10","DIG-39-01","DIG-39-02"],"教材":"yl","教材名":"人工智能引论","章节":"10.7 机器人控制","书内页":313,"PDF页":328,"状态":"完整","L1":{"一句话":"机器人技术按模块分感知、规划、操作三部分；研制机器人是机械、电子、控制、人工智能多学科交叉的系统工程。","关键词":["感知/规划/操作","多学科交叉","Atlas/BigDog/TeslaBot"],"易错点":"把机器人等同于“长得像人”——仿人只是形态之一；也容易漏掉“规划”这一模块，只答感知和操作。"},"L2":{"档":"locator","段":[{"n":1,"文":"cting）的脚轮、驱动电机和驱动轮。近年来，越来越多的机器人产品被众人所知，如美国波士顿动力公司（BostonDynamics）的仿人机器人Atlas、动力平衡四足机械狗BigDog，以及美国特斯拉公司（Tesla）的TeslaBot等。研制机器人是一项复杂的系统工程，涉及机械、电子、控制、人工智能等多学科交叉领域。机器人技术按模块可分为感知、规划和操作（manipulation）三个主要模块（Thrun，2002）。人工智能特别是深度学习技术在计算机视觉领域的蓬勃发展，大大促进了机器人向智能化和通用化迈进。概括而言，人工智能在机器人技术中的应用涉及方方面面，一些典型的应用包括医疗服务机器人（healthcare）、农业机器人（agriculture）、工业自动化机器人（automotiveprocess）、仓储和物流机器人（warehousing）、仿人机器人（humanoid）、水下机器人（automatedunderwatervehicles）等，如图10.17所示。传统机器人的诸多任务可大致归类为导航（navigation）和操作，典型的经典","页":"书内 p.313 / PDF p.328","书内页":313,"PDF页":328,"讲解":"这段先说现状：越来越多机器人产品为人所知，教材举了波士顿动力的仿人机器人 Atlas、动力平衡四足机器狗 BigDog，以及特斯拉的 TeslaBot。然后给结论性判断：研制机器人是复杂的系统工程，涉及机械、电子、控制、人工智能等多学科交叉。最关键的是模块划分——机器人技术按模块可分为感知、规划、操作三个主要模块。这句话是“机器人由哪几部分组成”这类题的標準答案。教材还指出，深度学习在计算机视觉上的进展大大推动了机器人向智能化、通用化迈进，并列举医疗、农业、工业自动化、仓储物流、仿人、水下等应用方向。","讲解来源":"self","核对":"locator","原文核对":"通过"}]},"L3":{"img":"bookimg/yl-p328.jpg","focus":"img/kp-基础-机器人概念.jpg","bbox":[0.1047,0.0236,0.9459,0.4642],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-AI4Science-概念","模块":"基础模块","知识领域":"人工智能应用基础","知识单元":"智能驱动科学研究基础","知识点":"AI4Science 概念","要求":"知道","考纲来源":"官方","题数":3,"题id":["38A-E-02","DIG-40-01","DIG-40-02"],"教材":"yl","教材名":"人工智能引论","章节":"10.5 科学计算","书内页":309,"PDF页":324,"状态":"完整","L1":{"一句话":"AI4Science（科学智能）把深度学习模型当作科学计算的模拟器，用数学物理方程约束训练；特点是额外标注需求少、算得比传统数值方法快几个数量级。","关键词":["科学智能","模拟器","方程约束","快几个数量级"],"易错点":"以为 AI4Science 需要海量标注数据——教材明确数据来自采样与模拟，额外标注少；也容易把它理解成“AI 写论文”，实际做的是科学计算与预测。"},"L2":{"档":"locator","段":[{"n":1,"文":"10.5科学计算息，自动生成音素和字符级别之间的对齐标注信息，用于非自回归模型的训练。10.5科学计算科学计算近年来，科学智能（AI4Science）成为机器学习和自然科学的一个重要交叉领域。将深度学习模型作为科学计算的一个模拟器，利用现有的数学物理方程对模拟的结果进行约束和训练，成为将机器学习应用于自然科学研究的一种新方式。科学智能具有两个显著特点：首先，数据本身来源于采样与模拟，因此需要的额外标注信息较少，数据的规模取决于模拟所消耗的计算开销；其次，训练完成的深度学习模型在新数据上的计算速度相比传统数值方法大幅度提升，甚至高出几个数量级（Huertaetal.，2021）。如图10.15所示，知识与数据在科学智能中相辅相成（Karniadakisetal.，2021），通过数据驱动与知识引导相结合的方式，人工智能方法能够解决大量科学问题。少量数据部分数据大量数据数据规模专业","页":"书内 p.309 / PDF p.324","书内页":309,"PDF页":324,"讲解":"这段给 AI4Science 下定义并给出两个特点。定义：科学智能是机器学习与自然科学的重要交叉领域，做法是把深度学习模型当作科学计算的一个模拟器，用现有的数学物理方程对模拟结果进行约束和训练——这就是“数据驱动＋知识引导”的结合。两个显著特点要背：其一，数据本身来源于采样与模拟，因此需要的额外标注信息较少，数据规模取决于模拟所消耗的计算开销；其二，训练好的模型在新数据上的计算速度相比传统数值方法大幅提升，甚至高出几个数量级。教材随后强调知识与数据相辅相成，并列举物理仿真、化学合成、蛋白质结构预测、药物虚拟筛选、新材料合成、天气预测等方向。","讲解来源":"self","核对":"locator","原文核对":"通过"}]},"L3":{"img":"bookimg/yl-p324.jpg","focus":"img/kp-基础-AI4Science-概念.jpg","bbox":[0.1059,0.0212,0.9471,0.4829],"页来源":"scan","核对":"pending"}},{"id":"kp-基础-Anaconda-与包管理-conda-pip","模块":"基础模块","知识领域":"Python 编程基础","知识单元":"运行环境与工具","知识点":"Anaconda 与包管理（conda、pip）","要求":"掌握","考纲来源":"扩展","题数":10,"题id":["TB-DX4-HW-10","TB-DX4-HW-140","TB-DX4-HW-83","SEC2-CH2-06","SEC2-CH2-07","SEC2-CH2-08","SEC2-CH2-11","SEC2-PR2-04","SEC2-PR2-05","DIG-P-01"],"教材":"daxue","教材名":"大学信息技术4—人工智能基础与实践","章节":"2.4.2 第三方库的安装（pip 与 conda 常用命令）","书内页":77,"PDF页":90,"状态":"完整","L1":{"一句话":"Anaconda 内置大批科学计算包，提供包管理与环境管理；装包优先用 conda，conda 里没有的再用 pip，两者命令一一对应（install/update/uninstall/list）。","关键词":["conda 优先","pip 兜底","虚拟环境","镜像源"],"易错点":"把优先级记反（应先用 conda，找不到再 pip）；也容易把 conda 当成“只装 Python 包”——它还是与语言无关的环境管理器。"},"L2":{"档":"locator","段":[{"n":1,"文":"能体验ANACONDANAVIGATORApp《onEnvironmenf-sLeaminq0《卜100瓦0PTOO》pt0而0地P'000L0lab00jupyterN0re000《0A图244AnacondaNavigator2·4·2第三方库的安装Anaconcla中提供了pip和conda两种方式管理工具包。pip和conda都是开源的包管理系统，可以安装Python包的多个版本和依赖，支持Linux、()S\\和Winclows系统。pip是Python默认的包管理器，一般来说新发布的工具包优先支持使用pip安装。而conda还是一个与语言无关的跨平台环境管理器，可以安装任何语言的包，在安装时会检查当前环境下所有包之间的依赖关系，也可以进行虚拟环境的创建和删除等操作。一般来说，在Anaconda中，优先使用conda的方式管理包，如果conda中不存在AnacondaPrompt(anaconda3)该工具包，才使用pip方式进行管理。,base)C:\\Users\\DiaI\\Ii,l-Anaconda中已经集成了/\\nacondaPrompt命令行程序，在开始菜单的软件安装列表中打开Anaconda，如图2一4一5所示，在其中输人相关命令，就可以A图2一4一5AnacondaPrompt使用pi","页":"书内 p.77 / PDF p.90","书内页":77,"PDF页":90,"讲解":"这段是包管理的操作台。先交代 Anaconda 提供了 pip 与 conda 两种方式，二者都是开源包管理系统，都能装多版本并处理依赖，都跨 Linux/macOS/Windows。然后给出一条实用规则：pip 是 Python 默认的包管理器，新发布的包通常优先支持 pip；而 conda 还是与语言无关的跨平台环境管理器，安装时会检查当前环境下所有包的依赖关系，还能创建、删除虚拟环境。因此教材的结论是——在 Anaconda 中优先用 conda 管理包，仓库里没有该包时才用 pip。随后列出 pip 常用命令：install 装、install --upgrade 更新、uninstall 卸、list 查已装、show 查详情。答题时把“conda 优先、pip 兜底”作为第一句。","讲解来源":"self","核对":"locator","原文核对":"OCR 摘录（非逐字承诺）"}]},"L3":{"页来源":"none","核对":"页图缺失","说明":"页图源未覆盖该页；页码来自整本 OCR，正文摘录见 L2，未附截图"}},{"id":"kp-基础-IDLE-与-Jupyter-Notebook-使用","模块":"基础模块","知识领域":"Python 编程基础","知识单 t窗口，在其中自动启动JupyterNotebook服务，并显示一系列JupyterNotebook的服务器信息；同时浏览器将会","页":"书内 p.82 / PDF p.95","书内页":82,"PDF页":95,"讲解":"这段介绍 Jupyter Notebook：基于网页的交互式代码编辑软件，覆盖代码开发、文档编写、代码运行与结果展示的全过程。它与 Python Shell 的关键差别是“把代码、文字说明、图片集中在一处”：每个代码块单独运行，结果直接显示在块下方，还可以写说明文档。启动方式是从开始菜单打开，后台会先起服务、再自动打开浏览器访问本机地址；默认根目录是当前用户目录，新建的 .ipynb 默认存在那里。答题时突出“网页式、分块运行、图文同页”三点即可。","讲解来源":"self","核对":"locator","原文核对":"OCR 摘录（非逐字承诺）"}]},"L3":{"页来源":"none","核对":"页图缺失","说明":"页图源未覆盖该页；页码来自整本 OCR，正文摘录见 L2，未附截图"}},{"id":"kp-基础-变量-命名规则与注释","模块":"基础模块","知识领域":"Python 编程基础","知识单元":"基本语法与数据类型","知识点":"变量、命名规则与注释","要求":"掌握","考纲来源":"扩展","题数":10,"题id":["TB-DX4-HW-12","TB-DX4-HW-13","TB-DX4-HW-82","TB-DX4-HW-92","TB-DX4-HW-93","SEC2-CH3-01","SEC2-CH3-02","SEC2-CH3-04","DIG-P-07","DIG-P-08"],"教材":"daxue","教材名":"大学信息技术4—人工智能基础与实践","章节":"3.1 Python 语言及基本语法（标识符与命名规则）","书内页":92,"PDF页":105,"状态":"完整","L1":{"一句话":"标识符是程序中给变量、函数、类等对象起的名字；Python 标识符由大小写字母、汉字、数字、下划线组成，且不能以数字开头、不能与关键字同名。","关键词":["标识符","字母/汉字/数字/下划线","不以数字开头","关键字不可用"],"易错点":"以为变量要先声明类型——Python 变量在使用前必须赋值，赋值即确定类型；也容易用关键字（如 class、for）当变量名。"},"L2":{"档":"locator","段":[{"n":1,"文":"言。·易读、易维护性Python编写的程序相较其他语言编写的来说更加简洁和美观，思路也更加清晰。这就使得程序的易读性大大提高，维护成本也大大降低。·可移植性基于开源本质，如果Python程序没有依赖于系统特性，无需修改就可以在任何支持Python的平台上运行。3，1.2基本字符、标识符和关键字1．基本字符一般把用程序语言编写的未经编译的程序称为“源程序\"。源程序实际上是一个字符序列。Python的源程序是以PY为后缀名的文本文件，Python语言的基本字符包括：·数字字符：')，1，2，3，4，5，6，7，8，9大小写英文字母：a、z，A、Z·中文字符·特殊字符，如：空格符、换行符、制表符等2标识符程序中有很多需要命名的对象，标识符是指用户在程序书写中给一些特定对象的名称，包括变量名、函数名、类名等。Python中的标识符命名规则如下：·由大小写英文字母、汉字、数字、下划线组成·92·","页":"书内 p.92 / PDF p.105","书内页":92,"PDF页":105,"讲解":"这段给出标识符的定义：用户在程序书写中给一些特定对象起的名称，包括变量名、函数名、类名等——注意它不只指变量。组成规则四条：由大小写英文字母、汉字、数字、下划线组成；不能以数字开头；不能包含空格和标点；不能与 Python 关键字同名。教材随后专门列出关键字表并提醒两种代码书写方式的区别。配套的变量规则同样要记：变量在使用前必须赋值，通过赋值确定数据类型，只有被赋过值变量才被创建——所以 Python 里没有“声明但不赋值”的变量。注释用 # 起头，只影响可读性，不参与执行。","讲解来源":"self","核对":"locator","原文核对":"OCR 摘录（非逐字承诺）"}]},"L3":{"页来源":"none","核对":"页图缺失","说明":"页图源未覆盖该页；页码来自整本 OCR，正文摘录见 L2，未附截图"}},{"id":"kp-基础-数字-字符串与类型转换","模块":"基础模块","知识领域":"Python 编程基础","知识单元":"基本语法与数据类型","知识点":"数字、字符串与类型转换","要求":"掌握","考纲来源":"扩展","题数":15,"题id":["TB-DX4-HW-94","SEC2-CH2-04","SEC2-CH3-03","SEC2-CH3-05","SEC2-CH3-06","SEC2-CH3-07","SEC2-PR3-01","SEC2-PR3-03","SEC2-PR3-04","SEC2-PR3-05","SEC2-PR3-06","SEC2-EX3-01","SEC2-EX3-02","SEC2-EX3-03","SEC2-EX3-04"],"教材":"daxue","教材名":"大学信息技术4—人工智能基础与实践","章节":"3.1.3 基本数据类型（整型、浮点型、字符串）","书内页":97,"PDF页":110,"状态":"完整","L1":{"一句话":"Python 基本数据类型有整型 int、浮点型 float、复数 complex 与布尔型 bool；浮点数在计算机中以近似值存储，float 通常只提供约 15 位有效数字的精度。","关键词":["int/float/complex/bool","近似存储","15 位精度","type() 查看类型"],"易错点":"以为浮点运算必然精确（0.1+0.2 不等于 0.3 就是近似存储的后果）；也容易把 bool 当成独立数值类型，其实它是 int 的子类。"},"L2":{"档":"locator","段":[{"n":1,"文":"3童人工智能实践基础<class'float，>0．00089>>>type(l.2e1)<class'float'>计算机中的浮点数都是以近似值存储数据，Python的float类型数通常可提供至多15个数字的精度。例3一1一5float数据的精度示例。>>>1.23456789l.234567891.5241578750190519>>>123456789*12345678915241578750190521对比上述浮点数运算和整数的运算结果，前15个数字是一致的。浮点数的运算结果从第16个数字开始就可能有误差，这与浮点数的二进制表示有关。Python的整数类型的大小是没有限制的，所以必要时可以考虑把要求高精度的浮点数的运算转换为整数运算再求解。3布尔类型数据boolPython的布尔类型数据只有两个：True和F小e，表示真和假。注意书写，首字母要大写。以True和False为值的表达式称为布尔表达式，用于表示某种条件是否成立，是选择控制和循环控制中必不可少的条件判断表达式。一Y例3一1一6bo数据示例。>>>type(True)<class'bool'>>>>x，y：10，20FalseTrue#10赋值给x变量，20赋值给y变量","页":"书内 p.97 / PDF p.110","书内页":97,"PDF页":110,"讲解":"这段讲浮点型的本质。先用 type() 的返回结果说明 1.2e1 这类科学计数法写法同样是 float；随即给出关键一句：计算机中的浮点数都是以近似值存储数据，Python 的 float 类型数通常可提供至多 15 个数字的精度。后面用 1.23456789 之类的例子演示精度边界。理解要点：整型是精确的，浮点型是近似的，因此涉及金额等精确计算时要用整数或 Decimal；比较两个浮点数是否相等，不能直接写等号，而要看差值是否小于一个很小的阈值。这也是格式化输出与 round 舍入类题目的知识前提。","讲解来源":"self","核对":"locator","原文核对":"OCR 摘录（非逐字承诺）"}]},"L3":{"页来源":"none","核对":"页图缺失","说明":"页图源未覆盖该页；页码来自整本 OCR，正文摘录见 L2，未附截图"}},{"id":"kp-基础-列表-元组-字典与集合","模块":"基础模块","知识领域":"Python 编程基础","知识单元":"基本语法与数据类型","知识点":"列表、元组、字典与集合","要求":"掌握","考纲来源":"扩展","题数":14,"题id":["38A-B-11","TB-DX4-HW-100","TB-DX4-HW-101","TB-DX4-HW-102","TB-DX4-HW-14","TB-DX4-HW-15","TB-DX4-HW-95","TB-DX4-HW-96","TB-DX4-HW-97","TB-DX4-HW-98","TB-DX4-HW-99","SEC2-CH3-08","SEC2-CH3-09","SEC2-PR3-08"],"教材":"daxue","教材名":"大学信息技术4—人工智能基础与实践","章节":"3.2 组合数据对象","书内页":108,"PDF页":121,"状态":"完整","L1":{"一句话":"Python 组合数据类型分两类：序列（字符串 str、元组 tuple、列表 list，可按顺序下标访问）与无序类型（集合 set、字典 dict，靠哈希访问）。","关键词":["序列/无序","list 可变、tuple 不可变","dict 键值对","set 去重"],"易错点":"把元组与列表当成完全等价（元组创建后不可改）；也容易用 {} 建空集合——{} 建的是空字典，空集合必须写 set()。"},"L2":{"档":"locator","段":[{"n":1,"文":"大学信皂朩4人工乸能基与实（四版）组台数据对象Python的内置类型如图3一2一1所示，主要区分为基本数据类型和组合数据类型。基本数据类型“整型int·浮点型float“复数complex·布尔类型bool序列对象·字符串str·元组tuple．列表list其他类型．集合类型set·字典类型dict厶图321Python的内型一览表组合数据类型可以应用于表示一组数据的场合。其中支持访问给定顺序的对象的称为序列，包括字符串str、元组tuple和列表listo除序列之外的组合数据类型有无序的集合set和字典dict类型。：3之1字符串在Python语言中，字符串是最常用的数据类型之一。可以把一个或多个字符用单引号（'）、双引号（\"）或者三引号（'。）括起来，三者的差别在于：使用单引号表示字符串时，字符串中可以包含双引号；使用双引号表示字符串时，字符串中可以包含单引号；使用三引号表示字符串时，字符串内容可以包含单引号、双引号和换行符。1．字符串创建例3一2一1字符串的常量表示及转义字符使用示例。>>>print(\"lt'sfine!\"）lt'Sfine！>>>print(\"helloeveryone\\ntOdayisagreatday！\"）helloeveryonetodayisagreatday！．108","页":"书内 p.108 / PDF p.121","书内页":108,"PDF页":121,"讲解":"这段是组合数据类型的总览。Python 内置类型分两大类：基本数据类型（int、float、complex、bool）与组合数据类型；组合类型又分序列对象（字符串 str、元组 tuple、列表 list）与其他类型（集合 set、字典 dict）。分类依据是“能不能按给定顺序访问”：序列支持下标与切片，集合与字典无序、靠哈希定位。理解这张图的意义在于后面所有操作题——索引、切片只对序列成立；去重、成员判断优先用集合；按键取值用字典。判断“某对象是否支持下标访问”，先问它是不是序列。","讲解来源":"self","核对":"locator","原文核对":"OCR 摘录（非逐字承诺）"},{"n":2,"文":"大学信息技朩4人工能基础与实践四使用（）函数来创建集合，函数的参数，可以是字符串，元组和列表，它是将序列的数据元素转化为集合的元素。例3一2一24使用函数set()创建集合示例。>>>#创建空集合对象set(）>>>#将字符串对象转换为集合>>>=set('hello'）注意：创建一个空集合必须用set（）而不是{}，因为{}是用来创建一个空字典。由上例可以看出，字符串\"hello”，由五个字符构成，其中'I，出现了两次，转换到集合中，重复项只能保留一个，且字符次序与原字符串的次序不同。集合的这种特性，可以很方便地对列表对象执行去重操作。例3二2一25列表去重复示例。>>>L2=list(set(L1)）#通过set（）函数创建去重复的集合，再通过list（）函数把去重后的集合转换为列表>>>print(L2)0，2，3，4]（2）集合运算集合支持的运算有：交集、并集、差集、对称差集，和中学数学中学习的集合的运算的概念相同，常用的集合运算如表3一2一5所示。运算×inSl．122·表325检测×是否在集合s","页":"书内 p.122 / PDF p.135","书内页":122,"PDF页":135,"讲解":"这段专讲集合的创建与一个经典陷阱。创建集合用 set() 函数，参数可以是字符串、元组或列表，作用是把序列元素转成集合元素（自动去重）。教材明确提醒：创建空集合必须用 set() 而不能用 {}，因为 {} 用来创建空字典——这是选择题的高频陷阱。理解要点：集合的元素无序且不重复，所以它擅长去重与成员判断（in），但不支持下标访问；也正因为无序，两个集合比较相等时只看元素是否相同，不看顺序。","讲解来源":"self","核对":"locator","原文核对":"OCR 摘录（非逐字承诺）"}]},"L3":{"页来源":"none","核对":"页图缺失","说明":"页图源未覆盖该页；页码来自整本 OCR，正文摘录见 L2，未附截图"}},{"id":"kp-基础-分支与循环结构-break-continue","模块":"基础模块","知识领域":"Python 编程基础","知识单元":"控制结构与函数","知识点":"分支与循环结构（break、continue）","要求":"掌握","考纲来源":"扩展","题数":27,"题id":["TB-DX4-HW-103","TB-DX4-HW-104","TB-DX4-HW-105","TB-DX4-HW-106","TB-DX4-HW-107","TB-DX4-HW-108","TB-DX4-HW-109","TB-DX4-HW-110","TB-DX4-HW-111","TB-DX4-HW-112","TB-DX4-HW-117","TB-DX4-HW-118","TB-DX4-HW-119","TB-DX4-HW-120","TB-DX4-HW-121","TB-DX4-HW-122","TB-DX4-HW-88","TB-DX4-HW-91","SEC2-CH2-05","SEC2-CH3-10","SEC2-CH3-11","SEC2-PR3-02","SEC2-PR3-07","SEC2-PR3-09","SEC2-EX3-05","SEC2-EX3-06","SEC2-CH3-14"],"教材":"daxue","教材名":"大学信息技术4—人工智能基础与实践","章节":"3.3 程序控制结构","书内页":129,"PDF页":142,"状态":"完整","L1":{"一句话":"Python 三大控制结构是顺序、选择（分支）、循环；结构化流程控制以这三种基本结构为基本单元，可以实现任何复杂功能。","关键词":["顺序/选择/循环","if-elif-else","for/while","break/continue"],"易错点":"以为循环结构是“按条件选路径”（那是选择结构）；也容易把 break 与 continue 记反——break 直接跳出整个循环，continue 只跳过本次剩余部分。"},"L2":{"档":"locator","段":[{"n":1,"文":"燃3人工智能实践基础程序控制结构一个好的程序不但要能正确地解决问题，还应该执行效率高、结构清晰、易于理解、易于维护。结构化流程控制以顺序结构、选择结构和循环结构这三种基本结构作为表示一个良好算法的基本单元，可以实现任何复杂的功能。：3·3．1顺序结构顺序结构是最简单、最直观的控制结构。任何一个程序都可以看作是一个顺序结构，程序中的语句按照它们出现的先后顺序一条一条地执行，一条语句执行结束，自动地执行下一条语句。本节使用流程图描述程序算法，流程图采用标准的图形符号来描述程序的执行步骤。常用的流程图符号如表3一3一1所示。v表331用的流程图符号0例3一3一1起止框处理框输入判断框连接框流程线表示一个算法的开始和结束表示要处理的内容，该框有一个入口和一个出口表示条件判断的情况。满足条件，执行一条路径；不满足条件则执行另外一条路径用于连接因画不下而断开的流程线指出流程控制方向，即运作的次序已知一个圆的半径，求其内接正五边形的面积。","页":"书内 p.129 / PDF p.142","书内页":129,"PDF页":142,"讲解":"这段给控制结构定性：结构化流程控制把顺序结构、选择结构和循环结构这三种基本结构作为“表示一个良好算法的基本单元”，并且强调用它们可以实现任何复杂的功能——这句话的理论依据是结构化程序定理。三种结构的分工要一句话说清：顺序是按代码自上而下执行；选择（分支）根据条件走不同路径；循环让某段语句块反复执行直到满足终止条件。教材紧接着从顺序结构讲起，用计算面积的例子说明“没有分支、没有回跳”的代码就是顺序结构。","讲解来源":"self","核对":"locator","原文核对":"OCR 摘录（非逐字承诺）"},{"n":2,"文":"pi/5)area=（5关s关s)/(4关math.tan(math.pi/5)）print(\"内接正五边形的面积：{：、20\"．format(area)）运行结果示例：请输人圆半径：5，5内接正五边形的面积：7L92&3·3·2选择结构选择结构也称分支结构，是指程序的执行出现了分支，它需要根据某一特定的条件选择其中的一个分支执行。常见的选择结构有单分支、双分支和多分支三种形式。Python使用if语句实现选择结构，分别为if语句、if-else语句和if-elif-else语句。1．戏分支结枸用Python的if语句实现的双分支选择结构，语句格式如下：if<条件表达式>：<语句块1>．130·","页":"书内 p.130 / PDF p.143","书内页":130,"PDF页":143,"讲解":"这段专门讲选择结构，并给出同义名：选择结构也称分支结构，指程序执行出现分支，需要根据某一特定条件选择其中一支执行。教材按分支数目再分：单分支（一个 if）、双分支（if-else）、多分支（if-elif-else）。判断要点是“条件在前、分支在后”，程序每次只走一条分支。注意它与循环的区别：分支不重复执行，循环会回跳；而 break/continue 只出现在循环里，用来提前终止或跳过本次迭代。把这三组概念分清，控制结构类题目基本不会错。","讲解来源":"self","核对":"locator","原文核对":"OCR 摘录（非逐字承诺）"}]},"L3":{"页来源":"none","核对":"页图缺失","说明":"页图源未覆盖该页；页码来自整本 OCR，正文摘录见 L2，未附截图"}},{"id":"kp-基础-函数定义-参数与-lambda","模块":"基础模块","知识领域":"Python 编程基础","知识单元":"控制结构与函数","知识点":"函数定义、参数与 lambda","要求":"掌握","考纲来源":"扩展","题数":10,"题id":["TB-DX4-HW-113","TB-DX4-HW-114","TB-DX4-HW-115","TB-DX4-HW-116","TB-DX4-HW-16","SEC2-CH3-12","SEC2-CH3-13","SEC2-PR3-10","SEC2-EX3-07","SEC2-EX3-08"],"教材":"daxue","教材名":"大学信息技术4—人工智能基础与实践","章节":"3.4.2 自定义函数（含 lambda 函数）","书内页":142,"PDF页":155,"状态":"完整","L1":{"一句话":"自定义函数由 def、函数名、形参列表和函数体组成；调用时传实参，函数把结果 return 回去。lambda 是只能用一行表达式表示的匿名函数。","关键词":["def","形参/实参","return","lambda 匿名函数"],"易错点":"把形参与实参混说（定义处是形参、调用处是实参）；也容易以为 lambda 能写多条语句——它只能是一个表达式。"},"L2":{"档":"locator","段":[{"n":1,"文":"习数据科学包，NumPy是典型的数据分析及科学计算的基础库，提供直接的矩阵运算，广播函数，线性代数等功能；Pandas是主要的数据分析功能库，基于NumPy开发，提供高层次的数据结构和数据分析工具。Anaconda集成开发环境中已自带NumPy模块和Pandas模块。生3·4．2自定义函数1，函数的定义函数的定义包括函数名称、形参以及函数体，定义函数的语法如下：函数名（形参列表）：def函数体例3一4一4求最大公约数的gcd（）函数定义。如图3一4一1所示求两个整数的最大公约数的gcd()函数定义。函数体一-定义函数函数名形参smal1er=xifx〈=yelseYforirange（1，smaller+I)：if()x％10）and(y％i=0））：returng-一一一．返回值图34一1定义和调用一个函数函数调用z=gcd（28，70）实参gcd(）函数定义包括函数头和函数体。·函数头从关键字def开始，接着是函数名，函数名命名应该体现“望名生义”，此处gcd是最大公约数(GreatestCommonDivisor)的缩写。函数名后的一对圆括号是函数的标志符，括号中定义参数，多个参数间以逗号分隔。函数定义处的参数称为形式参数，简称形参。·函数体是实现函数功能的程序语句段。先找到x、Y两个整数变量中较","页":"书内 p.142 / PDF p.155","书内页":142,"PDF页":155,"讲解":"这段给出自定义函数的定义结构：函数的定义包括函数名称、形参以及函数体，语法是 def 函数名(形参列表): 下面是缩进的函数体。三个组成部分要分开记：函数名用于调用；形参是定义时的占位变量，调用时由实参赋值；函数体是真正执行的代码，通过 return 把结果交回调用处——没有 return 时函数返回 None。教材把 lambda 函数与自定义函数并列放在本节标题里，说明二者是同一层次的“自己定义的函数”，差别只在 lambda 没有名字、只能用单个表达式，常用于 sort 的 key 这类一次性场合。","讲解来源":"self","核对":"locator","原文核对":"OCR 摘录（非逐字承诺）"}]},"L3":{"页来源":"none","核对":"页图缺失","说明":"页图源未覆盖该页；页码来自整本 OCR，正文摘录见 L2，未附截图"}},{"id":"kp-综合-谓词逻辑表示法","模块":"综合模块","知识领域":"逻辑推理与知识图谱","知识单元":"逻辑推理","知识点":"谓词逻辑表示法","要求":"掌握","考纲来源":"官方","题数":15,"题id":["TB-YL-EX-01","TB-YL-EX-03","TB-YL-EX-04","TB-YL-EX-06","TB-YL-EX-07","TB-YL-HW-01","TB-YL-HW-06","TB-YL-HW-07","TB-YL-HW-10","TB-YL-HW-12","DIG-41-01","DIG-41-02","DIG-41-03","DIG-41-04","DIG-41-05"],"教材":"yl","教材名":"人工智能引论","章节":"2.3 谓词逻辑","书内页":28,"PDF页":43,"状态":"完整","L1":{"一句话":"命题逻辑无法刻画个体、群体与关系，因此引入谓词逻辑：把命题拆成主语（个体或群体）和谓语（关系），用个体、谓词、量词来表示知识。","关键词":["命题逻辑的局限","个体/谓词/量词","苏格拉底三段论","分离主谓"],"易错点":"以为谓词逻辑与命题逻辑是替代关系（谓词逻辑是命题逻辑的扩展，原子命题仍是基础）；也容易把“所有”“存在”漏掉，写不出带量词的表达式。"},"L2":{"档":"locator","段":[{"n":1,"文":"定位说明：教材 §2.3「谓词逻辑」先指出命题逻辑无法刻画个体与整体关系，再引入个体、谓词、量词表示，对应考纲「谓词逻辑表示法」；节首 p.28 为由命题逻辑引出的过渡段。\n2.3谓词逻辑命题逻辑是数理逻辑的一部分。在命题逻辑中，原子命题是最基本的单位。由原子命题出发，通过使用命题联结词，构成复合命题。命题逻辑只能把复合命题分解为简单命题（即原子命题），无法对原子命题所包含的丰富语义（如个体、部分或全体等）进行刻画。因此，命题逻辑无法表达局部与整体、一般与个别的关系。例2.5以下是著名的苏格拉底三段论：α：所有的人都是要死的。β：苏格拉底是人。y：苏格拉底是要死的。可以看到，虽然苏格拉底论断是正确的，但无法通过命题逻辑来进行推理判断（a人β→y）。其中的原因是上述的原子命题蕴涵了个体（苏格拉底）、群体（所有的人）和关系（都是要死的）等内在丰富语义，命题逻辑无法表现这种内在丰富语义。因此，需要引入更加强大的逻辑表示方法，分离其主语（个体或群体）和谓语（关系），这就是谓词逻辑。在谓词逻辑中，原子命题被进一步细化，分解出个体、谓词和量词，以表达个体与总体的内在联系和","页":"书内 p.28 / PDF p.43","书内页":28,"PDF页":43,"讲解":"这段用苏格拉底三段论把“为什么需要谓词逻辑”讲透。先给命题逻辑的能力边界：它以原子命题为最基本单位，靠联结词组成复合命题，只能把复合命题分解为原子命题，无法刻画原子命题内部的语义。于是出现困境：三段论“所有的人都是要死的／苏格拉底是人／苏格拉底是要死的”在直觉上成立，却无法用命题逻辑推出，因为三个原子命题里蕴涵了个体（苏格拉底）、群体（所有的人）和关系（都是要死的）。结论是必须引入更强的表示方法：把主语（个体或群体）与谓语（关系）分离——这就是谓词逻辑的出发点。答题时先写“命题逻辑粒度过粗”，再写“谓词逻辑分离主谓并可加量词”。","讲解来源":"self","核对":"locator","原文核对":"部分相符"}]},"L3":{"img":"bookimg/yl-p43.jpg","focus":"img/kp-综合-谓词逻辑表示法.jpg","bbox":[0.1116,0.0741,0.8884,0.4593],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-推理规则","模块":"综合模块","知识领域":"逻辑推理与知识图谱","知识单元":"逻辑推理","知识点":"推理规则","要求":"掌握","考纲来源":"官方","题数":10,"题id":["TB-YL-EX-02","TB-YL-EX-05","TB-YL-EX-08","TB-YL-HW-11","TB-YL-HW-13","DIG-42-01","DIG-42-02","DIG-42-03","DIG-42-04","DIG-42-05"],"教材":"yl","教材名":"人工智能引论","章节":"2.3 谓词逻辑","书内页":28,"PDF页":43,"状态":"完整","L1":{"一句话":"推理规则是保证“从前提出发得到结论”这一步合法的形式依据，如假言推理（P→Q，P 推出 Q）、拒取式（P→Q，非 Q 推出非 P）等。","关键词":["假言推理","拒取式","形式合法性","前提→结论"],"易错点":"把“肯定后件”当成合法推理（P→Q 与 Q 推不出 P）；也容易与“蕴含式”混为一谈——蕴含是命题形式，推理规则是使用蕴含的方式。"},"L2":{"档":"locator","段":[{"n":1,"文":"定位说明：教材 §2.3 谓词逻辑后文给出推理规则（如假言推理、拒取式等），对应考纲「推理规则」；节首 p.28 为引入页，具体规则在后文小节。\n2.3谓词逻辑命题逻辑是数理逻辑的一部分。在命题逻辑中，原子命题是最基本的单位。由原子命题出发，通过使用命题联结词，构成复合命题。命题逻辑只能把复合命题分解为简单命题（即原子命题），无法对原子命题所包含的丰富语义（如个体、部分或全体等）进行刻画。因此，命题逻辑无法表达局部与整体、一般与个别的关系。例2.5以下是著名的苏格拉底三段论：α：所有的人都是要死的。β：苏格拉底是人。y：苏格拉底是要死的。可以看到，虽然苏格拉底论断是正确的，但无法通过命题逻辑来进行推理判断（a人β→y）。其中的原因是上述的原子命题蕴涵了个体（苏格拉底）、群体（所有的人）和关系（都是要死的）等内在丰富语义，命题逻辑无法表现这种内在丰富语义。因此，需要引入更加强大的逻辑表示方法，分离其主语（个体或群体）和谓语（关系），这就是谓词逻辑。在谓词逻辑中，原子命题被进一步细化，分解出个体、谓词和量词，以表达个体与总体的内在联系和","页":"书内 p.28 / PDF p.43","书内页":28,"PDF页":43,"讲解":"这段是谓词逻辑一节的引入页，说明本节的来路：命题逻辑无法表达局部与整体、一般与个别的关系，苏格拉底三段论就是反例，因此需要引出谓词逻辑。考纲要求的“推理规则”（假言推理、拒取式等）在教材后文的小节里展开，本页只是入口。复习时把规则与形式对应起来记：假言推理是“P→Q 且 P，得 Q”（肯定前件）；拒取式是“P→Q 且 ¬Q，得 ¬P”（否定后件）。这两种是合法规则；而“肯定后件得 P”“否定前件得 ¬Q”都是错误推理。判断题基本就考这一组对照。","讲解来源":"self","核对":"locator","原文核对":"部分相符"}]},"L3":{"img":"bookimg/yl-p43.jpg","focus":"img/kp-综合-推理规则.jpg","bbox":[0.1116,0.0741,0.8884,0.4593],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-确定性与不确定性推理","模块":"综合模块","知识领域":"逻辑推理与知识图谱","知识单元":"逻辑推理","知识点":"确定性与不确定性推理","要求":"理解","考纲来源":"官方","题数":8,"题id":["TB-YL-HW-03","TB-YL-HW-09","TB-YL-HW-53","TB-YL-HW-59","TB-YL-HW-60","DIG-43-01","DIG-43-02","DIG-43-03"],"教材":"yl","教材名":"人工智能引论","章节":"2.5 概率推理","书内页":42,"PDF页":57,"状态":"完整","L1":{"一句话":"确定性推理在前提与规则都确切时推出确切结论；现实信息常不完备，于是用概率推理（如贝叶斯网络）处理不确定性。","关键词":["贝叶斯网络","局部马尔可夫性","概率推理","不确定性"],"易错点":"把贝叶斯网络当成“带权重的有向图”而不提概率（边上承载的是条件概率）；也容易把“不确定”理解成“随机噪声”，它更多指知识不完备。"},"L2":{"档":"locator","段":[{"n":1,"文":"定位说明：教材 §2.5「概率推理」以贝叶斯网络处理不确定性，对应考纲「确定性与不确定性推理」；节首 p.42 为贝叶斯网络示例段。\n2.5.1贝叶斯网络图2.3给出了一个贝叶斯网络的示例，刻画了多云、洒水车、贝叶斯网络下雨和路湿四个因素之间的相互影响。图中以概率形式给出了四个因素之间的相互影响，例如，多云情况下有10%的概率会出动洒水车和80%的概率会下雨，在有洒水车和不下雨的情况下有10%的概率路面不湿。是否多云0.40.6是否多云有洒水车无酒水车下雨不下雨多云0.10.9是否有洒水车是否下雨多云0.80.2非多云0.50.5非多云0.20.8是否路湿路湿路不湿0.99有洒水车下雨0.01有洒水车不下雨0.90.10.90.1无洒水车下雨无洒水车不下雨图2.3贝叶斯网络示例贝叶斯网络满足局部马尔可夫性（localMarkovproperty），即在给定一个结点的父结点的情况下，该父结点有条件地独立于它的非后代结点（non-descendant）。在图2.3中，局部马尔可夫性意味着P（洒水车丨多云，下雨）=P（洒水车丨","页":"书内 p.42 / PDF p.57","书内页":42,"PDF页":57,"讲解":"这段用贝叶斯网络的例子说明不确定性推理怎么落地。图中四个因素——多云、洒水车、下雨、路湿——彼此影响，边上用概率刻画影响强度，例如多云时有 10% 概率出动洒水车、80% 概率下雨；在有洒水车且不下雨的情况下，有 10% 概率路面不湿。这类网络的价值是：不必枚举所有联合概率，只存“每个结点在给定父结点下的条件概率”，就能做概率推断。教材随后给出理论依据——贝叶斯网络满足局部马尔可夫性：给定一个结点的父结点，该结点条件独立于它的所有非后代结点。这句话是化简计算的关键。","讲解来源":"self","核对":"locator","原文核对":"部分相符"}]},"L3":{"img":"bookimg/yl-p57.jpg","focus":"img/kp-综合-确定性与不确定性推理.jpg","bbox":[0.1139,0.0741,0.8895,0.4226],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-专家系统基本原理","模块":"综合模块","知识领域":"逻辑推理与知识图谱","知识单元":"专家系统与知识图谱","知识点":"专家系统基本原理","要求":"理解","考纲来源":"官方","题数":7,"题id":["38A-E-03","TB-DX4-HW-06","TB-DX4-HW-58","TB-DX4-HW-70","SEC2-CH1-06","DIG-44-01","DIG-44-02"],"教材":"yl","教材名":"人工智能引论","章节":"2.3 谓词逻辑（专家系统）","书内页":34,"PDF页":49,"状态":"完整","L1":{"一句话":"专家系统一般由知识库和推理机组成：先把领域知识逻辑化表示成知识库，再把问题逻辑化后输入推理机，由推理机结合知识库推出答案。","关键词":["知识库","推理机","知识表示","推理输出"],"易错点":"把专家系统说成“训练出来的神经网络”——经典专家系统靠人工表示的知识与规则，不是从数据里学参数；也容易漏掉“问题也要先逻辑化表示”这一步。"},"L2":{"档":"locator","段":[{"n":1,"文":"一般来说，专家系统由知识库和推理机组成。先对某个领域的自然语言、文本语句等信息进行逻辑化表示形成知识库，在给定新的问题时，对该问题也进行逻辑化表示，并将该问题表示输入推理机，推理机根据已有的知识库和问题表示进行推理，从而输出答案。","页":"书内 p.34 / PDF p.49","书内页":34,"PDF页":49,"讲解":"这段给出专家系统的最小结构，只有两个部件：知识库与推理机。流程分三步，顺序不能颠倒：先对某个领域的自然语言、文本语句等信息做逻辑化表示，形成知识库；再对给定的新问题做同样的逻辑化表示；最后把问题表示输入推理机，推理机依据已有知识库与问题表示进行推理，输出答案。理解要点是把“知识”与“推理”分开——知识库回答“懂什么”，推理机回答“怎么用”。这也解释了专家系统的两个典型瓶颈：知识获取难（要靠人一条条写进去），以及推理能力受限于已有规则、不会自己发现新知识。","讲解来源":"self","核对":"locator","原文核对":"通过"}]},"L3":{"img":"bookimg/yl-p49.jpg","focus":"img/kp-综合-专家系统基本原理.jpg","bbox":[0.1116,0.149,0.8918,0.5594],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-知识图谱基本原理","模块":"综合模块","知识领域":"逻辑推理与知识图谱","知识单元":"专家系统与知识图谱","知识点":"知识图谱基本原理","要求":"掌握","考纲来源":"官方","题数":10,"题id":["38A-B-03","TB-YL-EX-09","TB-YL-EX-10","TB-YL-HW-08","TB-YL-HW-56","TB-YL-HW-57","DIG-45-01","DIG-45-02","DIG-45-03","DIG-45-04"],"教材":"yl","教材名":"人工智能引论","章节":"2.4 知识图谱推理","书内页":35,"PDF页":50,"状态":"完整","L1":{"一句话":"知识图谱由有向图构成，用来描述现实世界中的实体及实体之间的关系；结点表示实体，两个结点之间的连线表示它们具有某种关系。","关键词":["有向图","结点＝实体","边＝关系","知识表示方式"],"易错点":"把知识图谱说成“一张表”或“一棵树”（它是图，允许一个实体连多个实体、可成环）；也容易忽略“有向”——关系的方向有语义。"},"L2":{"档":"locator","段":[{"n":1,"文":"知识图谱由有向图构成，被用来描述现实世界中实体及实体之间的关系，是人工智能中进行知识表达的重要方式。知识图谱中每个结点表示客观世界中的一个实体，两个结点之间的连线表示结点具有某一关系。","页":"书内 p.35 / PDF p.50","书内页":35,"PDF页":50,"讲解":"这段是知识图谱的定义句，三个要点一次说完：形式是有向图；用途是描述现实世界中的实体及实体之间的关系；地位是人工智能中进行知识表达的重要方式。接着解释图的两个元素：每个结点表示客观世界中的一个实体，两个结点之间的连线表示结点具有某一关系。理解时对比前面的表示法：谓词逻辑把知识写成公式，知识图谱把知识画成图——前者便于推理演算，后者便于存储、查询与可视化，也更适合承载大规模事实。答题时“实体—关系—实体”这个三元组结构要说出来。","讲解来源":"self","核对":"locator","原文核对":"对不上"}]},"L3":{"img":"bookimg/yl-p50.jpg","focus":"img/kp-综合-知识图谱基本原理.jpg","bbox":[0.1036,0.0236,0.9448,0.2622],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-本体知识表示","模块":"综合模块","知识领域":"逻辑推理与知识图谱","知识单元":"专家系统与知识图谱","知识点":"本体知识表示","要求":"掌握","考纲来源":"官方","题数":10,"题id":["38A-F-07","DIG-46-01","DIG-46-02","DIG-46-03","DIG-46-04","DIG-46-05","DIG-46-06","DIG-46-07","DIG-46-08","DIG-46-09"],"教材":"yl","教材名":"人工智能引论","章节":"附录 A 进阶知识点","书内页":319,"PDF页":334,"状态":"完整","L1":{"一句话":"本体是对某一领域概念及其关系的规范化、共享化的形式说明；教材把它列为进阶知识点，未在正文展开，只在附录说明进阶内容的组织方式。","关键词":["概念规范化","共享","形式化说明","进阶知识点"],"易错点":"把本体等同于“知识图谱”（本体是概念层的规范，知识图谱是实例层的事实网络，二者常配合使用）；也容易以为教材正文有专节讲本体——实际只有附录提及。"},"L2":{"档":"locator","段":[{"n":1,"文":"附录 A进阶知识点为了更加全面了解人工智能，计算机领域本科教育教学改革试法基础、养伦理意识、匠工具平台、促赋能应用”的培养目标，设置了由10个模块及63个知识点构成的课程知识图谱，在63个知识点中包含了若干进阶知识点。由于进阶知识点内容较为复杂，本书以“卡片式”风格来介绍AdaBoosting算法、非负矩阵分解、主题建模、隐马尔可夫模型、朴素贝叶斯概率图模型、生成式对抗学习、图神经网络和多智能体博奔等进阶知识点。在介绍中先阐述相应知识点拟解决的问题，然后概略介绍知识点的内容。关于进阶知识点的算法核心流程及用来解决实际问题的示例内容，可访问相关数字资源进一步了解。","页":"书内 p.319 / PDF p.334","书内页":319,"PDF页":334,"讲解":"这段是教材附录 A 的扉页，交代进阶知识点的组织方式：为配合课程知识图谱建设，设置了由 10 个模块、63 个知识点构成的体系，其中若干为进阶知识点；因为内容较复杂，采用“卡片式”风格介绍 AdaBoosting、非负矩阵分解、主题建模、隐马尔可夫模型、朴素贝叶斯概率图模型、生成式对抗学习、图神经网络、多智能体博弈等。需要如实说明：本页并没有本体知识表示的正文，教材也未单列此节，考纲要求为“掌握”但教材未展开，属于需要按通用表述补足的条目。复习时把握本体的核心——对领域概念、属性及其关系做显式、共享、可复用的规范化描述。","讲解来源":"self","核对":"locator","原文核对":"无法比对"}]},"L3":{"img":"bookimg/yl-p334.jpg","页来源":"pdf-render","核对":"页码存疑"}},{"id":"kp-综合-逻辑回归","模块":"综合模块","知识领域":"机器学习","知识单元":"机器学习补充方法","知识点":"逻辑回归","要求":"掌握","考纲来源":"官方","题数":10,"题id":["38A-A-09","38A-E-11","GUIDE-OPS-05","TB-DX4-HW-185","DIG-47-01","DIG-47-02","DIG-47-03","DIG-47-04","DIG-47-05","DIG-47-06"],"教材":"yl","教材名":"人工智能引论","章节":"4.3 回归分析（逻辑斯谛回归提及）","书内页":108,"PDF页":123,"状态":"完整","L1":{"一句话":"逻辑斯谛回归是在回归模型中引入 sigmoid 函数的一种非线性回归模型，主要用于二分类；它被提出来缓解线性回归对离群点敏感的问题。","关键词":["sigmoid","二分类","非线性回归模型","对离群点敏感"],"易错点":"以为名字带“回归”就做回归任务——教材明确它用于分类；也容易把 sigmoid 的输出说成“预测值本身”，它给的是属于某类的概率。"},"L2":{"档":"locator","段":[{"n":1,"文":"线性回归一个明显的问题是对离群点（与大多数数据点距离较远的数据点，outlier）非常敏感，导致模型建模不稳定，使结果有偏。为了缓解这个问题（特别是在二分类场景中）带来的影响，可考虑逻辑斯谛回归（logistic regression）。逻辑斯谛回归就是在回归模型中引入 sigmoid 函数的一种非线性回归模型。","页":"书内 p.108 / PDF p.123","书内页":108,"PDF页":123,"讲解":"这段给出逻辑回归的动机与定义。动机：线性回归有个明显问题——对离群点（与大多数数据点距离较远的数据点）非常敏感，会导致建模不稳定、结果有偏；为缓解这个问题（特别是在二分类场景中），可以考虑逻辑斯谛回归。定义：逻辑斯谛回归就是在回归模型中引入 sigmoid 函数的一种非线性回归模型。理解要点有两层：一是它把线性输出压到 0–1 之间，从而可以解释为概率，再按阈值判类；二是“引入 sigmoid”让它对极端值不再线性放大，鲁棒性比纯线性回归好。教材在“回归”一节点出它，同时在 5.3 节把逻辑回归明确归入分类，两处要合起来看。","讲解来源":"self","核对":"locator","原文核对":"通过"}]},"L3":{"img":"bookimg/yl-p123.jpg","页来源":"scan","核对":"pending"}},{"id":"kp-综合-决策树","模块":"综合模块","知识领域":"机器学习","知识单元":"机器学习补充方法","知识点":"决策树","要求":"掌握","考纲来源":"官方","题数":10,"题id":["38A-A-08","38A-C-05","38A-E-04","38A-H-03","GUIDE-ESSAY-08","TB-YL-EX-12","TB-YL-HW-20","DIG-48-01","DIG-48-02","DIG-48-03"],"教材":"yl","教材名":"人工智能引论","章节":"4.4 决策树","书内页":108,"PDF页":123,"状态":"完整","L1":{"一句话":"决策树把分类问题分解为若干基于单个属性的判断：内部结点是对某属性的判断，分支是判断结果，叶子结点是一种分类结果，整棵树可看作一组决策规则。","关键词":["属性判断","分支","叶子＝分类结果","决策规则"],"易错点":"把决策树的“深度”当成“规则条数”（规则数对应叶子数）；也容易以为决策树只能做分类——它同样可用于回归。"},"L2":{"档":"locator","段":[{"n":1,"文":"4.4决策树对分类目标在某个属性上的一个判断，每个分支代表基于该属性做出的一个判断，每个叶子结点代表一种分类结果，因此决策树可以看作一系列以叶子结点为输出的决策规则(decisionrules)（Quinlan,1987）。4.4.1决策树分类案例决策树决策树将分类问题分解为若干基于单个信息的推理任务，采用树状结构逐步完成决策判断。事实上，人们在逻辑推理过程中经常使用决策树的思想。下面通过一个示例来解释决策树的分类。银行的数据分析师希望通过历史的贷款记录、用户
