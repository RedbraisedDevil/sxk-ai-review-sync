），然后让由这些染色体构成的种群向最优解进化。在每一次进化过程中，计算每个染色体（即候选解）的适应度(fitness），根据适应度选择合适的染色体，随后施以选择和变异来产生新的生命种群，该种群在算法下一次的迭代中被作为当前种群。遗传算法的基本流程如下：步骤1：初始化具有若干规模数目的群体。当前进化代数Generation=0。步骤2：采用评估函数计算群体中每个染色体的适应值，保存适应值最大的染色体Best。步骤3：采用轮盘赌选择算法对","页":"书内 p.127 / PDF p.142","书内页":127,"PDF页":142,"讲解":"这段是演化学习与遗传算法的入口。教材先说演化算法有很多实现：遗传算法（GA）、遗传规划（GP）、演化策略等，遗传算法是其中的代表性算法；它的思想来自达尔文“物竞天择，适者生存”的进化论，通过引入选择等操作让种群逐代进化。具体到“轮盘赌选择”：把每个个体的适应度看作扇区面积，适应度越高扇区越大，转盘一转被选中的概率就越大，但个体是否被选中仍是随机的——这既保留了“适者生存”的偏向，又保留了探索性，避免过早收敛到局部最优。","讲解来源":"self","核对":"locator","原文核对":"OCR 摘录（非逐字承诺）"}]},"L3":{"页来源":"none","核对":"页图缺失","说明":"页图源未覆盖该页；页码来自整本 OCR，正文摘录见 L2，未附截图"}}],"qmap":{"38A-A-01":0,"38A-A-02":73,"38A-A-03":103,"38A-A-04":15,"38A-A-05":23,"38A-A-06":28,"38A-A-07":36,"38A-A-08":54,"38A-A-09":53,"38A-A-10":36,"38A-A-11":32,"38A-A-12":8,"38A-A-13":63,"38A-A-14":13,"38A-A-15":64,"38A-A-16":79,"38A-A-17":89,"38A-A-18":68,"38A-A-19":55,"38A-A-20":81,"38A-A-21":20,"38A-B-01":0,"38A-B-02":9,"38A-B-03":51,"38A-B-04":14,"38A-B-05":22,"38A-B-06":22,"38A-B-07":19,"38A-B-08":87,"38A-B-09":31,"38A-B-10":1,"38A-B-11":44,"38A-C-01":1,"38A-C-02":13,"38A-C-03":60,"38A-C-04":23,"38A-C-05":54,"38A-C-06":21,"38A-C-07":36,"38A-C-08":101,"38A-C-09":30,"38A-C-10":38,"38A-C-11":100,"38A-D-01":57,"38A-D-02":10,"38A-D-03":4,"38A-D-04":26,"38A-D-05":13,"38A-D-06":23,"38A-D-07":64,"38A-D-08":27,"38A-D-09":4,"38A-D-10":38,"38A-D-11":100,"38A-E-01":72,"38A-E-02":39,"38A-E-03":50,"38A-E-04":54,"38A-E-05":60,"38A-E-06":13,"38A-E-07":13,"38A-E-08":65,"38A-E-09":29,"38A-E-10":64,"38A-E-11":53,"38A-F-01":62,"38A-F-02":67,"38A-F-03":69,"38A-F-04":23,"38A-F-05":0,"38A-F-06":21,"38A-F-07":52,"38A-F-08":27,"38A-F-09":25,"38A-F-10":63,"38A-F-11":106,"38A-G-01":75,"38A-G-02":79,"38A-G-03":73,"38A-G-04":23,"38A-G-05":65,"38A-G-06":4,"38A-G-07":37,"38A-G-08":19,"38A-G-09":68,"38A-G-10":98,"38A-G-11":17,"38A-H-01":16,"38A-H-02":15,"38A-H-03":54,"38A-H-04":55,"38A-I-01":17,"38A-I-02":55,"38A-I-03":64,"38A-I-04":59,"DIG-01-01":0,"DIG-01-02":0,"DIG-01-03":0,"DIG-01       var cls = p[0]==='all' ? '' : ' ' + p[0];
      return '<button class="chip'+cls+'" data-state="'+p[0]+'" aria-pressed="'+(view.state===p[0])+'"'+
        (p[0]==='all'?'':'>'+'<span class="dot"></span>')+(p[0]==='all'?'':'')+
        (p[0]==='all' ? '>'+p[1]+'<span class="n">'+cnt.all+'</span>' : '<span>'+p[1]+'</span><span class="n">'+cnt[p[0]]+'</span>')+'</button>';
    }).join('');
    $('listCount').textContent = view.list.length + ' / ' + CARDS.length;
  }
  function renderList(){
    var ul = $('list');
    if(!view.list.length){
      ul.innerHTML = '';
      $('listEmpty').hidden = false;
      $('listEmpty').innerHTML = view.q
        ? '<h3>没有匹配的知识点</h3><p class="tiny">换个说法试试：可以搜知识点名、关键词、教材原文里的句子。</p>'
        : '<h3>当前筛选没有结果</h3><p class="tiny">放宽筛选条件，或点上面的「全部」。</p>';
      return;
    }
    $('listEmpty').hidden = true;
    var html = [];
    for(var i=0;i<view.list.length;i++){
      var c = view.list[i], s = stats[c.id] || {};
      var meta = [];
      if(s.practiced) meta.push('练 '+s.practiced);
      else meta.push('<span class="muted">未练</span>');
      if(s.wrong) meta.push('<span class="warn">错 '+s.wrong+'</span>');
      if(s.rate !== null && s.rate !== undefined) meta.push('正确率 '+s.rate+'%');
      html.push('<li><a class="item" href="#/kp/'+encodeURIComponent(c.id)+'" data-id="'+esc(c.id)+'"'+
        (view.id===c.id?' aria-current="true"':'')+'>'+
        '<span class="t"><span class="dotstate s-'+s.state+'"></span><span class="name">'+hl(c['知识点'])+'</span></span>'+
        '<span class="path">'+esc(c['知识领域'])+' · '+esc(c['知识单元'])+'</span>'+
        '<span class="meta">'+meta.join('<span style="color:var(--line)">|</span>')+'<span style="color:var(--line)">|</span>题 '+(c['题数']||0)+'</span>'+
        '</a></li>');
    }
    ul.innerHTML = html.join('');
  }

  /* ---------- 详情渲染 ---------- */
  function segHtml(s, n){
    var tags = (s['讲什么']||[]).map(function(t){ return '<span class="tag">'+esc(t)+'</span>'; }).join('');
    var ex = s['讲解'] ? '<div class="explain"><span class="lab">讲解</span>'+hl(s['讲解'])+'</div>' : '';
    return '<article class="seg">'+
      '<div class="segtop"><span class="p">'+esc(s['页']||('第 '+n+' 段'))+'</span>'+tags+
      (s['原文核对']?'<span>'+esc(s['原文核对'])+'</span>':'')+'</div>'+
      '<div class="quote">'+hl(s['文']||'')+'</div>'+ex+'</article>';
  }
  function renderDetail(c){
    var box = $('detail');
    if(!c){ box.innerHTML = '<div class="empty"><h3>从左侧选一个知识点</h3><p class="tiny">支持键盘：<kbd>/</kbd> 搜索、<kbd>↑</kbd><kbd>↓</kbd> 切换、<kbd>Enter</kbd> 打开。</p></div>'; return; }
    var s = stats[c.id] || {}, l1 = c.L1 || {}, l2 = c.L2 || {}, l3 = c.L3 || {};
    var tier = l2['档'] || 'none';
    var st = s.state || 'none';
    var bcls = { '掌握':'b-must', '理解':'b-need', '知道':'' }[c['要求']] || '';
    var stcls = { wrong:'b-wrong', mastered:'b-ok' }[st] || '';

    var h = [];
    h.push('<div class="dwrap">');
    h.push('<div class="crumb"><span>'+esc(c['模块']||'')+'</span><span class="sep">›</span><span>'+esc(c['知识领域']||'')+
      '</span><span class="sep">›</span><span>'+esc(c['知识单元']||'')+'</span></div>');
    h.push('<h1 class="dtitle">'+hl(c['知识点'])+'</h1>');
    h.push('<div class="badges">'+
      '<span class="badge '+bcls+'">要求：'+esc(c['要求']||'—')+'</span>'+
      '<span class="badge '+stcls+'">'+STATE_LABEL[st]+'</span>'+
      (c['考纲来源']==='考纲外'?'<span class="badge b-ext">考纲外条目</span>':'')+
      '<span class="badge">'+esc(c['教材名']||'教材未涉及')+(c['章节']?' · '+esc(c['章节']):'')+'</span>'+
      (c['书内页']?'<span class="badge">书内 p.'+c['书内页']+'</span>':'')+
      '</div>');

    h.push('<div class="stats">'+
      '<div class="cell"><div class="k">相关题</div><div class="v">'+(s.total||0)+'</div></div>'+
      '<div class="cell"><div class="k">练过</div><div class="v">'+(s.practiced||0)+'</div></div>'+
      '<div class="cell"><div class="k">错题本里</div><div class="v'+(s.wrong?'" style="color:var(--err)':'')+'">'+(s.wrong||0)+'</div></div>'+
      '<div class="cell"><div class="k">正确率</div><div class="v small">'+(s.rate===null||s.rate===undefined?'—':s.rate+'%')+'</div></div>'+
      '<div class="cell"><div class="k">教材口径</div><div class="v small">'+TIER_LABEL[tier]+'</div></div>'+
      '</div>');

    // L1
    h.push('<section class="sec"><div class="sechead"><span class="lv">L1</span><h2>一句话说清</h2>'+
      '<span class="hint">'+(tier==='general'?'通用表述':'依据教材')+'</span></div>');
    h.push('<div class="card">');
    if(l1['一句话']) h.push('<div class="oneline">'+hl(l1['一句话'])+'</div>');
    else h.push('<div class="muted">本条暂无一句话总结。</div>');
    if(l1['关键词'] && l1['关键词'].length) h.push('<div class="kw">'+l1['关键词'].map(function(k){ return '<span>'+esc(k)+'</span>'; }).join('')+'</div>');
    var pit = l1['易错点'] || (Array.isArray(l1['易错']) ? l1['易错'].join('；') : l1['易错']);
    if(pit) h.push('<div class="pit"><b>易错点</b>　'+hl(pit)+'</div>');
    h.push('</div></section>');

    // L2
    var segs = l2['段'] || [];
    h.push('<section class="sec"><div class="sechead"><span class="lv">L2</span><h2>教材怎么说</h2>'+
      '<span class="hint">'+segs.length+' 段 · 讲解为本程序撰写，非教材原文</span></div>');
    h.push('<div class="tierbanner tb-'+tier+'"><b>'+TIER_LABEL[tier]+'</b><span>'+TIER_NOTE[tier]+'</span></div>');
    if(!segs.length){
      h.push('<div class="noimg">本条的教材段落尚未录入。</div>');
    }else{
      for(var i=0;i<segs.length;i++) h.push(segHtml(segs[i], i+1));
    }
    h.push('</section>');

    // L3
    h.push('<section class="sec"><div class="sechead"><span class="lv">L3</span><h2>教材原页</h2>'+
      '<span class="hint">'+(l3['页来源']==='pdf-render'?'按 PDF 补渲染页':'扫描页')+'</span></div>');
    var shots = [];
    if(l3['focus']) shots.push({src:l3['focus'], cap:'该知识点的教材原文区域（裁图）'});
    if(l3['img']) shots.push({src:l3['img'], cap:'整页原图'+(c['PDF页']?'（PDF p.'+c['PDF页']+'）':'')});
    if(shots.length){
      h.push('<div class="shots'+(shots.length>1?' two':'')+'">'+shots.map(function(s){
        return '<figure class="shot" data-src="'+esc(s.src)+'" style="margin:0"><img loading="lazy" src="'+esc(s.src)+'" alt="'+esc(s.cap)+'"><figcaption>'+esc(s.cap)+'</figcaption></figure>';
      }).join('')+'</div>');
    }else{
      h.push('<div class="noimg">'+esc(l3['说明'] || '本版未收录该页截图（页图源未覆盖此页）。')+'</div>');
    }
    h.push('</section>');

    // 动作与来源
    h.push('<div class="actions">'+
      '<a class="btn primary" href="../index.html#/q/'+encodeURIComponent((c['题id']||[])[0]||'')+'" target="_blank" rel="noopener">去主程序做相关题</a>'+
      '<button class="btn" id="copyLink">复制本条链接</button>'+
      '<button class="btn" id="prevBtn">上一个</button><button class="btn" id="nextBtn">下一个</button>'+
      '</div>');
    h.push('<div class="foot"><span>数据版本 '+esc(KP_BUILD)+'</span><span>·</span>'+
      '<span>共 '+(c['题数']||0)+' 道相关题</span><span>·</span>'+
      '<span>原文核对：'+esc((segs[0]&&segs[0]['原文核对'])||l3['核对']||'—')+'</span>'+
      (data.meta && data.meta.mode==='cloud' ? '<span>·</span><span>分类含云端记录</span>' : '')+'</div>');
    h.push('</div>');
    box.innerHTML = h.join('');

    box.querySelectorAll('.shot').forEach(function(fig){
      fig.addEventListener('click', function(){
        $('lightboxImg').src = fig.getAttribute('data-src');
        $('lightbox').hidden = false;
      });
    });
    $('lightbox').onclick = function(){ $('lightbox').hidden = true; $('lightboxImg').src=''; };
    var cp = $('copyLink');
    if(cp) cp.addEventListener('click', function(){
      var url = location.origin + location.pathname + '#/kp/' + encodeURIComponent(c.id);
      var done = function(){ cp.textContent = '已复制'; setTimeout(function(){ cp.textContent='复制本条链接'; }, 1400); };
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, function(){ prompt('复制这条链接：', url); });
      else prompt('复制这条链接：', url);
    });
    var i = view.list.findIndex ? view.list.findIndex(function(x){ return x.id===c.id; }) : -1;
    if(i < 0) for(var k=0;k<view.list.length;k++) if(view.list[k].id===c.id) i = k;
    var pv = $('prevBtn'), nx = $('nextBtn');
    if(pv) pv.addEventListener('click', function(){ if(i>0) select(view.list[i-1].id); });
    if(nx) nx.addEventListener('click', function(){ if(i>=0 && i<view.list.length-1) select(view.list[i+1].id); });
    box.scrollTop = 0;
  }

  function select(id, silent){
    view.id = id;
    location.hash = '#/kp/' + encodeURIComponent(id);
    var c = find(id);
    renderDetail(c);
    var items = document.querySelectorAll('.item');
    for(var i=0;i<items.length;i++){
      if(items[i].getAttribute('data-id') === id) items[i].setAttribute('aria-current','true');
      else items[i].removeAttribute('aria-current');
    }
  }
  function fromHash(){
    var m = /^#\/kp\/(.+)$/.exec(location.hash || '');
    if(m){ try{ return decodeURIComponent(m[1]); }catch(e){ return m[1]; } }
    /* 主程序「题目操作栏」进来的形态：#/q/<题目id> → 换成本条知识点 */
    var n = /^#\/q\/(.+)$/.exec(location.hash || '');
    if(n){
      var qid;
      try{ qid = decodeURIComponent(n[1]); }catch(e){ qid = n[1]; }
      var map = (KP_DATA && KP_DATA.qmap) || {};
      var i = map[qid];
      if(typeof i === 'number' && CARDS[i]) return CARDS[i].id;
      var c = null;
      for(var k=0;k<CARDS.length;k++){ if((CARDS[k]['题id']||[]).indexOf(qid)>=0){ c = CARDS[k]; break; } }
      if(c) return c.id;
    }
    return null;
  }

  /* ---------- 筛选 UI ---------- */
  function buildFilters(){
    var reqs = [], mods = [], tiers = [];
    for(var i=0;i<CARDS.length;i++){
      var c = CARDS[i];
      if(reqs.indexOf(c['要求'])<0 && c['要求']) reqs.push(c['要求']);
      if(mods.indexOf(c['模块'])<0 && c['模块']) mods.push(c['模块']);
      var t = (c.L2||{})['档']; if(tiers.indexOf(t)<0 && t) tiers.push(t);
    }
    reqs.sort(function(a,b){ return (REQ_ORDER[b]||0)-(REQ_ORDER[a]||0); });
    var map = { req:reqs, mod:mods, tier:tiers };
    ['req','mod','tier'].forEach(function(dim){
      var row = document.querySelector('.frow[data-dim="'+dim+'"]');
      (map[dim]||[]).forEach(function(v){
        var label = dim==='tier' ? (TIER_LABEL[v]||v) : v;
        var b = document.createElement('button');
        b.className = 'fchip'; b.setAttribute('aria-pressed','false');
        b.textContent = label; b.dataset.dim = dim; b.dataset.val = v;
        row.appendChild(b);
      });
    });
    var rowImg = document.querySelector('.frow[data-dim="img"]');
    [['all','不限'],['has','有截图'],['no','无截图']].forEach(function(p){
      var b = document.createElement('button');
      b.className='fchip'; b.setAttribute('aria-pressed', p[0]==='all'?'true':'false');
      b.textContent = p[1]; b.dataset.dim='img'; b.dataset.val=p[0];
      rowImg.appendChild(b);
    });
    $('filters').addEventListener('click', function(e){
      var b = e.target.closest('.fchip'); if(!b) return;
      var dim = b.dataset.dim, val = b.dataset.val;
      if(dim === 'img'){
        view.img = val;
        rowImg.querySelectorAll('.fchip').forEach(function(x){ x.setAttribute('aria-pressed', x===b ? 'true':'false'); });
      }else{
        var key = { req:'req', mod:'mod', tier:'tier' }[dim];
        if(view[key][val]){ delete view[key][val]; b.setAttribute('aria-pressed','false'); }
        else { view[key][val] = true; b.setAttribute('aria-pressed','true'); }
      }
      rebuild();
    });
  }

  /* ---------- 同步状态 ---------- */
  function paintSync(){
    var m = data.meta || {};
    var badge = $('syncBadge'), text = $('syncText'), banner = $('banner');
    badge.className = 'syncbadge' + (m.mode==='cloud' ? ' on' : (m.error ? ' err' : ''));
    if(!m.configured){
      text.textContent = '未配同步码 · 点此配置';
      badge.classList.remove('on');
    }else if(m.mode === 'cloud'){
      text.textContent = '云端已连接' + (m.at ? ' · ' + fmtTime(m.at) : '');
      badge.classList.add('on');
    }else if(m.error){
      text.textContent = '云端未连接';
      badge.classList.add('err');
    }else{
      text.textContent = '本机记录';
    }

    if(m.error){
      banner.hidden = false;
      banner.className = 'banner';
      banner.innerHTML = '<span>云端未连接（'+esc(m.error)+'），以下分类基于本机记录。</span><button class="btn" id="retryBtn">重试</button>';
      var rb = $('retryBtn');
      if(rb) rb.addEventListener('click', function(){ reload(true); });
    }else if(m.mode === 'none'){
      banner.hidden = false;
      banner.className = 'banner info';
      banner.innerHTML = '<span>本机暂无作答记录，'+CARDS.length+' 条均为「未练」。点右上角「未配同步码」填入同步码，或先在主程序里做几道题再同步一次。</span>';
    }else if(m.mode === 'cloud' && Object.keys(data.rec||{}).length === 0){
      banner.hidden = false;
      banner.className = 'banner info';
      banner.innerHTML = '<span>已连上云端，但云端还没有作答记录。</span>';
    }else{
      banner.hidden = true;
    }
  }
  /* ---------- 同步码配置（本页只写这一个配置键，作答记录仍只读） ---------- */
  (function(){
    var KEY = 'sxk.sync.code.v1';
    function norm(v){
      if(window.KPSync && KPSync.normCode) return KPSync.normCode(v);
      return String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
    }
    function mask(v){
      if(window.KPSync && KPSync.maskCode) return KPSync.maskCode(v);
      v = String(v||''); return v.length<=4 ? '••••' : v.slice(0,3)+'••••'+v.slice(-2);
    }
    var dlg=$('syncDlg'), inp=$('syncCodeInput'), hint=$('syncDlgHint');
    function openDlg(){
      var cur=''; try{ cur=localStorage.getItem(KEY)||''; }catch(e){}
      inp.value = cur ? norm(cur) : '';
      hint.textContent = cur ? '当前已配置：'+mask(norm(cur)) : '当前未配置，只能读本机记录。';
      if(dlg.showModal) dlg.showModal(); else dlg.setAttribute('open','');
      setTimeout(function(){ inp.focus(); inp.select(); },30);
    }
    function closeDlg(){ if(dlg.close) dlg.close(); else dlg.removeAttribute('open'); }
    $('syncBadge').addEventListener('click', openDlg);
    $('syncDlgCancel').addEventListener('click', closeDlg);
    $('syncDlgSave').addEventListener('click', function(){
      var v = norm(inp.value);
      if(!v){ hint.textContent='同步码不能为空。'; inp.focus(); return; }
      try{ localStorage.setItem(KEY, v); }
      catch(e){ hint.textContent='浏览器拒绝写入本地存储，请检查隐私模式。'; return; }
      location.reload();
    });
    $('syncDlgClear').addEventListener('click', function(){
      try{ localStorage.removeItem(KEY); }catch(e){}
      location.reload();
    });
    inp.addEventListener('keydown', function(e){
      if(e.key==='Enter'){ e.preventDefault(); $('syncDlgSave').click(); }
    });
  })();

  function fmtTime(ts){
    var d = new Date(ts), p = function(n){ return (n<10?'0':'')+n; };
    return (d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
  }
  function reload(force){
    $('syncText').textContent = '读取记录…';
    var p = (window.KPSync && KPSync.load) ? KPSync.load({force:!!force}) : Promise.resolve({rec:{},mis:[],del:{},meta:{mode:'none',configured:false}});
    p.then(function(d){
      data = d || {rec:{},mis:[],del:{},meta:{mode:'none'}};
      computeStats(); paintSync(); rebuild();
    }).catch(function(e){
      data = {rec:{},mis:[],del:{},meta:{mode:'local',error:'读取失败'}};
      computeStats(); paintSync(); rebuild();
    });
  }

  /* ---------- 事件 ---------- */
  $('q').addEventListener('input', function(){ view.q = this.value; view.id = null; rebuild(); });
  $('sort').addEventListener('change', function(){ view.sort = this.value; rebuild(); });
  $('stateChips').addEventListener('click', function(e){
    var b = e.target.closest('.chip'); if(!b) return;
    view.state = b.dataset.state;
    this.querySelectorAll('.chip').forEach(function(x){ x.setAttribute('aria-pressed', x===b ? 'true':'false'); });
    view.id = null; rebuild();
  });
  $('list').addEventListener('click', function(e){
    var a = e.target.closest('.item'); if(!a) return;
    e.preventDefault();
    select(a.getAttribute('data-id'));
  });
  document.addEventListener('keydown', function(e){
    if(e.key === '/' && document.activeElement !== $('q')){ e.preventDefault(); $('q').focus(); $('q').select(); return; }
    if(e.key === 'Escape'){ $('q').value=''; view.q=''; rebuild(); $('lightbox').hidden = true; return; }
    if(e.target === $('q')) return;
    if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      if(!view.list.length) return;
      var i = view.list.findIndex ? view.list.findIndex(function(x){ return x.id===view.id; }) : 0;
      var j = e.key === 'ArrowDown' ? Math.min(view.list.length-1, i+1) : Math.max(0, i-1);
      e.preventDefault(); select(view.list[j].id);
    }
  });
  window.addEventListener('hashchange', function(){
    var id = fromHash();
    if(id && id !== view.id && find(id)){ view.id = id; renderDetail(find(id)); }
  });

  /* ---------- 启动 ---------- */
  buildFilters();
  reload(false);
  var startId = fromHash();
  if(startId){
    // 等数据算完再定位，避免详情里统计为空
    setTimeout(function(){ if(find(startId)) select(startId); }, 0);
  }
  if(KP_DATA && KP_DATA.count !== CARDS.length){
    console.warn('[kp] 内联条数与声明不一致：', KP_DATA.count, CARDS.length);
  }
})();
</script>
</body>
</html>
