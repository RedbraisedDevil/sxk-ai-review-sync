的四种特征（年龄、银行流水、婚姻状况、房产状况）及最终是否给予贷款来建立分类模型，以辅助决策者进行决策。银行收集整理的数据如表4.5所示。表4.5是否给予贷款与申请人自身状况的关系序号年龄","页":"书内 p.108 / PDF p.123","书内页":108,"PDF页":123,"讲解":"这段给决策树的结构定义：对分类目标在某个属性上的一个判断，每个分支代表基于该属性做出的一个判断，每个叶子结点代表一种分类结果，因此决策树可以看作一系列以叶子结点为输出的决策规则。理解时把树的三个部分对上号：根与内部结点负责“问问题”，边是“答案分支”，叶子是“结论”。教材接着用银行贷款的例子说明它怎么建：分析师拿历史贷款记录、用户的四种特征（年龄、银行流水、婚姻状况、房产状况）以及最终是否放贷，建立分类模型辅助决策。这里体现决策树的两个好处——过程可解释（每一步判断都看得见）、不需要先把特征缩放。","讲解来源":"self","核对":"locator","原文核对":"对不上"}]},"L3":{"img":"bookimg/yl-p123.jpg","focus":"img/kp-综合-决策树.jpg","bbox":[0.1116,0.7036,0.8953,0.9389],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-支持向量机","模块":"综合模块","知识领域":"机器学习","知识单元":"机器学习补充方法","知识点":"支持向量机","要求":"掌握","考纲来源":"官方","题数":10,"题id":["38A-A-19","38A-H-04","38A-I-02","TB-YL-HW-22","DIG-49-01","DIG-49-02","DIG-49-03","DIG-49-04","DIG-49-05","DIG-49-06"],"教材":"yl","教材名":"人工智能引论","章节":"1.3 智能计算方法（SVM 提及）","书内页":10,"PDF页":25,"状态":"完整","L1":{"一句话":"支持向量机属于监督学习中的判别式学习方法，与回归分析、提升算法、决策树并列；它的目标是找到把两类样本分开且间隔最大的分界面。","关键词":["监督学习","判别式方法","最大间隔","与决策树并列"],"易错点":"把 SVM 归到无监督学习（教材明确它属监督学习）；也容易把 LDA、隐马尔可夫链当成判别式——教材把这两者列为生成式学习方法。"},"L2":{"档":"locator","段":[{"n":1,"文":"与监督学习不同，顾名思义，无监督学习指数据本身不包含标注信息，半监督学习指一部分数据有标注信息而一部分数据没有标注信息。监督学习算法还包括回归分析、提升算法（boosting）、支持向量机和决策树等判别式学习方法，也包括隐狄利克雷分布（latentDirichletallocation，LDA）和隐马尔可夫链等生成式学习方法。无监督学习则包括聚类、降维（如主成分分析）和最大期望（expectationmaximization，EM）算法等。4.以行为主义为核心的强化学习人工智能领域的一个主要研究目标是实现完全自主的智能体，该智能体能与其所处环境进行交互，根据环境所提供的奖励反馈或惩罚反馈来学习所处状态可施加的最佳行动（如碰墙后折返），通过运用“尝试-试错”（trialanderror）与平衡“探索（未知空间）-利用（已有经验）”（exploration一exploitation）等机制不断进步，改进行动策略。强化学习","页":"书内 p.10 / PDF p.25","书内页":10,"PDF页":25,"讲解":"这段的价值在于给出分类体系，而不是 SVM 的算法细节。教材把学习方法按数据利用方式切开：有监督学习用带标注数据，无监督学习用不带标注的数据，半监督学习一部分有标注一部分没有。然后在监督学习内部再分两路：判别式学习方法包括回归分析、提升算法（boosting）、支持向量机和决策树；生成式学习方法包括隐狄利克雷分布（LDA）和隐马尔可夫链。无监督学习则包括聚类、降维（如主成分分析）和最大期望（EM）算法。所以“SVM 属于哪一类”要答两层：监督学习 → 判别式。紧随其后的第 4 点转入强化学习，强调试错与探索—利用平衡。","讲解来源":"self","核对":"locator","原文核对":"通过"}]},"L3":{"img":"bookimg/yl-p25.jpg","focus":"img/kp-综合-支持向量机.jpg","bbox":[0.1105,0.1262,0.8907,0.5106],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-层次聚类","模块":"综合模块","知识领域":"机器学习","知识单元":"机器学习补充方法","知识点":"层次聚类","要求":"掌握","考纲来源":"官方","题数":10,"题id":["TB-NOTE-05","DIG-50-01","DIG-50-02","DIG-50-03","DIG-50-04","DIG-50-05","DIG-50-06","DIG-50-07","DIG-50-08","DIG-50-09"],"教材":"yl","教材名":"人工智能引论","章节":"4.5 k 均值聚类（层次聚类提及）","书内页":115,"PDF页":130,"状态":"完整","L1":{"一句话":"层次聚类不预设簇数，靠「不断合并最像的两堆」建出一棵聚类树；要看几类，就在树上横切一刀。k 均值是「先定 k 再反复挪中心」，层次聚类是「先不定 k，把过程全记下来」。","易错":["把「凝聚式」当成自顶向下。凝聚是<b>自底向上合并</b>，分裂才是自顶向下拆分。","以为层次聚类也要先定 k。它恰恰是<b>不用</b>定 k 的那个；事后切树才决定类数。","把单链和全链记反：单链看<b>最近</b>的一对（易连成链），全链看<b>最远</b>的一对（倾向紧凑）。","以为层次聚类比 k 均值快。它是 O(n³)，样本一多就崩，这是它最常被考的缺点。"],"对比":[{"维度":"是否要预设簇数","层次聚类":"不需要，事后在树上切","k 均值":"必须事先给定 k"},{"维度":"结果形态","层次聚类":"一棵树（嵌套簇结构）","k 均值":"一组扁平簇"},{"维度":"结果是否稳定","层次聚类":"确定性算法，同数据同结果","k 均值":"依赖初始中心，可能局部最优，需多次重启"},{"维度":"复杂度","层次聚类":"O(n³)，不适合大数据","k 均值":"O(nkt)，可处理大规模"},{"维度":"簇形状假设","层次聚类":"由链接方式决定，单链可出长条","k 均值":"隐含假设簇是凸的、各向同性的球"}]},"L2":{"档":"general","段":[{"n":1,"文":"《人工智能引论》在 4.5 节讲 k 均值聚类时提到层次聚类，但<b>未展开原理</b>。考纲对「层次聚类」的要求是「掌握」，因此本节按学科通用定义补足，教材定位仅到 4.5 节聚类部分（书内 p.115）。","页":"教材仅提及，以下原理为通用教材表述","书内页":115,"PDF页":130,"讲解":"这段是定位说明，必须先说清楚一件事：教材在 4.5 节讲 k 均值聚类时提到层次聚类，但没有展开原理；而考纲对它的要求是“掌握”，所以这一条按学科通用定义补足，教材定位只到 4.5 节。通用定义的要点是：层次聚类不预设簇数，通过反复合并（凝聚式，自底向上）或反复拆分（分裂式，自顶向下）构造一棵聚类树（树状图），要看几类就在树上横切一刀。它和 k 均值形成对照：k 均值先定 K 再迭代挪中心，层次聚类先不定 K、把整个合并过程都记下来，事后切树决定类数。代价是时间复杂度高（约 O(n³)），样本量大时不可用。","讲解来源":"self","核对":"pending","原文核对":"对不上"}]},"L3":{"img":"bookimg/yl-p130.jpg","focus":"img/kp-综合-层次聚类.jpg","bbox":[0.1082,0.3803,0.8907,0.7419],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-集成模型-如-Boosting-随机森林","模块":"综合模块","知识领域":"机器学习","知识单元":"机器学习补充方法","知识点":"集成模型（如 Boosting、随机森林）","要求":"掌握","考纲来源":"官方","题数":10,"题id":["38A-D-01","DIG-51-01","DIG-51-02","DIG-51-03","DIG-51-04","DIG-51-05","DIG-51-06","DIG-51-07","DIG-51-08","DIG-51-09"],"教材":"yl","教材名":"人工智能引论","章节":"附录 A.1 AdaBoosting 算法","书内页":321,"PDF页":336,"状态":"完整","L1":{"一句话":"集成学习把若干弱分类器组合成强分类器：AdaBoosting 通过集成手段提升性能，核心是把复杂分类任务分解为子任务，再由多个弱模型共同完成。","关键词":["弱分类器→强分类器","AdaBoosting","集成 ensemble","提升 boosting"],"易错点":"把“弱”理解成“效果差到没用”——弱分类器只需略好于随机猜测；也容易把 Bagging（随机森林）与 Boosting 混为一谈，前者并行、后者串行纠错。"},"L2":{"档":"locator","段":[{"n":1,"文":"附录A.2非负矩阵分解附录A.1AdaBoosting算法问题提出：对于一个复杂的分类任务，是否可以将其分解为一系列子任务，通过设计一系列仅能完成对应子任务的“弱模型”，然后将这些“弱模型”组合起来形成“强模型”？AdaBoosting（自适应提升）算法通过集成（ensemble）手段来达到提升（boosting）算法性能的目的。该算法的核心思想是（Freundetal.，1996）：对于一个复杂的分类任务，可将其分解为若干个子任务，然后将若干个子任务综合构建到一起，最终完成该复杂分类任务。由于每一个子任务只能完成整体任务的“部分”，因此是一个弱分类器（weakclassifier），将若干个弱分类器组合起来，就形成了一个强分类器（strongclassifier），从而可完成复杂分类","页":"书内 p.321 / PDF p.336","书内页":321,"PDF页":336,"讲解":"这段是 AdaBoosting 的引入。它先提一个问题：对一个复杂的分类任务，能否分解为一系列子任务，设计一系列只能完成对应子任务的“弱模型”，再把它们组合成“强模型”？这就是 AdaBoosting（自适应提升）的核心思想——通过集成（ensemble）手段达到提升（boosting）性能的目的。教材的表述要点：把复杂分类任务分解为若干子任务，每个子任务只能完成整体任务的“部分”，因此是弱分类器；把若干弱分类器组合起来，就形成强分类器，从而完成复杂分类。理解时抓住“分而治之＋组合”这条主线，并注意 AdaBoosting 是串行的、后一个模型重点纠正前一个的错误。","讲解来源":"self","核对":"locator","原文核对":"无法比对"}]},"L3":{"img":"bookimg/yl-p336.jpg","页来源":"pdf-render","核对":"verified"}},{"id":"kp-综合-LDA","模块":"综合模块","知识领域":"机器学习","知识单元":"机器学习补充方法","知识点":"LDA","要求":"理解","考纲来源":"官方","题数":6,"题id":["TB-YL-HW-19","TB-YL-HW-70","DIG-52-01","DIG-52-02","DIG-52-03","DIG-52-04"],"教材":"yl","教材名":"人工智能引论","章节":"4.6 监督学习：特征降维","书内页":115,"PDF页":130,"状态":"完整","L1":{"一句话":"线性判别分析（LDA，也称 Fisher 判别分析）是基于监督学习的降维方法：利用类别信息把高维样本线性投影到低维，使同类尽量靠近、异类尽量远离。","关键词":["监督降维","类别信息","Fisher 判别","类内近类间远"],"易错点":"把 LDA 与 PCA 当成同一类（PCA 无监督、只看方差；LDA 有监督、看类间可分性）；也容易把这里的 LDA 与自然语言处理里的“隐含狄利克雷分布”混名——两者缩写相同、内容无关。"},"L2":{"档":"locator","段":[{"n":1,"文":"算法所弥补，如层次聚类（hierarchicalclustering）不需要事先决定聚类数目K，基于降维的聚类算法谱聚类（spectralclustering）对数据所在坐标空间不敏感，这些算法在此不进行展开。4.6监督学习：特征降维监督学习：特征降维线性判别分析（lineardiscriminantanalysis，LDA）是一种基于监督学习的降维方法，也称为Fisher判别分析（Fisher’sdiscriminant analysis，FDA）（Fisher，1936）。对于一组具有标签信息的高维数据样本，LDA利用其类别信息，将其线性投影到一个低维空间中，在低维空间中，同一类别样吸烟本尽可能靠近，不同类别样本尽可能彼频率此远离。低图4.4给出了用矩形和圆圈表示的患有某一疾病和不患有某一疾病的两类人群。通过调查，这两类人群分别用吸投影直线w烟频率高低和运动频率高低来描述。当然，在图4.4中，假设这两类人群的样本数据符合高斯分布。高运动患病不患病为了对这两类人群进行区分，需要频率高将其投影到一个低维空间中。从图中可图4.4两个类别数据所对应的不同投","页":"书内 p.115 / PDF p.130","书内页":115,"PDF页":130,"讲解":"这段先补一句聚类家族的局限：k 均值的一些不足可由其他算法弥补，例如层次聚类不需要事先决定聚类数目 K，基于降维的谱聚类对数据所在坐标空间不敏感。随后进入监督学习的特征降维。LDA 的定义与要点：它是一种基于监督学习的降维方法，也称 Fisher 判别分析；对一组带标签的高维样本，利用类别信息把它们线性投影到一个低维空间；投影的目标是让同一类别的样本尽可能靠近、不同类别的样本尽可能彼此远离。教材用“患某病与不患病两类人群，用吸烟频率与运动频率描述”的例子说明：LDA 找的是那条能把两类投影分得最开的直线，而不是方差最大的方向。","讲解来源":"self","核对":"locator","原文核对":"通过"}]},"L3":{"img":"bookimg/yl-p130.jpg","focus":"img/kp-综合-LDA.jpg","bbox":[0.1093,0.022,0.9517,0.3868],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-朴素贝叶斯","模块":"综合模块","知识领域":"机器学习","知识单元":"机器学习补充方法","知识点":"朴素贝叶斯","要求":"知道","考纲来源":"官方","题数":3,"题id":["38A-I-04","DIG-53-01","DIG-53-02"],"教材":"yl","教材名":"人工智能引论","章节":"附录 A.5 朴素贝叶斯概率图模型","书内页":324,"PDF页":339,"状态":"完整","L1":{"一句话":"朴素贝叶斯用贝叶斯定理算后验概率：后验 ∝ 先验 × 似然；“朴素”指假设所观测变量之间相互条件独立，从而把联合概率拆成连乘。","关键词":["贝叶斯定理","先验/似然/后验","条件独立","拉普拉斯平滑"],"易错点":"把“朴素”理解成“方法简陋、效果好不了”——它是一个明确的独立性假设，牺牲精度换计算可行性；也容易忽略零概率问题需要平滑处理。"},"L2":{"档":"locator","段":[{"n":1,"文":"化，因此在实际中很少得到应用推广。进阶阅读：RABINERLR,1989.AtutorialonhiddenMarkovmodelsandselectedapplicationsinspeech recognition [J]. Proceedings of the IEEE, 77(2): 257-286.附录A.5朴素贝叶斯概率图模型问题提出：古代“烽火戏诸侯”故事说明了一个人在进行决策时既依赖于当前情势（似然概率），又依赖于已有经验（先验概率），如当前狼烟四起意味着边关战事已起的似然概率很大，但从已有经验又可知周幽王戏弄诸侯的概率很大（即边关有战事的先验概率低），于是狼烟四起意味着战事爆发的概率就不大了。这个故事中的概率推理就是贝叶斯定理，即后验概率等于先验概率与似然概率的乘积。朴素贝叶斯则在计算后验概率中要求所观测变量之间相互条件独立，即互不影响。因此这里的朴素（naive）可理解为观测变量之间没有关联、简简单单、朴素万分。假设样本集为D={（x，y）}=1，样本x∈R的类别标签为y。其中，y的取值范围是{C，C，…，Ck}，即共有K类样本。显然有","页":"书内 p.324 / PDF p.339","书内页":324,"PDF页":339,"讲解":"这段用“烽火戏诸侯”讲清了贝叶斯推理的直觉：人做决策既依赖当前情势（似然概率），又依赖已有经验（先验概率）。周幽王的故事里，狼烟四起意味着边关有战事的似然概率很大，但从经验可知“戏弄诸侯”的先验概率高，于是综合起来“真的打起来了”的后验概率并不大。教材由此给出贝叶斯定理的通俗表达：后验概率等于先验概率与似然概率的乘积（严格说是乘后归一化）。接着说明“朴素”二字的含义：计算后验时要求所观测变量之间相互条件独立、互不影响，所以“朴素”可理解为观测变量之间没有关联、简简单单。","讲解来源":"self","核对":"locator","原文核对":"通过"}]},"L3":{"img":"bookimg/yl-p339.jpg","focus":"img/kp-综合-朴素贝叶斯.jpg","bbox":[0.1116,0.4788,0.8907,0.8656],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-强化学习定义及原理","模块":"综合模块","知识领域":"机器学习","知识单元":"强化学习基本概念","知识点":"强化学习定义及原理","要求":"掌握","考纲来源":"官方","题数":10,"题id":["38A-C-03","38A-E-05","TB-YL-HW-34","TB-YL-HW-36","TB-YL-HW-37","TB-YL-HW-54","DIG-54-01","DIG-54-02","DIG-54-03","DIG-54-04"],"教材":"yl","教材名":"人工智能引论","章节":"6.1 强化学习问题定义","书内页":183,"PDF页":198,"状态":"完整","L1":{"一句话":"强化学习让智能体在与环境交互中学习：动作改变环境、环境反馈状态与奖励，智能体据收益更新策略，逐步学会在什么状态下做什么动作。","关键词":["智能体—环境","状态/动作/奖励","策略更新","试错"],"易错点":"把强化学习当成“有标签的监督学习”——它没有标准答案，只有延迟的奖励信号；也容易忽略“探索与利用”的平衡问题。"},"L2":{"档":"locator","段":[{"n":1,"文":"定位说明：教材 §6.1「强化学习问题定义」讲智能体与环境的交互、奖励、策略与价值，对应考纲「强化学习定义及原理」；节首 p.183 为强化学习基本概念段。\n6.1强化学习问题定义6.1强化学习问题定义强化学习基本概念6.1.1强化学习基本概念人类在日常生活中通过对环境进行探索和与环境进行交互而不断学习。例如，婴幼儿在学习走路时，在跟跟跑跑向前走一步的过程中撞到障碍物后，会因感受到疼痛而哇哇大哭。通过这一次与环境交互的经验，婴幼儿以后走路时就会避免向有障碍物的方向前进。如果将这个过程抽象化，与环境交互而不断学习的过程可如下描述：婴幼儿通过动作（向前走一步）对环境产生影响；环境向其反馈状态的变化（撞到障碍物）；婴幼儿评估当前动作得到的收益（感受到疼痛）；婴幼儿会更新在前方有障碍物这个状态下所做出动作的过往策略（避免向有障碍物的方向前进而发生碰撞）。强化学习模仿了上述学习过程。作为了解强化学习的第一步，先介绍上述学习过程中要使用的若干概念。智能体（agent）：智能体是强化学习算法的主体，它能够根据经验做出主观判断并执行动作，是整个智能系统的核心。","页":"书内 p.183 / PDF p.198","书内页":183,"PDF页":198,"讲解":"这段用婴幼儿学走路把强化学习讲成四步循环，非常好记：第一，通过动作（向前走一步）对环境产生影响；第二，环境反馈状态的变化（撞到障碍物）；第三，智能体评估当前动作得到的收益（感受到疼痛）；第四，智能体更新“在前方有障碍物这个状态下”的过往策略（以后避免朝那个方向走）。教材明确说强化学习模仿了上述学习过程，随后才开始介绍其中用到的概念。理解要点：与监督学习最大的差别是“没有告诉正确答案”，只有环境给的奖励或惩罚，而且奖励往往是延迟的，所以必须靠反复试错来估计“某个状态下做某个动作好不好”。","讲解来源":"self","核对":"locator","原文核对":"部分相符"}]},"L3":{"img":"bookimg/yl-p198.jpg","focus":"img/kp-综合-强化学习定义及原理.jpg","bbox":[0.1036,0.0228,0.9448,0.1612],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-价值函数与-Q-学习","模块":"综合模块","知识领域":"机器学习","知识单元":"强化学习基本概念","知识点":"价值函数与 Q 学习","要求":"理解","考纲来源":"官方","题数":8,"题id":["TB-YL-HW-35","TB-YL-HW-38","TB-YL-HW-39","RAW-YL-6-07","RAW-YL-6-08","RAW-YL-6-09","RAW-YL-6-10","RAW-YL-6-11"],"教材":"yl","教材名":"人工智能引论","章节":"6.2 基于价值的强化学习","书内页":192,"PDF页":207,"状态":"完整","L1":{"一句话":"价值函数衡量“在某个状态下能拿到的长期回报期望”；策略评估算 V、策略优化改 π，两者交替进行即通用策略迭代，Q 学习是其中的代表方法。","关键词":["价值函数 V","策略评估/策略优化","通用策略迭代 GPI","Q 学习"],"易错点":"把 V(s) 与 Q(s,a) 混为一谈（V 只看状态，Q 看状态—动作对）；也容易把“策略迭代”当成一次性过程——它是评估与优化交替收敛的循环。"},"L2":{"档":"locator","段":[{"n":1,"文":"6.2基于价值的强化学习策略优化：根据V优化π价值函数策略函数最优策略π*：对任意s∈S，计算每个状态每个状态所采取使得V（s）值最大可得到的反馈期望的行动策略评估：根据π计算Vπ图6.7基于通用策略选代学习最优策略的模式improvement），策略评估和策略优化交替进行的强化学习求解方法叫作通用策略选代(generalized policy iteration,GPI)。几乎所有的强化学习方法都可以用通用策略迭代来解释。本节将从通用策略迭代的角度介绍基于价值的强化学习方法。注意，本节中讨论的是一种简单情况，即假设策略是确定的。6.2.2策略优化定理本小节介绍通用策略迭代中的策略优化步骤。在讨论如何优化策略之前，首先需要明确什么是“更好”的策略。分别给出","页":"书内 p.192 / PDF p.207","书内页":192,"PDF页":207,"讲解":"这段是价值型强化学习的框架图说明。核心循环只有两步：策略评估——根据当前策略 π 计算价值函数 Vπ；策略优化（policy improvement）——根据 V 优化策略，对任意状态 s 都选使 V(s) 最大的动作。两步交替进行，这种方法叫通用策略迭代（GPI），教材强调几乎所有的强化学习方法都可以用通用策略迭代来解释。理解要点：价值函数是“评价器”，策略是“行动规则”，先用评价器改规则，再用新规则重算评价，如此往复。教材还特别说明本节讨论的是一种简单情况——假设策略是确定的，这为后面讲 Q 学习与探索留出接口。","讲解来源":"self","核对":"locator","原文核对":"无法比对"}]},"L3":{"img":"bookimg/yl-p207.jpg","页来源":"pdf-render","核对":"verified"}},{"id":"kp-综合-反向传播","模块":"综合模块","知识领域":"深度学习","知识单元":"神经网络补充概念","知识点":"反向传播","要求":"掌握","考纲来源":"官方","题数":11,"题id":["38A-F-01","TB-DX4-HW-41","TB-YL-EX-13","TB-YL-HW-28","TB-YL-HW-78","SEC2-CH6-11","DIG-56-01","DIG-56-02","DIG-56-03","DIG-56-04","DIG-56-05"],"教材":"yl","教材名":"人工智能引论","章节":"5.3 神经网络参数优化","书内页":147,"PDF页":162,"状态":"完整","L1":{"一句话":"反向传播把损失函数算出的误差从输出端由后向前逐层传回，配合梯度下降更新参数；迭代到误差足够小或达到轮次，参数即优化完成。","关键词":["误差回传","链式法则","梯度下降","迭代收敛"],"易错点":"把反向传播说成“一种网络结构”（它是一种求梯度的方法）；也容易与前向传播混淆——前向算输出，反向算梯度。"},"L2":{"档":"locator","段":[{"n":1,"文":"优化是一个监督学习的过程。给定n个标注样本数据（x，y），这里x是输入数据，y是x的类别等标注信息。假设输入数据x经过神经网络处理后所得输出预测值为y，则可通过损失函数来计算模型预测值与真实值y之间的误差或损失，利用其来优化模型参数，以便让神经网络按照x的真实信息y输出，即让神经网络对数据进行拟合。具体而言，模型会利用反向传播算法将损失函数计算所得误差从输出端出发，由后向前传递给神经网络中的每个单元，然后通过梯度下降算法对神经网络中的参数进行更新。随着迭代的进行，模型预测所得与真实值y之间的误差逐步缩小，模型预测准确率得以提升，预测的能力得以增强，当选代达到一定轮次或准确率达到一定水平时，则可认为模型参数已被优化完毕。5.3.1损失函数损失函数（lossfunction）又称为代价函数（costfunction），用来计算模型预测值与真实值之间的误差。损失函数是神经网络设计中的一个重要组成部分。通过定义与任务相关的良好损失函数，在训练过程中可根据损失函数来计算神经网络的误差大小，进而优化神经网络参数。下面介绍两种最常用的损失函数：均方误差损失函数和交叉熵","页":"书内 p.147 / PDF p.162","书内页":147,"PDF页":162,"讲解":"这段把训练闭环讲完整。前提：优化是一个监督学习过程，给定 n 个标注样本 (x, y)，x 是输入、y 是类别等标注；输入经网络得到预测值，用损失函数计算预测与真实的误差。核心机制：利用反向传播算法把损失函数计算出的误差从输出端出发、由后向前传递给神经网络中的每个单元，再用梯度下降算法更新参数。效果：随着迭代进行，预测与真值的误差逐步缩小，准确率提升；当迭代达到一定轮次或准确率达到一定水平，就认为参数优化完毕。理解要点：反向传播解决的是“每个参数该往哪改、改多少”，靠的是链式法则逐层求偏导。","讲解来源":"self","核对":"locator","原文核对":"通过"}]},"L3":{"img":"bookimg/yl-p162.jpg","focus":"img/kp-综合-反向传播.jpg","bbox":[0.1185,0.0236,0.9597,0.1621],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-梯度下降法","模块":"综合模块","知识领域":"深度学习","知识单元":"神经网络补充概念","知识点":"梯度下降法","要求":"掌握","考纲来源":"官方","题数":10,"题id":["38A-A-13","38A-F-10","TB-YL-HW-29","SEC2-PR6-02","DIG-57-01","DIG-57-02","DIG-57-03","DIG-57-04","DIG-57-05","DIG-57-06"],"教材":"yl","教材名":"人工智能引论","章节":"5.3 神经网络参数优化","书内页":147,"PDF页":162,"状态":"完整","L1":{"一句话":"梯度下降沿损失函数梯度的反方向逐步调整参数，因为负梯度是损失下降最快的方向；步长由学习率控制，迭代到损失最小即得最优参数。","关键词":["负梯度方向","学习率","迭代","局部/全局最优"],"易错点":"把“梯度方向”当成下降方向（梯度指上升最快，下降要走反方向）；也容易忽略学习率的影响——太大震荡不收敛，太小收敛极慢。"},"L2":{"档":"locator","段":[{"n":1,"文":"5.3神经网络参数优化5.3.2梯度下降梯度下降（gradientdescent）算法是机器学习中对模型参数进行优化时所采用的常用方法。为了让模型预测结果与真实结果之间的损失误差最小，利用梯度下降法来逐步选代优化模型参数。当损失误差最小时，此时学习得到的模型参数即为模型的最优参数。下面说明损失函数梯度的反方向是损失误差下降最快的方向。假设损失函数f（x）是连续可微的多元变量函数，其泰勒展开如下：f（x+△x)=f（x)+f（x)△x+-f\"（x)（△x）²+···+-f（m）（x)（△x)n!f（x+△x)-f（x)（Vf（x)）△x假设参数变量当前取值为x，其对应的损失误差数值为f（x）。在不断促使损失误差减少的下一步选代时，x取值变化为x+△x，则损失误差数值相应地变为f（x+△x)。由于f（x）是损失函数，因此在迭代中希望f（x+△x）取值小于f（x)，即损失误差随着模型参数被优化而逐渐减少，使得f（x+△x）<f（x）","页":"书内 p.147 / PDF p.162","书内页":147,"PDF页":162,"讲解":"这段给梯度下降下定义并给直觉依据。定义：梯度下降是机器学习中对模型参数进行优化时采用的常用方法，为了让预测结果与真实结果之间的损失误差最小，用梯度下降逐步迭代优化参数；当损失误差最小时，学到的参数就是最优参数。随后用泰勒展开论证：设损失函数 f(x) 连续可微，当前参数取 x 时损失为 f(x)，下一步迭代变为 x+Δx，损失变为 f(x+Δx)；因为希望损失变小，就要让 f(x+Δx) < f(x)，由此可推出 Δx 应取负梯度方向。一句话记忆：梯度的反方向是损失误差下降最快的方向，所以参数沿它走。","讲解来源":"self","核对":"locator","原文核对":"对不上"}]},"L3":{"img":"bookimg/yl-p162.jpg","focus":"img/kp-综合-梯度下降法.jpg","bbox":[0.1185,0.0236,0.9597,0.1621],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-CNN-特点及经典模型-LeNet-ResNet","模块":"综合模块","知识领域":"深度学习","知识单元":"神经网络原理与实践","知识点":"CNN 特点及经典模型（LeNet、ResNet）","要求":"掌握","考纲来源":"官方","题数":21,"题id":["38A-A-15","38A-D-07","38A-E-10","38A-I-03","TB-DX4-HW-198","TB-DX4-HW-199","TB-DX4-HW-202","TB-DX4-HW-203","TB-DX4-HW-204","TB-DX4-HW-205","TB-DX4-HW-206","TB-DX4-HW-214","TB-DX4-HW-219","TB-DX4-HW-220","TB-DX4-HW-221","TB-DX4-HW-40","SEC2-CH6-17","SEC2-CH6-18","SEC2-CH6-19","SEC2-EX6-03","SEC2-EX6-04"],"教材":"yl","教材名":"人工智能引论","章节":"5.4 卷积神经网络","书内页":154,"PDF页":169,"状态":"完整","L1":{"一句话":"卷积神经网络以卷积操作与池化操作为核心；前身是受神经科学启发的 Neocognitron，LeNet-5 首次确立基本结构，此后复杂模型本质仍是卷积＋池化。","关键词":["卷积核","池化","LeNet-5","平移不变性"],"易错点":"以为现代 CNN 已不用卷积池化——教材明确复杂结构仍以卷积与池化操作为核心；也容易把 LeNet 与 ResNet 的贡献记反（LeNet 定结构，ResNet 用残差解决退化）。"},"L2":{"档":"locator","段":[{"n":1,"文":"。受这一发现启发，1980年，KunihikoFukushima对神经科学所发现的结构进行了计算机模拟，提出通过级联方式（cascade，即逐层滤波）实现一种满足平移不变性的网络Neocognitron，这就是卷积神经网络的前身（Fukushima，1980，1988）。20世纪90年代，LeCun等人设计了一种被称为LeNet-5的卷积神经网络用于手写体识别，初步确立了卷积神经网络的基本结构。如今，虽然针对不同应用场景的卷积神经网络结构已变得愈发复杂，性能也变得更加强劲，但是究其本质，这些复杂网络结构仍是以卷积操作与池化操作为核心构建而成的。本节对卷积神经网络中的卷积操作、池化操作和网络优化的内容做详细介绍。5.4.1卷积计算图像中的像素点具有很强的空间依赖性，卷积（convolution）就是针对像素点的空间依赖性对图像进行处理的一种技术。在图像卷积计算中，需要定义一个卷积核（kernel）。卷积核是一个二维矩阵，矩阵中的数值为对图像中与卷积核同样大小的子块像素点进行卷积计算时所采用的权重。如图5.8所示，给定一个权重为w（1≤i≤9）、大小为3×3的","页":"书内 p.154 / PDF p.169","书内页":154,"PDF页":169,"讲解":"这段讲 CNN 的来历与不变的本质。来历：1980 年 Fukushima 受神经科学发现启发，用级联方式（逐层滤波）实现满足平移不变性的网络 Neocognitron，这是CNN 的前身；20 世纪 90 年代 LeCun 等人设计了 LeNet-5 用于手写体识别，初步确立卷积神经网络的基本结构。本质：如今针对不同场景的网络越来越复杂、性能越来越强，但究其本质，仍以卷积操作与池化操作为核心构建。随后教材转入卷积计算：图像像素有很强的空间依赖性，卷积就是针对这种依赖性处理图像的技术，需要定义一个卷积核——一个二维矩阵。理解要点是“局部连接＋权重共享＋池化降维”带来参数少、平移鲁棒。","讲解来源":"self","核对":"locator","原文核对":"通过"}]},"L3":{"img":"bookimg/yl-p169.jpg","focus":"img/kp-综合-CNN-特点及经典模型-LeNet-ResNet.jpg","bbox":[0.0483,0.0212,0.8907,0.4349],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-RNN-特点及经典模型等-LSTM-GRU","模块":"综合模块","知识领域":"深度学习","知识单元":"神经网络原理与实践","知识点":"RNN 特点及经典模型等（LSTM，GRU）","要求":"掌握","考纲来源":"官方","题数":10,"题id":["38A-E-08","38A-G-05","TB-DX4-HW-212","TB-YL-HW-32","TB-YL-HW-80","DIG-59-01","DIG-59-02","DIG-59-03","DIG-59-04","DIG-59-05"],"教材":"yl","教材名":"人工智能引论","章节":"5.5 循环神经网络","书内页":160,"PDF页":175,"状态":"完整","L1":{"一句话":"RNN 处理序列数据、利用前后依赖得到每个词的隐式编码与句子表示；按输入输出单元数可分为多对多、多对一、一对多三种模式，但长距离依赖记不住，于是有了 LSTM、GRU。","关键词":["序列建模","隐式编码","多对多/多对一/一对多","长距离依赖"],"易错点":"把“多对一”与“一对多”用错场景——多对一用于情感分类，一对多用于图像描述生成；也容易以为 RNN 天然能记住长距离信息。"},"L2":{"档":"locator","段":[{"n":1,"文":"被后向传递，因此将最后一个单词的输出作为整个句子的向量编码表示；②将每个单词的隐式编码进行加权平均，将加权平均结果作为句子的向量编码表示。这样，一旦得到句子的向量编码表示，就可以利用某个分类器对句子的类别进行判断。互，，“，，《，中间存在前后依赖，这种依赖会被有效利用起来，得到各单词的隐式编码及句子的向量表达。隐式编码RNNRNNRNNRNNRNN入图5.16循环神经网络的应用示例在循环神经网络中，根据输入序列数据与输出序列数据中所包含“单元”的多寡，循环神经网络可以实现“多对多”（即输入和输出序列数据中包含多个单元，常用于机器翻译）、“多对一”（即输人序列数据包含多个单元，输出序列数据只包含一个单元，常用于文本的情感分类）和“一对多”（即输人序列数据包含一个单元，输出序列数据包含多个单元，常用于图像描述生成）三种模式，如图5.17所示。循环神经网络虽然具有一定的记忆能力，但当彼此相关信息在序列中相距较远时，循环神经网络无法捕捉到数据之中的时序依赖关系。除此之外，当输人序列过长时，循环神经网络也容易出现梯度消失（gradientvanishing）或者","页":"书内 p.160 / PDF p.175","书内页":160,"PDF页":175,"讲解":"这段讲 RNN 怎么表示一个句子以及它的三种工作模式。句子表示有两条路：把最后一个单词的输出作为整个句子的向量编码；或把每个单词的隐式编码加权平均作为句子表示——得到表示后，就能用分类器判断句子类别。因为句子中词与词之间存在前后依赖，RNN 会把这种依赖有效利用起来，得到各词的隐式编码与句子向量。按输入、输出序列中“单元”的多少分三种模式：多对多（输入输出都是多个单元，常用于机器翻译）、多对一（输入多个、输出一个，常用于文本情感分类）、一对多（输入一个、输出多个，常用于图像描述生成）。最后指出局限：相关信息相距较远时 RNN 捕捉不到，这正是 LSTM、GRU 要解决的问题。","讲解来源":"self","核对":"locator","原文核对":"对不上"}]},"L3":{"img":"bookimg/yl-p175.jpg","focus":"img/kp-综合-RNN-特点及经典模型等-LSTM-GRU.jpg","bbox":[0.1151,0.5782,0.893,0.8388],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-Transformer","模块":"综合模块","知识领域":"深度学习","知识单元":"神经网络原理与实践","知识点":"Transformer","要求":"理解","考纲来源":"官方","题数":6,"题id":["TB-NOTE-06","DIG-60-01","DIG-60-02","DIG-60-03","DIG-60-04","DIG-60-05"],"教材":"yl","教材名":"人工智能引论","章节":"5.6 注意力机制","书内页":168,"PDF页":183,"状态":"完整","L1":{"一句话":"Transformer 用「自注意力」算出句子里每个词跟其他所有词的关联强度，再按关联强度加权汇总每个词的含义；因为它一次能并行看整句话，取代了 RNN 一个词一个词往下递的老路子。","易错":["把 softmax 放在点积之前。顺序是<b>先点积得关联度，再 softmax 归一化</b>，反过来算出来不是注意力权重。","以为每个词有自己专属的 W<sup>Q</sup>/W<sup>K</sup>/W<sup>V</sup>。教材明确：<b>所有词共用同一组矩阵</b>。","把「注意力」与「自注意力」混为一谈。自注意力是同一句话内部词与词算关联；编码器—解码器之间的注意力是两句话之间算关联。","认为 Transformer 天生知道词序。它不知道，位置编码是外挂的必需品。"],"对比":[{"维度":"计算方式","Transformer（自注意力）":"一次算全句两两关联，可并行","RNN / LSTM":"按时间步递推，必须串行"},{"维度":"长距离依赖","Transformer（自注意力）":"任意两词距离恒为 1 步","RNN / LSTM":"需逐级传递，长依赖易衰减"},{"维度":"参数共享","Transformer（自注意力）":"所有词共用 W<sup>Q</sup>/W<sup>K</sup>/W<sup>V</sup>","RNN / LSTM":"各时间步共享同一组循环权重"},{"维度":"位置信息","Transformer（自注意力）":"本身无顺序感，须额外加位置编码","RNN / LSTM":"顺序天然由时间步体现"}]},"L2":{"档":"general","段":[{"n":1,"文":"在自然语言中，注意力可理解为句子级或篇章级中单词和单词之间因为上下文而共同出现的概率；在机器翻译中，注意力可理解为输入源语言单词和输出目标语言单词之间的关联。谷歌公司的研究人员于 2017 年提出了 Transformer 模型，引入「自注意力」（self-attention）来计算自然语言句子中单词和单词之间的概率关联。","页":"《人工智能引论》5.6 节，书内 p.168","书内页":168,"PDF页":183,"讲解":"这段先给“注意力”在两种场景下的含义：自然语言里，它是句子级或篇章级中单词与单词因上下文而共同出现的概率；机器翻译里，它是输入源语言单词与输出目标语言单词之间的关联。然后给出 Transformer 的出处与核心手段：2017 年谷歌研究人员提出，引入自注意力（self-attention）来计算句子中单词与单词之间的概率关联。理解要点是把“注意力”当成一种加权汇总机制——不是每个词独立编码，而是让每个词按与其他词的相关程度去“看”整句话。","讲解来源":"self","核对":"pending","原文核对":"通过"},{"n":2,"文":"查询向量、键向量和值向量可从搜索引擎角度来理解：查询向量为搜索单词，键向量为被搜索物品的描述信息（如标题等），值向量为被搜索物品的语义内容。……某个单词的自注意力关联可并行计算，而不像循环神经网络那样，需要通过自回归的方式一个单词接着一个单词处理。","页":"《人工智能引论》5.6 节，书内 p.170","书内页":168,"PDF页":183,"讲解":"这段用搜索引擎类比解释三个向量，是理解自注意力的关键：查询向量像用户输入的搜索词，键向量像被搜索物品的描述信息（如标题），值向量像被搜索物品的语义内容。于是自注意力的计算逻辑可以这样理解——先拿查询与各键算匹配度，归一化得到关联度，再按关联度对各值向量加权求和，得到当前词在当前语境下的表示。教材还强调多头注意力（multi-headed attention）可以从更多角度挖掘词与词之间的概率关联，以及自注意力可并行计算，不像 RNN 必须自回归地一个词接一个词处理。","讲解来源":"self","核对":"pending","原文核对":"对不上"}]},"L3":{"img":"bookimg/yl-p183.jpg","focus":"img/kp-综合-Transformer.jpg","bbox":[0.1208,0.0757,0.901,0.4862],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-扩散模型基础","模块":"综合模块","知识领域":"深度学习","知识单元":"数据增强技术","知识点":"扩散模型基础","要求":"知道","考纲来源":"官方","题数":3,"题id":["38A-F-02","DIG-61-01","DIG-61-02"],"教材":"yl","教材名":"人工智能引论","章节":"附录 A.6 生成式对抗学习（生成式模型）","书内页":326,"PDF页":341,"状态":"完整","L1":{"一句话":"扩散模型是一类生成模型，核心是“加噪—去噪”的可逆过程：前向在 T 步里逐步给真实数据加高斯噪声直到近似纯噪声，反向训练网络从噪声逐步还原数据。","关键词":["加噪—去噪","T 步","噪声预测","DDPM"],"易错点":"以为它一次生成（实际是多步迭代去噪，所以采样慢）；也容易把它与 GAN 的训练方式混为一谈——GAN 靠对抗，扩散靠拟合噪声。"},"L2":{"档":"locator","段":[{"n":1,"文":"教材原句（YL p.326）：生成对抗网络是一种生成模型，可视为两个神经网络相互竞争的零和博弈；生成器接收噪声并输出合成数据。\n扩散模型是一类生成模型，核心是「加噪—去噪」的可逆过程：前向过程在 T 步中逐步向真实数据加入高斯噪声，直至变成近似纯噪声；反向过程训练一个神经网络（通常预测每一步加入的噪声）从噪声出发逐步去噪，恢复出数据样本。DDPM（Ho 等，2020）用简化的噪声预测损失实现了高质量图像生成；Stable Diffusion（2022）进一步在潜在空间做扩散，显著降低计算成本。与 GAN 相比，扩散模型训练更稳定、样本多样性好，但采样需要多步迭代、速度较慢。\n来源：Ho, Jain, Abbeel, Denoising Diffusion Probabilistic Models, NeurIPS 2020（论文出处）；扩散模型技术解析（51CTO、小时百科 DDPM 条目）。","页":"书内 p.326 / PDF p.341","书内页":326,"PDF页":341,"讲解":"这段先说教材原句作为落点：生成对抗网络是一种生成模型，可视为两个神经网络相互竞争的零和博弈，生成器接收噪声并输出合成数据。然后转入扩散模型（属通用表述）：它是一类生成模型，核心是“加噪—去噪”的可逆过程——前向过程在 T 步中逐步向真实数据加入高斯噪声，直至变成近似纯噪声；反向过程训练一个神经网络（通常预测每一步加入的噪声）从噪声出发逐步去噪，恢复出数据样本。教材外补充的两个代表：DDPM 用简化的噪声预测损失实现高质量图像生成；Stable Diffusion 在潜在空间做扩散，显著降低计算成本。与 GAN 相比，扩散训练更稳定、多样性好，但采样要多步迭代、速度慢。","讲解来源":"self","核对":"locator","原文核对":"对不上"}]},"L3":{"img":"bookimg/yl-p341.jpg","页来源":"scan","核对":"pending"}},{"id":"kp-综合-生成对抗网络-GAN-基础","模块":"综合模块","知识领域":"深度学习","知识单元":"数据增强技术","知识点":"生成对抗网络（GAN）基础","要求":"知道","考纲来源":"官方","题数":4,"题id":["38A-A-18","38A-G-09","TB-YL-HW-33","RAW-YL-06"],"教材":"yl","教材名":"人工智能引论","章节":"附录 A 生成对抗网络","书内页":326,"PDF页":341,"状态":"完整","L1":{"一句话":"GAN 由生成器与判别器组成，二者对抗训练：生成器用噪声造合成数据力求以假乱真，判别器输出 0–1 判断真假，最终逼近纳什均衡。","关键词":["生成器/判别器","零和博弈","2014 Goodfellow","纳什均衡"],"易错点":"以为判别器输出越接近 1 越好——均衡时判别器对真假难分，输出应接近 0.5；也容易把“纳什均衡”说成“损失降到 0”。"},"L2":{"档":"locator","段":[{"n":1,"文":"326附录A进阶知识点为真实样本或生成网络的输出，其目的是将生成网络的输出从真实样本中尽可能分辨出来，而生成网络则要尽可能地欺骗判别网络。两个网络相互对抗，不断调整参数，最终目的是使判别网络无法判断生成网络的输出结果是否真实。生成对抗网络是由伊恩·古德费洛（IanGoodfellow）等人于2014年提出的一种生成模型（Goodfellowetal.，2014），该模型可视为两个神经网络相互竞争的零和博弈（zero-sumgame），“以子之矛，陷子之盾”，最终达到纳什均衡。（discriminator，简称D）组成。其核心是通过生成器和判别器两个神经网络之间的竞争对抗，不断提升彼此的水平，以使得生成器所生成的数据（人为伪造数据）与真实数据相似，判别器无法区分真实数据和生成数据。生成器接收一个简单的噪声并输出一份合成数据，判别器对所接收数据的真实性进行评价，输出一个0～1的数值。在模型初始阶段，生成器所产生的合成数据与真实数据之间差异相当明显，因此判别器可以很容易地","页":"书内 p.326 / PDF p.341","书内页":326,"PDF页":341,"讲解":"这段讲 GAN 的组成与目标。组成：由生成器（G）和判别器（D）两个神经网络构成，判别器接收数据并判断它是真实样本还是生成网络的输出，目的是把生成结果从真实样本中分辨出来；生成器则要尽可能欺骗判别网络。机制：两个网络相互对抗、不断调整参数，最终目的是使判别网络无法判断生成网络的输出是否真实。出处与定性：由伊恩·古德费洛等人于 2014 年提出，是一种生成模型，可视为两个神经网络相互竞争的零和博弈，用“以子之矛，陷子之盾”作比，最终达到纳什均衡。工程细节：生成器接收一个简单噪声并输出合成数据；判别器输出 0–1 的数值评价真实性。","讲解来源":"self","核对":"locator","原文核对":"通过"}]},"L3":{"img":"bookimg/yl-p341.jpg","focus":"img/kp-综合-生成对抗网络-GAN-基础.jpg","bbox":[0.1047,0.1531,0.8826,0.5399],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-多模态基础-感知-数据","模块":"综合模块","知识领域":"深度学习","知识单元":"多模态技术","知识点":"多模态基础（感知、数据）","要求":"知道","考纲来源":"官方","题数":3,"题id":["38A-F-03","DIG-63-01","DIG-63-02"],"教材":"yl","教材名":"人工智能引论","章节":"10.6 跨媒体智能","书内页":312,"PDF页":327,"状态":"完整","L1":{"一句话":"多模态（跨媒体）学习的目标是建立不同模态数据之间的关联：早期靠手工特征与典型相关分析、主题模型，深度学习后转向端到端的特征学习与关联建模。","关键词":["跨媒体","模态间关联","DeepCCA","端到端特征学习"],"易错点":"把多模态理解成“把多个文件放在一起”——关键是建立模态之间的语义对应；也容易以为多模态只用一种模型，实际常需分别编码再加融合。"},"L2":{"档":"locator","段":[{"n":1,"文":"袋来学习不同模态数据之间的关联，或通过隐狄利克雷分布来刻画不同媒体数据之间在主题这一隐性结构层面的关联。随着深度学习这一“端到端特征学习”在自然语言、视觉等领域得到成功应用，深度学习也被用于学习不同类型媒体数据之间的关联，出现了DeepCCA（canonicalcorrelation analysis，典型相关分析）、多模态玻尔兹曼机、多模态自编码机等方法，这些方法较好弥补了早期基于手工构造特征进行跨媒体关联学习的不足。不同于传统的逻辑推理，综合推理是一种生成式推理，其借鉴了人类认知方式中","页":"书内 p.312 / PDF p.327","书内页":312,"PDF页":327,"讲解":"这段讲跨媒体智能的技术演进。先给早期做法：通过（某种模型）学习不同模态数据之间的关联，或用隐狄利克雷分布刻画不同媒体数据在“主题”这一隐性结构层面的关联——也就是说，早期是靠主题、典型相关这类统计结构去对齐不同模态。随后讲转折：随着深度学习这种“端到端特征学习”在自然语言、视觉等领域成功应用，它也被用来学习不同类型媒体数据之间的关联，出现了 DeepCCA（典型相关分析）、多模态玻尔兹曼机、多模态自编码机等方法，较好弥补了早期基于手工构造特征做跨媒体关联学习的不足。理解要点：多模态的核心难题始终是“不同模态的表征怎么对齐”。","讲解来源":"self","核对":"locator","原文核对":"通过"}]},"L3":{"img":"bookimg/yl-p327.jpg","focus":"img/kp-综合-多模态基础-感知-数据.jpg","bbox":[0.1139,0.0741,0.8941,0.4568],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-分布式机器学习基础","模块":"综合模块","知识领域":"人工智能前沿技术","知识单元":"分布式机器学习与联邦学习","知识点":"分布式机器学习基础","要求":"知道","考纲来源":"官方","题数":5,"题id":["TB-YL-HW-43","TB-YL-HW-44","TB-YL-HW-45","RAW-YL-9-07","RAW-YL-9-08"],"教材":"yl","教材名":"人工智能引论","章节":"9.3.2 分布式神经网络训练算法","书内页":277,"PDF页":292,"状态":"完整","L1":{"一句话":"分布式训练把训练任务分布到多个计算设备上，用并行计算与通信加速；常见策略有数据并行、张量并行和流水线并行。","关键词":["数据并行","张量并行","流水线并行","通信开销"],"易错点":"把三者混为一谈：数据并行切数据、张量并行切单层内的算子、流水线并行切层；也容易忽略瓶颈常在通信而不在算力。"},"L2":{"档":"locator","段":[{"n":1,"文":"分布式神经网络训练算法和系统应运而生，它们通过将训练任务分布到多个计算设备上，利用并行计算和通信来加速训练过程。数据并行、张量并行和流水线并行是常见的分布式训练算法策略。","页":"书内 p.277 / PDF p.292","书内页":277,"PDF页":292,"讲解":"这段只有两句话，但把分布式训练的存在理由与三条路线说清了。存在理由：模型与数据规模增长后，单设备算不动也存不下，于是分布式神经网络训练算法和系统应运而生——它们把训练任务分布到多个计算设备上，利用并行计算和通信来加速训练过程。三条常见策略要能各自解释：数据并行是把不同批数据分到不同设备、各自算梯度再同步；张量并行是把同一层内的大矩阵运算拆到多设备；流水线并行是把不同层段分到不同设备、像流水线一样前后衔接。答题时补一句“并行度越高，通信开销越大”，这就是工程上的核心权衡。","讲解来源":"self","核对":"locator","原文核对":"通过"}]},"L3":{"img":"bookimg/yl-p292.jpg","focus":"img/kp-综合-分布式机器学习基础.jpg","bbox":[0.107,0.3844,0.8884,0.7435],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-联邦学习基础","模块":"综合模块","知识领域":"人工智能前沿技术","知识单元":"分布式机器学习与联邦学习","知识点":"联邦学习基础","要求":"知道","考纲来源":"官方","题数":3,"题id":["TB-NOTE-07","DIG-65-01","DIG-65-02"],"教材":"yl","教材名":"人工智能引论","章节":"第9章 · 9.3.2 分布式神经网络训练算法与系统","书内页":279,"PDF页":294,"状态":"完整","L1":{"一句话":"联邦学习＝「数据不出门，只传模型」。各家在本地用自己的数据训练，只把参数（或梯度）交给中心服务器加权平均，谁的原始数据都没离开自己的服务器。","易错":["以为联邦学习不传输任何东西。它不传<b>数据</b>，但必须传<b>模型参数或梯度</b>。","把「多台机器一起训练」直接等同于联邦学习。分布式训练同样多机，但数据可以集中。","以为联邦学习绝对安全。梯度也可能泄露信息，仍需差分隐私、安全聚合等加固。","把 FedAvg 说成简单算术平均。它是<b>按各方样本量加权</b>的平均。"],"对比":[{"维度":"数据位置","联邦学习":"数据留在本地，只传参数/梯度","集中式训练":"原始数据全部汇总到中心"},{"维度":"典型目的","联邦学习":"隐私合规 + 跨机构协作","集中式训练":"模型效果最大化"},{"维度":"数据分布","联邦学习":"各方通常非独立同分布（Non-IID）","集中式训练":"可做到全局均匀采样"},{"维度":"主要瓶颈","联邦学习":"通信轮次、异构数据、恶意参与方","集中式训练":"算力与存储"}]},"L2":{"档":"general","段":[{"n":1,"文":"《人工智能引论》9.3.2 节讲分布式神经网络训练时涉及参数同步，但<b>未以「联邦学习」为节展开</b>。考纲对本条要求为「知道」，故按学科通用定义补足，教材定位仅到 9.3.2 分布式训练部分（书内 p.279）。","页":"教材仅提及，以下流程为通用表述","书内页":279,"PDF页":294,"讲解":"这段首先是定位说明：教材 9.3.2 节讲分布式神经网络训练时涉及参数同步，但没有以“联邦学习”为节展开；考纲对本条只要求“知道”，因此按学科通用定义补足，教材定位仅到分布式训练部分。通用要点：联邦学习解决的是“数据不能集中”场景下的联合建模——各参与方在本地用自己的数据训练，只把模型参数或梯度上传，由中心服务器聚合（如按样本量加权平均的 FedAvg）后再下发，原始数据不出本地。它与普通分布式训练的关键差别不在“多机”，而在“数据不出域”。局限也要知道：梯度仍可能泄露信息，需配合差分隐私、安全聚合等手段加固。","讲解来源":"self","核对":"pending","原文核对":"对不上"}]},"L3":{"img":"bookimg/yl-p294.jpg","页来源":"scan","核对":"pending"}},{"id":"kp-综合-基本三要素-数据-算法-算力","模块":"综合模块","知识领域":"人工智能前沿技术","知识单元":"生成式大模型技术","知识点":"基本三要素（数据、算法、算力）","要求":"知道","考纲来源":"官方","题数":4,"题id":["38A-E-01","TB-DX4-HW-35","DIG-66-01","DIG-66-02"],"教材":"yl","教材名":"人工智能引论","章节":"1.6 小结（三要素提及）","书内页":16,"PDF页":31,"状态":"完整","L1":{"一句话":"人工智能的三要素是数据、算法、算力：教材用“数据是燃料、模型是引擎、算力是加速器”概括三者的分工。","关键词":["数据是燃料","模型是引擎","算力是加速器"],"易错点":"把“模型”与“算法”当成两件事各占一要素——教材的比喻里引擎就是模型/算法这一侧；也容易只答两要素，漏掉算力。"},"L2":{"档":"locator","段":[{"n":1,"文":"当前，以“数据是燃料、模型是引擎、算力是加速器”为驱动的人工智能在自然语言、视觉、语音和动画等特定领域取得了显著进展。","页":"书内 p.16 / PDF p.31","书内页":16,"PDF页":31,"讲解":"这句话是教材小结里的一个比喻，价值在于把三要素的分工一次说清：数据是燃料——没有大规模高质量数据，模型学不到东西；模型（算法）是引擎——决定怎么从数据里提取规律；算力是加速器——决定训练能不能在可接受的时间内完成。理解要点是三者缺一不可且相互制约：数据不够则模型上限低，算法不佳则数据白费，算力不足则大模型根本训不出来。答题时先给三要素的名字，再补这句比喻，最后举一个反例（如只有算力没有数据，只能空转）即可。","讲解来源":"self","核对":"locator","原文核对":"通过"}]},"L3":{"img":"bookimg/yl-p31.jpg","focus":"img/kp-综合-基本三要素-数据-算法-算力.jpg","bbox":[0.0529,0.0204,0.8907,0.4357],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-预训练概念","模块":"综合模块","知识领域":"人工智能前沿技术","知识单元":"生成式大模型技术","知识点":"预训练概念","要求":"知道","考纲来源":"官方","题数":3,"题id":["38A-A-02","38A-G-03","DIG-67-01"],"教材":"yl","教材名":"人工智能引论","章节":"10.1 语言基础模型（大模型）","书内页":289,"PDF页":304,"状态":"完整","L1":{"一句话":"预训练先在大规模语料上训练一个通用基础模型，再针对下游任务微调参数，这就是“预训练模型＋微调”范式，用来避免每个碎片化任务都从头训练。","关键词":["预训练模型（基础模型）","微调","迁移","BERT/GPT"],"易错点":"把预训练与微调当成两个独立模型（是同一模型的两个阶段）；也容易以为预训练后就无需下游数据——微调仍需要任务数据。"},"L2":{"档":"locator","段":[{"n":1,"文":"分析、句法分析、语义角色标注和实体识别等），通常会为每个任务分别设计一个机器学习模型，并用针对这一任务的数据进行模型训练。这一范式的优点是模型针对性强，可为特定任务量身定制数据和模型。然而，其局限性也较为明显，即需要为每个碎片化任务单独训练模型，导致了不必要的重复劳动和资源浪费。一个自然而然解决上述问题的思路是训练一个预训练模型（即基础模型），然后将预训练模型的能力迁移到众多下游碎片化任务中，这就是“预训练模型+微调”范式。在这个范式中，先基于大规模语料库训练一个预训练模型，然后针对特定的下游任务微调模型参数，提升模型泛化能力，以适应各种自然语言任务，从而减少资源消耗，如BERT和GPT等预训练模型已在各种自然语言任务中取得了显著效果。然而，现有预训练模型正从包含1亿多参数的BERT，跃升到包含千亿级别参数的GPT一3模型，不要说预训练一个全新的语言模型，即使是对现有大模型的微调，也是一个巨大的任务。在此背景下，一种不需要对预训练模型参数进行调整，不需要通过收集下游任务的大量标注数据进行学习的“提示学习（prompt-basedlearning）+预测","页":"书内 p.289 / PDF p.304","书内页":289,"PDF页":304,"讲解":"这段讲“为什么会有预训练”这个动机链。原来的范式是：针对分词、句法分析、语义角色标注、实体识别等任务，各设计一个模型、各用一批任务数据训练。优点是针对性强，缺点是要为每个碎片化任务单独训练，造成重复劳动与资源浪费。于是自然想到：先训练一个预训练模型（即基础模型），再把它的能力迁移到众多下游碎片化任务——这就是“预训练模型＋微调”范式：先用大规模语料训练，再针对下游任务微调参数，提升泛化能力、减少资源消耗；BERT 和 GPT 是代表。随后教材指出新问题：模型从 BERT 的亿级参数跃升到 GPT-3 的千亿级，连微调都成了巨大工程，为后面“不微调”的做法埋下伏笔。","讲解来源":"self","核对":"locator","原文核对":"通过"}]},"L3":{"img":"bookimg/yl-p304.jpg","focus":"img/kp-综合-预训练概念.jpg","bbox":[0.107,0.0252,0.9459,0.1661],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-检索增强生成-RAG-概念","模块":"综合模块","知识领域":"人工智能前沿技术","知识单元":"生成式大模型技术","知识点":"检索增强生成（RAG）概念","要求":"知道","考纲来源":"官方","题数":3,"题id":["TB-NOTE-08","DIG-68-01","DIG-68-02"],"教材":"yl","教材名":"人工智能引论","章节":"第2章 · 2.4 知识图谱推理","书内页":35,"PDF页":50,"状态":"完整","L1":{"一句话":"大模型答题靠记忆，容易一本正经地编。RAG 就是「开卷考」：先从你自己的资料库里检索出相关段落，连同问题一起塞给模型，让它照着材料答。","易错":["把 RAG 当成「训练模型」。它<b>不训练</b>、不改参数，只是给模型喂材料。","顺序记反：必须<b>先检索、后生成</b>；先答再找依据不是 RAG。","以为检索靠关键词匹配。主流做法是<b>向量相似度</b>检索（也常与关键词混合）。","以为 RAG 能解决一切幻觉。检索不到或检索错了，模型照样会编。"],"对比":[{"维度":"知识存放位置","RAG":"外部向量库/文档库，模型参数不变","微调（Fine-tuning）":"写进模型参数"},{"维度":"更新成本","RAG":"改文档、重建索引即可，分钟级","微调（Fine-tuning）":"需重新训练，成本高、周期长"},{"维度":"可溯源性","RAG":"答案可标注来源片段","微调（Fine-tuning）":"无法指出依据来自哪份材料"},{"维度":"擅长的事","RAG":"补充事实性知识与时效信息","微调（Fine-tuning）":"调整风格、格式、任务能力"}]},"L2":{"档":"general","段":[{"n":1,"文":"《人工智能引论》2.4 节讲知识图谱推理时涉及外部知识的引入，但<b>未以「检索增强生成」为节展开</b>。考纲对本条要求为「知道」，故按学科通用定义补足，教材定位仅到 2.4 节知识图谱推理部分（书内 p.35）。","页":"教材仅提及，以下流程为通用表述","书内页":35,"PDF页":50,"讲解":"这段是定位说明，先交代清楚：教材 2.4 节讲知识图谱推理时涉及引入外部知识，但没有以“检索增强生成”为节展开；考纲只要求“知道”，故按学科通用定义补足。通用要点分三步：先把外部资料切块并向量化建库；收到问题后用该问题去检索最相关的若干片段；再把“问题＋检索到的片段”一起交给大模型生成答案。它不训练、不改参数，本质是给模型“开卷”。与微调的区别要能说清：微调是把知识压进参数，RAG 是把知识放在外部、用时再取，因此更新知识只需更新库。局限也如实记：检索不到或检索错，模型照样会编。","讲解来源":"self","核对":"pending","原文核对":"对不上"}]},"L3":{"img":"bookimg/yl-p50.jpg","focus":"img/kp-综合-检索增强生成-RAG-概念.jpg","bbox":[0.1036,0.0236,0.9448,0.2622],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-可信人工智能的可解释性-安全性-公正性-隐私性","模块":"综合模块","知识领域":"人工智能安全与伦理","知识单元":"可信人工智能","知识点":"可信人工智能的可解释性、安全性、公正性、隐私性","要求":"理解","考纲来源":"官方","题数":13,"题id":["38A-G-01","TB-YL-HW-46","TB-YL-HW-47","TB-YL-HW-48","TB-YL-HW-49","RAW-YL-8-02","RAW-YL-8-06","RAW-YL-8-07","RAW-YL-8-08","RAW-YL-8-09","RAW-YL-8-10","DIG-70-03","DIG-70-05"],"教材":"yl","教材名":"人工智能引论","章节":"8.3 人工智能可解释性","书内页":266,"PDF页":281,"状态":"完整","L1":{"一句话":"可信人工智能要求模型可解释、安全、公正、保护隐私；隐私一侧的典型技术是同态加密（密文下计算）与安全多方计算（无可信第三方也能联合计算）。","关键词":["可解释性","同态加密","安全多方计算","黑盒 vs 白盒"],"易错点":"把同态加密与安全多方计算混为一谈（前者是“算在密文上”，后者是“多方各持一部分、谁都不泄露”）；也容易把可解释性理解成“准确率高”。"},"L2":{"档":"locator","段":[{"n":1,"文":"266第8章人工智能伦理与安全同态加密技术允许数据在密文条件下进行安全计算，实现密文状态下对明文的操作，从而保证数据的隐私性。在分布式深度学习领域，同态加密技术经常被用于参数加密。安全多方计算技术是指在无可信第三方的条件下，多方参与者如何安全地计算一个约定函数的问题，其主要目的是在计算过程中保证各方私密输入的独立性，不泄露任何本地数据。如何在数据高速流通的当代社会有效保护用户的私有数据，从而保证个人的合法权益不被侵犯，是人工智能模型部署需要解决的重要问题。8.3人工智能可解释性人工智能可解释性一般而言，可解释人工智能（interpretableAI或者explainableAI）是指智能体如何有效解释自己的行为过程机制和任务结果原因，取得人类用户的信任，以便让人类可以信任模型预测的结果。可解释人工智能与黑盒式（blackbox）人工智能正好相反，后者无法","页":"书内 p.266 / PDF p.281","书内页":266,"PDF页":281,"讲解":"这段从隐私保护技术切入，再转到可解释性。隐私技术两条：同态加密允许数据在密文条件下进行安全计算，实现对明文的操作，从而保证隐私，在分布式深度学习里常用于参数加密；安全多方计算指在无可信第三方条件下，多方如何安全地计算一个约定函数，目的是保证各方私密输入的独立性、不泄露任何本地数据。教材随后点题：在数据高速流通的当代社会，如何有效保护用户私有数据、保证个人合法权益不被侵犯，是模型部署必须解决的问题。最后给可解释性的定义：可解释人工智能指智能体如何有效解释自己的行为过程机制与任务结果原因，以取得用户信任；它与黑盒式人工智能正好相反。","讲解来源":"self","核对":"locator","原文核对":"通过"}]},"L3":{"img":"bookimg/yl-p281.jpg","focus":"img/kp-综合-可信人工智能的可解释性-安全性-公正性-隐私性.jpg","bbox":[0.1116,0.3233,0.8895,0.7353],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-人工智能的伦理和安全挑战","模块":"综合模块","知识领域":"人工智能安全与伦理","知识单元":"人工智能伦理","知识点":"人工智能的伦理和安全挑战","要求":"理解","考纲来源":"官方","题数":7,"题id":["TB-YL-HW-55","TB-NOTE-09","DIG-70-01","DIG-70-02","DIG-70-04","DIG-70-06","DIG-70-07"],"教材":"yl","教材名":"人工智能引论","章节":"第8章 · 8.1.2 科技的双重属性（科林格里奇困境）","书内页":258,"PDF页":273,"状态":"完整","L1":{"一句话":"人工智能既能放大效率，也能放大偏见与伤害；难处在于——技术刚出现时你看不清它的后果，等后果显形了，它已经长进社会结构里，改不动了。这叫科林格里奇困境。","易错":["把科林格里奇困境理解成「技术越新风险越大」。它讲的是<b>认知与行动的时间差</b>，不是风险大小。","把「偏见」归因于算法本身。多数偏见源头在<b>训练数据</b>与目标设定。","以为伦理就是道德说教、与法律无关。教材明确二者互补：自律与他律。","只答「隐私」，漏掉问责、可解释性等其他维度，多选题上丢分。"],"对比":[{"维度":"约束来源","法律（他律）":"外部强制，违者受罚","伦理（自律）":"内部规范，靠共识与声誉"},{"维度":"起作用时点","法律（他律）":"行为发生后追责","伦理（自律）":"设计与研发阶段前置"},{"维度":"教材表述","法律（他律）":"显露的道德","伦理（自律）":"隐藏的法律"}]},"L2":{"档":"general","段":[{"n":1,"文":"人工智能是新一轮科技革命和产业变革的重要驱动力量……体现出其赋能社会的技术属性。同时，人工智能正创造和形成人与机、机与机及人机共融的新的社会形态，因此必须确保把人类价值观、道德观和法律法规贯穿于人工智能的产品和服务，赋予人工智能社会属性。","页":"《人工智能引论》8.1.2 节，书内 p.255","书内页":258,"PDF页":273,"讲解":"这段先讲技术属性：人工智能是新一轮科技革命和产业变革的重要驱动力量，体现出赋能社会的技术属性；同时它正在创造人与机、机与机、人机共融的新社会形态，因此必须把人类价值观、道德观和法律法规贯穿到产品与服务中，赋予它社会属性。理解要点：伦理不是技术之外的附加项，而是技术落地的前提条件——“能不能做”之外还有“该不该做”。","讲解来源":"self","核对":"pending","原文核对":"对不上"},{"n":2,"文":"在社会中，每个人要通过保证「自律」的道德和规范「他律」的法律来约束个人行为，使得社会正常运行。……林肯曾经说过，「法律是显露的道德，道德是隐藏的法律」。","页":"《人工智能引论》第 8 章章首，书内 p.255","书内页":258,"PDF页":273,"讲解":"这段用“自律”与“法律”的对照解释治理结构：社会中每个人要靠保证自律的道德和规范他律的法律来约束行为，社会才能正常运行，并引用林肯的话“法律是显露的道德，道德是隐藏的法律”。放到人工智能上就是两条腿走路——伦理规范属于自律层面，法律法规属于他律层面，二者互补而非替代。答题时把“技术属性＋社会属性”“自律＋他律”两组对照写出来，基本就覆盖了伦理与安全挑战的框架。","讲解来源":"self","核对":"pending","原文核对":"对不上"}]},"L3":{"img":"bookimg/yl-p273.jpg","focus":"img/kp-综合-人工智能的伦理和安全挑战.jpg","bbox":[0.0518,0.0212,0.8953,0.4104],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-特征表示与滤波","模块":"综合模块","知识领域":"计算机视觉","知识单元":"计算机视觉基础","知识点":"特征表示与滤波","要求":"理解","考纲来源":"官方","题数":6,"题id":["TB-NOTE-10","DIG-71-01","DIG-71-02","DIG-71-03","DIG-71-04","DIG-71-05"],"教材":"yl","教材名":"人工智能引论","章节":"第5章 · 5.4 卷积神经网络（卷积滤波）","书内页":156,"PDF页":171,"状态":"完整","L1":{"一句话":"滤波就是拿一个小方框（卷积核）在图像上一格一格滑，每滑一次做一次加权求和；不同的小方框能压噪声、能提边缘。特征表示则是把原始像素换成更能说明「图里有什么」的形式。","易错":["以为卷积核是「固定不变的通用模板」。核里的权重是<b>可学习参数</b>，训练就是在学这些数。","把平滑和锐化记反。平滑＝模糊去噪；锐化＝强化边缘细节。","以为卷积只能提边缘。核不同，功能完全不同，边缘只是其中一类。","把「权重共享」理解成「多个核共用一个权重」。它指的是<b>同一个核</b>在图像各处重复使用。"],"对比":[{"维度":"核内权重特征","平滑（均值/高斯）":"全正、和为 1","锐化":"中心为正、周围为负","边缘检测（Sobel 等）":"一侧正一侧负，和约为 0"},{"维度":"主要作用","平滑（均值/高斯）":"压制噪声，代价是边缘变模糊","锐化":"增强细节对比","边缘检测（Sobel 等）":"突出灰度突变位置"}]},"L2":{"档":"general","段":[{"n":1,"文":"卷积神经网络通过卷积操作提取图像的局部特征。卷积核在输入图像上按一定步长滑动，对覆盖区域内的像素与核内权重逐项相乘后求和，得到一个输出值；不同卷积核对应不同的特征提取功能。","页":"《人工智能引论》5.4 节，书内 p.156（示意表述，公式见原书）","书内页":156,"PDF页":171,"讲解":"这段话是卷积滤波的最小定义：卷积神经网络通过卷积操作提取图像的局部特征；卷积核在输入图像上按一定步长滑动，对覆盖区域内的像素与核内权重逐项相乘后求和，得到一个输出值；不同卷积核对应不同的特征提取功能。理解要点三个：局部性（每次只看核覆盖的一小块）、权重共享（同一个核在整幅图上反复使用）、核的可学习性（权重是训练出来的，不是人写死的模板）。所以“滤波”不是只有固定几种，网络会自己学出该提什么特征。答题时把“滑动—相乘—求和”三步写全。","讲解来源":"self","核对":"pending","原文核对":"对不上"}]},"L3":{"img":"bookimg/yl-p171.jpg","页来源":"scan","核对":"pending"}},{"id":"kp-综合-边缘检测与局部特征描述符","模块":"综合模块","知识领域":"计算机视觉","知识单元":"计算机视觉基础","知识点":"边缘检测与局部特征描述符","要求":"理解","考纲来源":"官方","题数":6,"题id":["TB-NOTE-11","DIG-72-01","DIG-72-02","DIG-72-03","DIG-72-04","DIG-72-05"],"教材":"yl","教材名":"人工智能引论","章节":"第5章 · 5.4 卷积神经网络（卷积局部模式）","书内页":160,"PDF页":175,"状态":"完整","L1":{"一句话":"边缘就是灰度突然变化的地方，用梯度算子把它找出来；局部特征描述符则是把关键点周围的纹理「编码成一串数」，让同一物体在不同角度、尺度下还能被认出来。","易错":["把非极大值抑制的作用说成「去噪」。它做的是<b>细化边缘</b>，去噪是前面的高斯平滑。","认为双阈值的两个阈值作用相同。高阈值定强边缘，低阈值只用于延伸连接。","把 SIFT 与 Sobel 归为一类。前者是特征描述符，后者是边缘检测算子。","以为边缘检测必须用深度学习。经典算子至今仍在用，考试考的是经典方法。"],"对比":[{"维度":"输出形式","边缘检测":"边缘图（每个像素是否属边缘）","局部特征描述符":"关键点位置 + 一组描述向量"},{"维度":"回答的问题","边缘检测":"灰度在哪里突变","局部特征描述符":"这块区域能否与另一图对应"},{"维度":"典型方法","边缘检测":"Sobel、Laplacian、Canny","局部特征描述符":"SIFT、SURF、ORB、HOG"},{"维度":"是否具备不变性","边缘检测":"一般不保证尺度/旋转不变","局部特征描述符":"SIFT 等设计上追求尺度与旋转不变"}]},"L2":{"档":"general","段":[{"n":1,"文":"教材在 5.4 节讲卷积神经网络时提到卷积可提取局部模式，但<b>未以「边缘检测与局部特征描述符」为节展开</b>。考纲对本条要求为「理解」，故按学科通用表述补足。","页":"教材仅提及，以下为通用表述（书内 p.160 附近）","书内页":160,"PDF页":175,"讲解":"这段是定位说明：教材在 5.4 节讲卷积神经网络时提到卷积可提取局部模式，但没有以“边缘检测与局部特征描述符”为节展开；考纲要求“理解”，故按学科通用表述补足。通用要点分两支：边缘检测——边缘是灰度突变处，用梯度算子（如 Sobel）求梯度幅值，再做非极大值抑制细化，最后用双阈值连接强弱边缘（Canny 的流程）；局部特征描述符——在关键点周围统计梯度方向直方图（如 SIFT），得到一个对旋转、尺度变化较稳健的向量，用于匹配与检索。要能区分二者：边缘检测输出“边”，描述符输出“一串数”。","讲解来源":"self","核对":"pending","原文核对":"对不上"}]},"L3":{"img":"bookimg/yl-p175.jpg","focus":"img/kp-综合-边缘检测与局部特征描述符.jpg","bbox":[0.1139,0.3779,0.893,0.7875],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-图像分割与分类","模块":"综合模块","知识领域":"计算机视觉","知识单元":"计算机视觉方法与应用","知识点":"图像分割与分类","要求":"掌握","考纲来源":"官方","题数":10,"题id":["38A-A-16","38A-G-02","TB-YL-EX-15","DIG-73-01","DIG-73-02","DIG-73-03","DIG-73-04","DIG-73-05","DIG-73-06","DIG-73-07"],"教材":"yl","教材名":"人工智能引论","章节":"5.8.2 图像分类与目标定位","书内页":174,"PDF页":189,"状态":"完整","L1":{"一句话":"图像分类与目标定位是机器视觉的核心问题之一：既要把图像分到不同类别，又要对图像中的视觉对象给出位置；分割则进一步要求逐像素划分区域。","关键词":["分类","定位","逐像素分割","核心问题"],"易错点":"把分割与分类混说——分类给整图一个标签，分割给每个像素一个标签；也容易漏掉“定位”而只答分类。"},"L2":{"档":"locator","段":[{"n":1,"文":"图像分类与目标定位（image classification and object localization）是机器视觉领域的核心问题之一，其不仅将图像分为不同类别，而且要对图像中的视觉对象进行定位。","页":"书内 p.174 / PDF p.189","书内页":174,"PDF页":189,"讲解":"这段与基础模块同名条目共用教材原句，但考纲要求是“掌握”，因此要把三层任务分开说清：分类只回答“是什么”，输出一个类别标签；定位在分类之外还要给出对象位置，用包围盒（左上角横纵坐标＋宽高，共 4 个参数）表示；分割则要求逐像素判定归属，输出掩膜而不是矩形框。三者的难度与标注成本递进：分类最便宜，定位要画框，分割要逐像素标注。教材在 5.8.2 节把分类与定位放在一起讲，并在后文引出基于候选区域与单次检测两条技术路线。","讲解来源":"self","核对":"locator","原文核对":"通过"}]},"L3":{"img":"bookimg/yl-p189.jpg","focus":"img/kp-综合-图像分割与分类.jpg","bbox":[0.1208,0.6523,0.8999,0.9357],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-目标检测与识别","模块":"综合模块","知识领域":"计算机视觉","知识单元":"计算机视觉方法与应用","知识点":"目标检测与识别","要求":"掌握","考纲来源":"官方","题数":10,"题id":["TB-NOTE-12","DIG-74-01","DIG-74-02","DIG-74-03","DIG-74-04","DIG-74-05","DIG-74-06","DIG-74-07","DIG-74-08","DIG-74-09"],"教材":"yl","教材名":"人工智能引论","章节":"第5章 · 5.8.2 图像分类与目标定位","书内页":175,"PDF页":190,"状态":"完整","L1":{"一句话":"分类只回答「图里是什么」，检测还要回答「在哪里」——所以它同时干两件事：判断类别（分类问题）＋ 框出位置（回归问题），这在教材里叫多任务学习。","易错":["把「定位」与「检测」混为一谈。定位通常指单目标；检测要处理多目标并逐个分类。","把 YOLO 归为两阶段。YOLO 是单阶段代表，两阶段代表是 R-CNN 家族。","以为检测只有一个损失。它同时优化分类损失与回归损失。","以为包围盒用 6 个或 8 个参数。教材明确是 4 个。"],"对比":[{"维度":"输出","图像分类":"一个类别标签","目标定位":"一个类别 + 一个包围盒","目标检测":"多个类别 + 多个包围盒"},{"维度":"目标数量","图像分类":"整图一个判断","目标定位":"通常单个主目标","目标检测":"任意多个目标"},{"维度":"关键指标","图像分类":"准确率","目标定位":"定位误差 / IoU","目标检测":"mAP、IoU 阈值下的精度"},{"维度":"典型代表","图像分类":"ResNet、VGG","目标定位":"分类网络 + 回归分支","目标检测":"两阶段：Faster R-CNN；单阶段：YOLO、SSD"}]},"L2":{"档":"general","段":[{"n":1,"文":"图像分类与目标定位是机器视觉领域的核心问题之一，其不仅将图像分为不同类别，而且要对图像中的视觉对象进行定位。视觉对象目标的位置可用包围盒（bounding box）表示，即一个矩形方框左上角的横坐标和纵坐标及该矩形框的高度与宽度。","页":"《人工智能引论》5.8.2 节，书内 p.174","书内页":175,"PDF页":190,"讲解":"这段先给总判断：图像分类与目标定位是机器视觉的核心问题之一，不仅要把图像分类，还要对视觉对象定位。接着给定位的表示方法：包围盒，即矩形方框左上角的横坐标与纵坐标，以及该矩形框的高度与宽度。理解要点是“四个数就能描述一个框”，这是后面所有检测算法输出格式的基础。","讲解来源":"self","核对":"pending","原文核对":"对不上"},{"n":2,"文":"已有的图像分类与目标定位算法可以分为两类。①基于候选区域的目标检测方法……典型代表有 R-CNN、Fast R-CNN、Faster R-CNN 等。②单次目标检测方法，即不经过候选区域检测这个过程，直接对输入图像进行处理而得到视觉对象区域预测结果，也称为单阶段模型，典型代表有 SSD、YOLO 等。","页":"《人工智能引论》5.8.2 节，书内 p.174–175","书内页":175,"PDF页":190,"讲解":"这段讲两条技术路线。第一条：基于候选区域的目标检测方法，先产生候选区域再判断类别，典型代表 R-CNN、Fast R-CNN、Faster R-CNN。第二条：单次目标检测，不经过候选区域检测这个过程，直接对输入图像处理得到视觉对象区域预测，也称单阶段模型，典型代表 SSD、YOLO。两阶段精度通常更高但更慢，单阶段更快，这是工程选型的基本权衡。答题时先分类再举例，别只写算法名。","讲解来源":"self","核对":"pending","原文核对":"部分相符"},{"n":3,"文":"图像分类与目标定位需要同时完成回归问题（位置判断）与分类问题（物体识别）两个任务，这种同时解决两个及以上问题的任务为多任务学习（multi-task learning）。","页":"《人工智能引论》5.8.2 节，书内 p.175","书内页":175,"PDF页":190,"讲解":"这段给出任务性质的定性：图像分类与目标定位需要同时完成回归问题（位置判断）与分类问题（物体识别）两个任务，这种同时解决两个及以上问题的任务叫多任务学习。理解要点：检测的损失通常也由两部分组成——分类损失管“是什么”，回归损失管“框得准不准”。所以回答“目标检测为什么比分类难”，可以从“要多学一个连续量的回归、且正负样本极不均衡”两个角度切入。","讲解来源":"self","核对":"pending","原文核对":"通过"}]},"L3":{"img":"bookimg/yl-p190.jpg","focus":"img/kp-综合-目标检测与识别.jpg","bbox":[0.1093,0.43,0.8895,0.7907],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-生物特征识别","模块":"综合模块","知识领域":"计算机视觉","知识单元":"计算机视觉方法与应用","知识点":"生物特征识别","要求":"理解","考纲来源":"官方","题数":6,"题id":["38A-A-20","TB-DX4-HW-80","DIG-75-01","DIG-75-02","DIG-75-03","DIG-75-04"],"教材":"dx4","教材名":"大学信息技术4—人工智能基础与实践","章节":"1.3 人工智能技术与应用","书内页":15,"PDF页":28,"状态":"完整","L1":{"一句话":"生物特征识别属于模式识别的应用方向：把手写体、指纹、虹膜、人脸、语音等生物或行为特征当作“模式”做分类与辨识。","关键词":["模式识别应用","指纹/虹膜/人脸","特征提取与匹配"],"易错点":"把生物特征识别当成独立技术体系——教材把它列在模式识别的应用领域里；也容易忽略“生物特征”包含行为特征（如步态、签名）。"},"L2":{"档":"locator","段":[{"n":1,"文":"模式识别包括对语音波形、地震波、心电图、脑电图、图片、照片、文字、符号和生物传感器等对象进行测量的具体模式进行分类和辨识，其应用领域包括手写体识别、指纹识别、虹膜识别、医学图片辨识、语音识别、生物特征识别、人脸识别等。特别是基于深度学习等人工智能技术的X光、核磁、CT、超声等医疗影像多模态大数据分析技术，能够提取二维或三维医疗影像隐含的疾病特征，辅助医生识别诊断。+1.3.2计算机视觉计算机视觉（ComputerVision，CV）又称机器视觉（MachineVision），是用机器（摄影机或电脑）代替人眼对目标进行测量、识别和跟踪，并进一步做图形处理，抽取目标特征，使之成为更适合人眼观察或仪器检测的图像，进而根据判别结果来控制现成的设备动作，是计算机及相关设备对生物视觉的一种模拟，是模式识别的一个重要方面。目前，计算机视觉的应用相当普及，不仅在半导体及电子、汽车、冶金、制药、印刷和食品饮料等制造业产品质量检测中得到广泛应用，还在人","页":"书内 p.15 / PDF p.28","书内页":15,"PDF页":28,"讲解":"这段先给模式识别的范围：对语音波形、地震波、心电图、脑电图、图片、照片、文字、符号、生物传感器等对象进行测量的具体模式做分类和辨识。然后列应用领域：手写体识别、指纹识别、虹膜识别、医学图片辨识、语音识别、生物特征识别、人脸识别等。理解要点是“生物特征识别”在这里是模式识别的一个应用方向，而不是与之并列的技术门类——它把指纹、虹膜、人脸这些高维特征当作待分类的模式。教材随后补充医疗影像：基于深度学习的 X 光、核磁、CT 等多模态大数据分析能提取二维或三维影像中的疾病特征，辅助医生识别诊断。","讲解来源":"self","核对":"locator","原文核对":"对不上"}]},"L3":{"img":"bookimg/dx4-p28.jpg","focus":"img/kp-综合-生物特征识别.jpg","bbox":[0.0552,0.1107,0.8953,0.5855],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-行为分析","模块":"综合模块","知识领域":"计算机视觉","知识单元":"计算机视觉方法与应用","知识点":"行为分析","要求":"知道","考纲来源":"官方","题数":3,"题id":["TB-NOTE-13","DIG-76-01","DIG-76-02"],"教材":"yl","教材名":"人工智能引论","章节":"第5章 · 5.5 循环神经网络（视频帧序列）","书内页":160,"PDF页":175,"状态":"完整","L1":{"一句话":"行为分析的输入不是一张图，而是一段视频——多出来的那一维是时间。所以要同时看懂「每一帧长什么样」和「这些帧怎么变」，前者靠卷积，后者靠循环网络或 3D 卷积。","易错":["把行为分析等同于目标检测。检测回答「有没有人」，行为分析回答「人在做什么」。","以为只用一个 CNN 就能做好。单帧 CNN 缺时序信息，通常需要 RNN/3D 卷积/双流补充。","把「动作识别」与「姿态估计」混为一谈。姿态估计输出关节点坐标，是行为分析的输入之一。"],"对比":[{"维度":"输入","图像分类":"单张静态图像","行为分析":"视频帧序列（含时间维）"},{"维度":"需要建模的维度","图像分类":"空间","行为分析":"空间 + 时间"},{"维度":"典型网络","图像分类":"CNN（ResNet、VGG）","行为分析":"CNN+RNN、双流、3D CNN、骨架序列模型"},{"维度":"典型任务","图像分类":"识别图中物体类别","行为分析":"识别动作类别 / 检测异常行为"}]},"L2":{"档":"general","段":[{"n":1,"文":"教材在 5.5 节讨论循环神经网络时提到可用 RNN 处理视频帧构成的序列，但<b>未以「行为分析」为节展开</b>。考纲对本条要求为「知道」，故按学科通用表述补足。","页":"教材仅提及，以下为通用表述（书内 p.160 附近）","书内页":160,"PDF页":175,"讲解":"这段是定位说明：教材在 5.5 节讨论循环神经网络时提到可用 RNN 处理视频帧构成的序列，但没有以“行为分析”为节展开；考纲只要求“知道”，故按通用表述补足。通用要点：行为分析的输入是视频而不是单张图，多出来的一维是时间，所以要同时建模“每帧长什么样”（空间特征，靠卷积）和“帧之间怎么变”（时序特征，靠 RNN/LSTM、3D 卷积或双流网络）。它与目标检测的区别要能说清：检测回答“有没有人、人在哪”，行为分析回答“人在做什么”。典型应用是跌倒检测、异常行为告警、体育动作评估。","讲解来源":"self","核对":"pending","原文核对":"对不上"}]},"L3":{"img":"bookimg/yl-p175.jpg","focus":"img/kp-综合-行为分析.jpg","bbox":[0.1151,0.5782,0.893,0.8388],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-基本概念-响度-共振峰-掩蔽效应-基音等","模块":"综合模块","知识领域":"语音处理","知识单元":"语音处理基础","知识点":"基本概念（响度、共振峰、掩蔽效应、基音等）","要求":"理解","考纲来源":"官方","题数":6,"题id":["TB-NOTE-14","DIG-77-01","DIG-77-02","DIG-77-03","DIG-77-04","DIG-77-05"],"教材":"yl","教材名":"人工智能引论","章节":"第10章 · 10.4.1 语音识别（共振峰、音高）","书内页":305,"PDF页":320,"状态":"完整","L1":{"一句话":"响度是「多大声」，基音（基频）是「多高的调」，共振峰是「什么音色、发哪个元音」，掩蔽效应是「一个声音把另一个声音盖住了」——最后这条正是音频压缩敢丢数据的依据。","易错":["把基频与共振峰记混。基频由<b>声带</b>决定（音高），共振峰由<b>声道</b>决定（音色）。","以为响度与声压级是线性关系。实际近似对数关系。","把掩蔽效应理解成「噪声干扰」。它是听觉系统的固有特性，被掩蔽的可能是纯音而非噪声。","以为共振峰只有一个。实际有 F1、F2、F3 等多个，起决定作用的是前两个。"],"对比":[{"维度":"客观物理量","响度":"振幅 / 声压级（dB）","基音（基频）":"基频 F0（Hz）","共振峰":"频谱包络峰值 F1/F2/F3","掩蔽效应":"听阈随掩蔽声升高"},{"维度":"决定因素","响度":"声波能量","基音（基频）":"声带振动频率","共振峰":"声道形状","掩蔽效应":"听觉系统的频域/时域特性"},{"维度":"主观对应","响度":"听起来多响","基音（基频）":"听起来多高","共振峰":"音色、是哪个元音","掩蔽效应":"某些声音听不见"},{"维度":"典型应用","响度":"音量归一化","基音（基频）":"声调识别、韵律建模","共振峰":"语音识别、说话人识别","掩蔽效应":"有损音频压缩"}]},"L2":{"档":"general","段":[{"n":1,"文":"教材在 10.4.1 节语音识别中提及共振峰与音高等概念，但<b>未系统展开语音基本概念</b>。考纲对本条要求为「理解」，故按学科通用表述补足，教材定位为第 10 章语音处理部分（书内 p.305）。","页":"教材仅提及，以下为通用表述","书内页":305,"PDF页":320,"讲解":"这段是定位说明：教材在 10.4.1 节语音识别中提到共振峰与音高，但没有系统展开语音基本概念；考纲要求“理解”，故按通用表述补足。四个概念要能一句话说清并区分：响度是主观感受到的“多大声”，与声压级近似对数关系；基音（基频）由声带振动频率决定，对应“多高的调”；共振峰由声道形状决定，是频谱上的能量峰（F1、F2 最关键），决定音色与发哪个元音；掩蔽效应是一个声音使另一个声音不易被听见，分为同时掩蔽与短时掩蔽，它正是音频压缩敢于丢掉部分数据的依据。","讲解来源":"self","核对":"pending","原文核对":"对不上"}]},"L3":{"img":"bookimg/yl-p320.jpg","focus":"img/kp-综合-基本概念-响度-共振峰-掩蔽效应-基音等.jpg","bbox":[0.107,0.3583,0.8872,0.7687],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-声音信号预处理与量化","模块":"综合模块","知识领域":"语音处理","知识单元":"语音处理基础","知识点":"声音信号预处理与量化","要求":"理解","考纲来源":"官方","题数":6,"题id":["TB-NOTE-15","DIG-78-01","DIG-78-02","DIG-78-03","DIG-78-04","DIG-78-05"],"教材":"yl","教材名":"人工智能引论","章节":"第10章 · 10.4.2 语音合成技术（采样率）","书内页":308,"PDF页":323,"状态":"完整","L1":{"一句话":"连续的声音要进计算机，得先过两道关：按时间「采样」，按幅度「量化」。采样率不够会混叠，量化位数不够会有量化噪声；采完之后还要预加重、分帧、加窗，才能拿去提特征。","易错":["把采样与量化搞反。采样是<b>时间</b>离散化，量化是<b>幅度</b>离散化。","以为混叠可以后期修复。一旦折叠就已失真，只能事前抗混叠滤波。","以为分帧是切得越短越好。太短则频率分辨率不足，常规取 20–30 ms。","算比特率时漏乘声道数或把 kHz 单位换算错。"],"对比":[{"维度":"作用","采样":"时间轴离散化","量化":"幅度轴离散化"},{"维度":"关键参数","采样":"采样率 fs（Hz）","量化":"位深 bit"},{"维度":"参数不足的后果","采样":"混叠，高频被折叠成假低频，不可逆","量化":"量化噪声增大，信噪比下降"},{"维度":"理论依据","采样":"奈奎斯特采样定理（fs ≥ 2f_max）","量化":"电平数与位深的关系（2^n 级）"}]},"L2":{"档":"general","段":[{"n":1,"文":"教材在 10.4.2 节语音合成部分提及采样率，但<b>未展开预处理与量化流程</b>。考纲对本条要求为「理解」，故按学科通用表述补足，教材定位为第 10 章语音处理部分（书内 p.308）。","页":"教材仅提及，以下为通用表述","书内页":308,"PDF页":323,"讲解":"这段是定位说明：教材在 10.4.2 节语音合成中提及采样率，但没有展开预处理与量化流程；考纲要求“理解”，故按通用表述补足。流程按顺序记：抗混叠滤波（先滤掉高于一半采样率的成分）→ 采样（按固定时间间隔取点，把时间轴离散化）→ 量化（把幅度切成有限档，把幅度轴离散化）→ 编码。两个关键结论：采样率必须大于信号最高频率的两倍（奈奎斯特），否则发生混叠且不可逆；量化位数决定量化噪声大小。语音识别里采完还要预加重、分帧（常 20–30 ms）、加窗，再做特征提取。","讲解来源":"self","核对":"pending","原文核对":"对不上"}]},"L3":{"img":"bookimg/yl-p323.jpg","focus":"img/kp-综合-声音信号预处理与量化.jpg","bbox":[0.1185,0.1759,0.8976,0.5611],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-常用时域-频域-声学特征","模块":"综合模块","知识领域":"语音处理","知识单元":"语音处理基础","知识点":"常用时域、频域、声学特征","要求":"理解","考纲来源":"官方","题数":6,"题id":["TB-NOTE-16","DIG-79-01","DIG-79-02","DIG-79-03","DIG-79-04","DIG-79-05"],"教材":"yl","教材名":"人工智能引论","章节":"第10章 · 10.4.2 语音合成技术（声学特征）","书内页":307,"PDF页":322,"状态":"完整","L1":{"一句话":"时域特征看波形本身（能量、过零率），频域特征看频谱分布（谱质心、谱滚降），声学特征则是给识别模型用的压缩表示——最经典的是 MFCC，它按人耳的非线性感知把频谱压成几十维。","易错":["把 MFCC 与 FBank 混为一谈。FBank 是滤波器组能量；MFCC 是在其基础上取对数再 DCT 的结果。","以为梅尔刻度是线性的。它是对数型非线性映射。","把短时能量与过零率的用途记反。能量看「有多响/有没有声」，过零率看「清音还是浊音」。","以为特征维度越高越好。维度过高会引入冗余并增加模型负担。"],"对比":[{"维度":"计算域","时域特征":"直接在波形采样上计算","频域特征":"先 FFT 再计算","声学特征（MFCC 等）":"频谱 → 滤波器组 → 变换"},{"维度":"典型代表","时域特征":"短时能量、短时过零率","频域特征":"谱质心、谱滚降、功率谱","声学特征（MFCC 等）":"MFCC、FBank、LPC"},{"维度":"主要用途","时域特征":"端点检测、清浊音判别","频域特征":"音色描述、频带分析","声学特征（MFCC 等）":"送入识别/合成模型"},{"维度":"维度量级","时域特征":"1–2 维/帧","频域特征":"与 FFT 点数相关","声学特征（MFCC 等）":"MFCC 常取 12–13 维（含差分约 39 维）"}]},"L2":{"档":"general","段":[{"n":1,"文":"教材在 10.4.2 节提及声学特征，但<b>未展开具体特征类型</b>。考纲对本条要求为「理解」，故按学科通用表述补足，教材定位为第 10 章语音处理部分（书内 p.307）。","页":"教材仅提及，以下为通用表述","书内页":307,"PDF页":322,"讲解":"这段是定位说明：教材在 10.4.2 节提及声学特征但未展开类型；考纲要求“理解”，故按通用表述补足。三类要分类记：时域特征直接看波形——短时能量反映“有多响、有没有声”，过零率反映清音还是浊音；频域特征看频谱分布——谱质心、谱滚降、谱通量描述音色明暗与变化；声学特征则是给模型用的压缩表示，最经典的是 MFCC：先做梅尔刻度滤波（模拟人耳非线性感知），取对数后再做 DCT 去相关，得到几十维系数。FBank 是它的中间产物——只到滤波器组能量、不做 DCT。","讲解来源":"self","核对":"pending","原文核对":"对不上"}]},"L3":{"img":"bookimg/yl-p322.jpg","focus":"img/kp-综合-常用时域-频域-声学特征.jpg","bbox":[0.1047,0.5554,0.8826,0.9406],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-常用模型-DNN-HMM-Attention-Transformer-等","模块":"综合模块","知识领域":"语音处理","知识单元":"语音处理方法与应用","知识点":"常用模型（DNN-HMM、Attention、Transformer 等）","要求":"知道","考纲来源":"官方","题数":3,"题id":["TB-NOTE-17","DIG-80-01","DIG-80-02"],"教材":"yl","教材名":"人工智能引论","章节":"第10章 · 10.4.1 语音识别（GMM-HMM 与神经网络替代 GMM）","书内页":306,"PDF页":321,"状态":"完整","L1":{"一句话":"语音识别的模型演进就三步：GMM-HMM 分工建模（HMM 管时序、GMM 管观测）→ DNN-HMM 用神经网络换掉 GMM → 端到端（CTC、注意力、Transformer）把整条流水线合成一个网络。","易错":["以为 DNN-HMM 把 HMM 也一起换掉了。实际只换声学模型部分。","把 CTC 当成一种网络结构。它本质是一种<b>损失函数/对齐方法</b>，需配合网络使用。","以为端到端完全不需要语言模型。很多系统仍会融合语言模型做后处理。","把 Attention 与 Transformer 当成互斥的两条路线。Transformer 本身就以自注意力为核心。"],"对比":[{"维度":"时序建模","GMM-HMM":"HMM 显式建模状态转移","DNN-HMM":"仍是 HMM","端到端（CTC/Transformer）":"由网络隐式学习"},{"维度":"声学建模","GMM-HMM":"GMM 拟合观测分布","DNN-HMM":"DNN 预测状态后验","端到端（CTC/Transformer）":"深度网络直接映射到字符"},{"维度":"是否需发音词典","GMM-HMM":"需要","DNN-HMM":"需要","端到端（CTC/Transformer）":"通常不需要"},{"维度":"主要局限","GMM-HMM":"高斯假设强，难刻画复杂分布","DNN-HMM":"仍需词典与对齐，流水线复杂","端到端（CTC/Transformer）":"依赖大规模数据，可解释性弱"}]},"L2":{"档":"general","段":[{"n":1,"文":"教材在 10.4.1 节指出，传统语音识别采用 GMM-HMM 框架，后续用神经网络替代其中的高斯混合模型来计算观测概率，形成 DNN-HMM 混合模型；深度学习进一步推动了端到端语音识别的发展。","页":"《人工智能引论》10.4.1 节，书内 p.306（要点转述）","书内页":306,"PDF页":321,"讲解":"这段的教材落点很明确：传统语音识别采用 GMM-HMM 框架，后续用神经网络替代其中的高斯混合模型来计算观测概率，形成 DNN-HMM 混合模型；深度学习进一步推动了端到端语音识别的发展。演进三步要能复述：第一步 GMM-HMM 分工（HMM 管时序状态转移、GMM 管每状态的观测概率）；第二步 DNN-HMM 用深层网络替换 GMM，判别能力更强；第三步端到端（CTC、注意力、Transformer）把声学模型、发音词典、语言模型合成一个网络，直接从音频到文本。注意 DNN-HMM 只换了声学模型，HMM 的时序框架仍在。","讲解来源":"self","核对":"pending","原文核对":"对不上"}]},"L3":{"img":"bookimg/yl-p321.jpg","focus":"img/kp-综合-常用模型-DNN-HMM-Attention-Transformer-等.jpg","bbox":[0.1185,0.1238,0.8953,0.509],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-词法-分词-词性标注-命名实体识别等","模块":"综合模块","知识领域":"自然语言处理","知识单元":"自然语言处理基础","知识点":"词法（分词、词性标注、命名实体识别等）","要求":"理解","考纲来源":"官方","题数":6,"题id":["38A-B-08","GUIDE-MULTI-02","DIG-81-01","DIG-81-02","DIG-81-03","DIG-81-04"],"教材":"dx4","教材名":"大学信息技术4—人工智能基础与实践","章节":"1.3 人工智能技术与应用","书内页":17,"PDF页":30,"状态":"完整","L1":{"一句话":"自然语言处理的目标是让计算机“听懂”“看懂”人类语言；词法分析是其第一层能力，含分词、词性标注、命名实体识别等，往上是句法与语义。","关键词":["分词","词性标注","命名实体识别","词法→句法→语义"],"易错点":"把句法分析混进词法（依存句法分析属于句法层）；中文还需先分词，这一步英文没有。"},"L2":{"档":"locator","段":[{"n":1,"文":"分割算法和基于区域的分割算法，深度学习在语义分割上也有很好的效果，常用的有全卷积神经网络（FullyConvolutionalNetworks，FCN）。1.3.3自然语言处理自然语言处理（NaturalLanguageProcessing，NLP）的目标是让计算机能“听懂”和“看懂”人类语言（如汉语、英语等），其包含词法分析、依存句法分析、词义相似度、词向量、短文本相似度、情感分析、短语挖掘和智能写作等技术能力，可用于智能交互、深度问答、内容建模、用户画像建模和语义分析等场景。目前自然语言处理的应用领域非常广泛，如应用于智能客服和智能助手等场景，使机器人能精准理解用户意图，具有对话交互能力；应用于实时字幕和同声传译等场景，实现多语种的语音和文字机器翻译；应用于新闻推荐、报告整理等场景，自动生成文本的简短摘要。ElonMuskWAIC未来，掌握零些知识或技能将有助于我们联得更多的优势？对于想要从事人工智能职业的年轻人，您有什么建议吗？Whatknowledgeorskillsets wilbe useful tomasterin2019世界人工智能大","页":"书内 p.17 / PDF p.30","书内页":17,"PDF页":30,"讲解":"这段先给自然语言处理的定义：目标是让计算机能“听懂”和“看懂”人类语言，包含词法分析、依存句法分析、词义相似度、词向量、短文本相似度、情感分析、短语挖掘、智能写作等技术能力，可用于智能交互、深度问答、内容建模、用户画像建模和语义分析等场景。随后列应用：智能客服与智能助手（精准理解用户意图、具备对话交互能力）、实时字幕与同声传译（多语种语音与文字机器翻译）、新闻推荐与报告整理（自动生成简短摘要）。理解要点是这句话本身给出了 NLP 的能力清单与场景清单，答题时按“能力—场景”成对列举即可。","讲解来源":"self","核对":"locator","原文核对":"部分相符"}]},"L3":{"img":"bookimg/dx4-p30.jpg","focus":"img/kp-综合-词法-分词-词性标注-命名实体识别等.jpg","bbox":[0.0575,0.145,0.8941,0.5293],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-句法-句子成分分析-生成式句法-依存式句法等","模块":"综合模块","知识领域":"自然语言处理","知识单元":"自然语言处理基础","知识点":"句法（句子成分分析、生成式句法、依存式句法等）","要求":"理解","考纲来源":"官方","题数":6,"题id":["TB-NOTE-18","DIG-82-01","DIG-82-02","DIG-82-03","DIG-82-04","DIG-82-05"],"教材":"dx4","教材名":"大学信息技术4—人工智能基础与实践","章节":"1.3 人工智能技术与应用","书内页":17,"PDF页":30,"状态":"完整","L1":{"一句话":"词法管「一个词是什么」，句法管「这些词怎么组成句」。两种主要看法：成分句法把句子拆成层层嵌套的短语块，依存句法直接画出词与词之间的支配关系。","易错":["把句法分析与词法分析混淆。分词、词性标注、NER 属<b>词法</b>，不是句法。","以为成分句法和依存句法是一回事。前者切短语块，后者标词间关系，输出形态完全不同。","把「生成式句法」理解成「用生成模型做大模型」。它指的是形式文法/规则生成，与生成式 AI 不是同一概念。","以为句法分析只服务翻译。信息抽取、问答同样依赖。"],"对比":[{"维度":"分析单位","成分句法":"短语成分（NP、VP 等）","依存句法":"词与词之间的支配关系"},{"维度":"输出形态","成分句法":"层层嵌套的短语结构树","依存句法":"带标签的有向依存弧"},{"维度":"关注点","成分句法":"句子由哪些块组成、如何嵌套","依存句法":"谁修饰谁、谁支配谁"},{"维度":"典型用途","成分句法":"句法结构分析、语言教学","依存句法":"信息抽取、关系抽取、问答"}]},"L2":{"档":"general","段":[{"n":1,"文":"《大学信息技术4》1.3 节在介绍自然语言处理时涉及句法分析，但<b>未展开具体方法</b>。考纲对本条要求为「理解」，故按学科通用表述补足，教材定位仅到 1.3 节自然语言处理部分（书内 p.17）。","页":"教材仅提及，以下为通用表述","书内页":17,"PDF页":30,"讲解":"这段是定位说明：教材在 1.3 节介绍自然语言处理时涉及句法分析，但没有展开具体方法；考纲要求“理解”，故按通用表述补足。两种主要视角要能对照：成分句法（短语结构句法）把句子层层切分成嵌套的短语块（NP、VP 等），输出一棵短语结构树；依存句法直接标出词与词之间的支配关系（主谓、动宾），输出一棵依存树，更适合语序自由的语言。还有生成式句法一说，指用形式文法规则“生成”句子的合法性判断，与“用生成模型做大模型”不是一回事——这个歧义是常见错点。","讲解来源":"self","核对":"pending","原文核对":"对不上"}]},"L3":{"img":"bookimg/dx4-p30.jpg","focus":"img/kp-综合-句法-句子成分分析-生成式句法-依存式句法等.jpg","bbox":[0.0575,0.145,0.8941,0.5293],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-词表示-n-gram-语言模型-word2vec-等","模块":"综合模块","知识领域":"自然语言处理","知识单元":"自然语言处理方法与应用","知识点":"词表示（n-gram 语言模型、word2vec 等）","要求":"知道","考纲来源":"官方","题数":3,"题id":["38A-A-17","DIG-83-01","DIG-83-02"],"教材":"yl","教材名":"人工智能引论","章节":"5.8 深度学习在 NLP 和 CV 中的应用","书内页":171,"PDF页":186,"状态":"完整","L1":{"一句话":"词表示把词映射成向量：word2vec 用浅层网络学词向量，两种训练模式是 CBOW（用上下文预测中心词）与 skip-gram（用中心词预测上下文）。","关键词":["词向量","CBOW","skip-gram","损失函数＋梯度下降"],"易错点":"把 CBOW 与 skip-gram 记反（CBOW 是“多看一”，skip-gram 是“一看多”）；也容易以为词向量是人工设计的特征。"},"L2":{"档":"locator","段":[{"n":1,"文":"V全连接权重全连接权重hWvxNWNxVWkX2y2优化得到的模型参数h2WixkW2xkyk=（vw1xNX（W（k)Nx1WKNeykhNWNxk输入单词的N维词向量{Wk,Wk..,WkN}隐藏层归一化概率输出yyX输入层输出层图5.24单个单词的词向量生成示意为了训练词向量模型，可将训练目标进行如下形式化描述：word2vecmodel=maxP（输出表达l输人表达）eyk=maxlog=maxyk-log其中，星号（*）表示预测值。对上式取其相反数，令其最小，则得到损失函数loss=-+log这样就可以利用梯度下降和误差反向传播来优化训练参数Wvx和WNxvo通常，word2vec的模型参数有两种训练模式：一种是continuousbag-of-words(CBoW），即根据某个单词所处的上下文单词来预测该单词；另一种是skip-gram，即利用某个单词来分别预测该单词的上下文单词。图5.25所示为基于CBoW得到词向量的示意。给出包含c个单词的句子{x1，xk-1x，xk+1，，x}，在CBoW中，可用x的前序k-1个单词和后续c-k个单词一起来预测","页":"书内 p.171 / PDF p.186","书内页":171,"PDF页":186,"讲解":"这段讲 word2vec 的训练机制。结构上是一个浅层网络：输入是单词的 N 维词向量，中间有隐藏层与两套权重矩阵，输出层归一化后给出概率分布。训练目标可以形式化为最大化“给定输入表达时输出表达的概率”，取对数后取相反数作为损失函数，再用梯度下降与误差反向传播优化两组权重。两种训练模式要分清：CBOW（continuous bag-of-words）根据某个单词所处的上下文单词来预测该单词；skip-gram 反过来，用某个单词去分别预测它的上下文单词。理解要点是“词义由上下文决定”，所以共现频率高的词向量会靠近。","讲解来源":"self","核对":"locator","原文核对":"对不上"}]},"L3":{"img":"bookimg/yl-p186.jpg","focus":"img/kp-综合-词表示-n-gram-语言模型-word2vec-等.jpg","bbox":[0.1105,0.0269,0.9517,0.4243],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-句子建模-RNN-LSTM-Transformer-等","模块":"综合模块","知识领域":"自然语言处理","知识单元":"自然语言处理方法与应用","知识点":"句子建模（RNN、LSTM、Transformer 等）","要求":"知道","考纲来源":"官方","题数":3,"题id":["TB-YL-HW-79","DIG-84-01","DIG-84-02"],"教材":"yl","教材名":"人工智能引论","章节":"5.5 循环神经网络","书内页":160,"PDF页":175,"状态":"完整","L1":{"一句话":"句子建模把一句话压成一个向量：可以用 RNN 取最后时刻输出，或对各词隐式编码加权平均；LSTM/GRU 缓解长依赖，Transformer 用自注意力并行建模。","关键词":["句子向量","最后时刻输出/加权平均","LSTM/GRU","自注意力"],"易错点":"以为句子向量只有一种取法（教材给了两条路）；也容易忽略 RNN 的长距离依赖缺陷，它正是 LSTM 出现的理由。"},"L2":{"档":"locator","段":[{"n":1,"文":"被后向传递，因此将最后一个单词的输出作为整个句子的向量编码表示；②将每个单词的隐式编码进行加权平均，将加权平均结果作为句子的向量编码表示。这样，一旦得到句子的向量编码表示，就可以利用某个分类器对句子的类别进行判断。互，，“，，《，中间存在前后依赖，这种依赖会被有效利用起来，得到各单词的隐式编码及句子的向量表达。隐式编码RNNRNNRNNRNNRNN入图5.16循环神经网络的应用示例在循环神经网络中，根据输入序列数据与输出序列数据中所包含“单元”的多寡，循环神经网络可以实现“多对多”（即输入和输出序列数据中包含多个单元，常用于机器翻译）、“多对一”（即输人序列数据包含多个单元，输出序列数据只包含一个单元，常用于文本的情感分类）和“一对多”（即输人序列数据包含一个单元，输出序列数据包含多个单元，常用于图像描述生成）三种模式，如图5.17所示。循环神经网络虽然具有一定的记忆能力，但当彼此相关信息在序列中相距较远时，循环神经网络无法捕捉到数据之中的时序依赖关系。除此之外，当输人序列过长时，循环神经网络也容易出现梯度消失（gradientvanishing）或者","页":"书内 p.160 / PDF p.175","书内页":160,"PDF页":175,"讲解":"这段讲句子表示的两条路径并指出 RNN 的局限。路径一：把最后一个单词的输出作为整个句子的向量编码——前提是信息能一路向后传。路径二：把每个单词的隐式编码做加权平均，作为句子表示。得到句子向量后，就可以用某个分类器判断句子类别（如情感分类）。教材随后提醒：句子中词与词之间存在前后依赖，RNN 会把这种依赖利用起来得到各词隐式编码与句子表达，但当相关信息在序列中相距较远时，RNN 无法有效捕捉——这就是 LSTM、GRU 用门控机制保留长期信息的动因，也是 Transformer 用自注意力直接建模任意两词关系的动因。","讲解来源":"self","核对":"locator","原文核对":"对不上"}]},"L3":{"img":"bookimg/yl-p175.jpg","focus":"img/kp-综合-句子建模-RNN-LSTM-Transformer-等.jpg","bbox":[0.1151,0.5782,0.893,0.8388],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-智能社会技术-应用","模块":"综合模块","知识领域":"人工智能应用","知识单元":"智能社会","知识点":"智能社会技术、应用","要求":"理解","考纲来源":"官方","题数":6,"题id":["TB-NOTE-19","DIG-85-01","DIG-85-02","DIG-85-03","DIG-85-04","DIG-85-05"],"教材":"yl","教材名":"人工智能引论","章节":"第8章 · 8.1.2 科技的双重属性（人机共融社会形态）","书内页":255,"PDF页":270,"状态":"完整","L1":{"一句话":"智能社会的技术骨架是「一个底座 + 三类能力」：城市级数据底座（城市大脑/数字孪生），加上感知、预测、调度三类能力，最终落在交通、能源、安防、政务这些公共场景里。","易错":["把智能社会技术等同于「装摄像头」。感知只是第一层，预测与调度才是价值所在。","忽略数据合规约束，认为城市数据可以随意集中训练。","把数字孪生理解成「三维可视化大屏」。孪生的核心是<b>可计算、可推演</b>，不是展示。","只谈技术、不谈公平性与隐私，简答题答不全。"],"对比":[{"维度":"数据范围","智能社会（城市级）":"跨部门、跨系统多源数据","单一 AI 应用（如推荐）":"平台内部业务数据"},{"维度":"核心约束","智能社会（城市级）":"数据不能随意集中，需隐私计算/联邦学习","单一 AI 应用（如推荐）":"以效果与实时性为主"},{"维度":"典型技术","智能社会（城市级）":"数字孪生、时空数据挖掘、图神经网络、强化学习调度","单一 AI 应用（如推荐）":"协同过滤、深度排序模型"},{"维度":"评价标准","智能社会（城市级）":"公共效益、公平性、安全性","单一 AI 应用（如推荐）":"点击率、转化率、留存"}]},"L2":{"档":"textbook","段":[{"n":1,"文":"人工智能正创造和形成人与机、机与机及人机共融的新的社会形态，因此必须确保把人类价值观、道德观和法律法规贯穿于人工智能的产品和服务，赋予人工智能社会属性。","页":"《人工智能引论》8.1.2 节，书内 p.255","书内页":255,"PDF页":270,"讲解":"这句教材原文把“智能社会”的成因讲清了：人工智能正在创造和形成人与机、机与机、人机共融的新的社会形态，因此必须确保把人类价值观、道德观和法律法规贯穿于人工智能的产品和服务，赋予人工智能社会属性。从技术—应用的角度读这句话，能抽出三层：底层是数据与算力的城市级底座；中间是感知、预测、调度三类能力；上层落在交通、能源、安防、政务等公共场景。落脚点仍在“社会属性”——技术能做什么，必须服从社会允许做什么。","讲解来源":"self","核对":"pending","原文核对":"通过"}]},"L3":{"img":"bookimg/yl-p270.jpg","focus":"img/kp-综合-智能社会技术-应用.jpg","bbox":[0.2612,0.5106,0.8815,0.645],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-智能交通技术-应用","模块":"综合模块","知识领域":"人工智能应用","知识单元":"智能交通","知识点":"智能交通技术、应用","要求":"理解","考纲来源":"官方","题数":6,"题id":["GUIDE-PLAN-07","DIG-86-01","DIG-86-02","DIG-86-03","DIG-86-04","DIG-86-05"],"教材":"yl","教材名":"人工智能引论","章节":"1.4 新一代人工智能（应用提及）","书内页":13,"PDF页":28,"状态":"完整","L1":{"一句话":"智能交通、无人驾驶、智能城市等场景都被教材列为迫切需要人工智能新发展的应用方向；技术上以感知、预测、调度三类能力支撑交通运行。","关键词":["感知/预测/调度","车路协同","交通流预测"],"易错点":"把智能交通窄化为无人驾驶；也容易只答“装摄像头”，忽略预测与调度才是价值所在。"},"L2":{"档":"locator","段":[{"n":1,"文":"智能城市、智能医疗、智能交通、智能物流、智能机器人、无人驾驶、智能手机、智能游戏、智能制造、智能社会、智能经济等都迫切需要人工智能的新发展。","页":"书内 p.13 / PDF p.28","书内页":13,"PDF页":28,"讲解":"教材这句是并列场景清单：智能城市、智能医疗、智能交通、智能物流、智能机器人、无人驾驶、智能手机、智能游戏、智能制造、智能社会、智能经济都迫切需要人工智能的新发展。就智能交通而言，从技术—应用角度要能补出三层：感知层用车牌识别、视频结构化、雷达获取路况与车流；预测层用机器学习做交通流与拥堵预测；调度层做信号配时优化、路径诱导与应急指挥。无人驾驶是其中最复杂的一类，它把感知、决策、控制压在一辆车上完成。答题时把“感知—预测—调度”当骨架。","讲解来源":"self","核对":"locator","原文核对":"无法比对"}]},"L3":{"img":"bookimg/yl-p28.jpg","页来源":"pdf-render","核对":"verified"}},{"id":"kp-综合-智能医疗技术-应用","模块":"综合模块","知识领域":"人工智能应用","知识单元":"智能医疗","知识点":"智能医疗技术、应用","要求":"理解","考纲来源":"官方","题数":6,"题id":["TB-NOTE-20","DIG-87-01","DIG-87-02","DIG-87-03","DIG-87-04","DIG-87-05"],"教材":"dx4","教材名":"大学信息技术4—人工智能基础与实践","章节":"第1章 · 1.3.2 计算机视觉（医疗影像分析）","书内页":16,"PDF页":29,"状态":"完整","L1":{"一句话":"智能医疗的技术栈按数据模态分四路：影像用 CNN 做检测与分割，病历文本用 NLP 做结构化，知识用图谱做推理，分子结构用图神经网络做预测——四路最后汇入临床决策。","易错":["把检测与分割混淆。检测给<b>矩形框</b>，分割给<b>逐像素掩膜</b>。","以为医疗 AI 只需影像。病历文本、知识图谱、分子结构同样重要。","把「模型在自己医院准确率高」当成通用能力，忽略跨中心泛化问题。","忽略脱敏与合规要求，直接拿原始病历训练。"],"对比":[{"维度":"输入数据","影像 AI":"X 光、CT、MRI、病理切片","病历 NLP":"电子病历、诊断报告文本","医学知识图谱":"疾病-症状-药品-指南等实体关系"},{"维度":"核心任务","影像 AI":"分类、检测、分割","病历 NLP":"实体识别、关系抽取、结构化","医学知识图谱":"关系推理、冲突检查"},{"维度":"典型模型","影像 AI":"CNN、U-Net","病历 NLP":"BERT 类预训练模型","医学知识图谱":"图数据库 + 图推理"},{"维度":"主要难点","影像 AI":"标注昂贵、跨院泛化","病历 NLP":"术语不规范、隐私脱敏","医学知识图谱":"构建成本高、更新维护难"}]},"L2":{"档":"general","段":[{"n":1,"文":"基于深度学习分析 X 光、CT 等医疗影像的多模态大数据，可提取疾病特征，辅助医生识别与诊断。","页":"《大学信息技术4》1.3.2 节，书内 p.16","书内页":16,"PDF页":29,"讲解":"这句教材原句给的是最成熟的一条技术路线：基于深度学习分析 X 光、CT 等医疗影像的多模态大数据，提取疾病特征，辅助医生识别与诊断。要点有三个：数据是多模态的（不同影像模态、不同序列）；方法是深度学习端到端特征提取；角色是辅助，不是替代。把技术栈按模态摊开更完整：影像用 CNN 做检测与分割；病历文本用 NLP 做结构化与信息抽取；医学知识用知识图谱做推理与问答；分子结构用图神经网络做性质与相互作用预测。四路最后汇入临床决策支持。难点不在单院准确率，而在跨中心泛化与合规。","讲解来源":"self","核对":"pending","原文核对":"对不上"}]},"L3":{"img":"bookimg/dx4-p29.jpg","focus":"img/kp-综合-智能医疗技术-应用.jpg","bbox":[0.099,0.2052,0.9367,0.8306],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-智能制造技术-应用","模块":"综合模块","知识领域":"人工智能应用","知识单元":"智能制造","知识点":"智能制造技术、应用","要求":"理解","考纲来源":"官方","题数":6,"题id":["TB-NOTE-21","DIG-88-01","DIG-88-02","DIG-88-03","DIG-88-04","DIG-88-05"],"教材":"dx4","教材名":"大学信息技术4—人工智能基础与实践","章节":"第1章 · 1.2.5 机器行为（智能制造定义）","书内页":13,"PDF页":26,"状态":"完整","L1":{"一句话":"智能制造的四条主力技术线：视觉质检（看）、预测性维护（预测）、数字孪生（仿真）、智能排产（调度）——分别对应质量、设备、工艺、计划四个环节。","易错":["把预测性维护与事后维修混为一谈。前者是<b>预测</b>后提前介入。","以为智能制造全靠云端。产线实时控制通常需边缘计算。","把数字孪生当成三维动画展示，忽略其仿真与调优功能。","忽略工业场景对实时性与可靠性的硬要求，套用互联网 AI 的思路。"],"对比":[{"维度":"作用环节","视觉质检":"质量检验","预测性维护":"设备管理","数字孪生":"工艺与产线设计","智能排产":"生产计划"},{"维度":"输入数据","视觉质检":"工业相机图像","预测性维护":"振动/温度/电流时序","数字孪生":"产线实时运行数据","智能排产":"订单、工序、产能约束"},{"维度":"常用算法","视觉质检":"CNN 分类/检测、异常检测","预测性维护":"LSTM、时序模型、异常检测","数字孪生":"仿真建模 + 数据同化","智能排产":"运筹优化、启发式、强化学习"},{"维度":"核心收益","视觉质检":"一致性高、不漏检","预测性维护":"减少非计划停机","数字孪生":"不停线试错","智能排产":"柔性交付、降库存"}]},"L2":{"档":"paraphrase","段":[{"n":1,"文":"智能制造以计算机为核心，集成有关技术，取代、延伸与强化专门人才在制造中的智能活动。","页":"《大学信息技术4》1.2.5 节，书内 p.13","书内页":13,"PDF页":26,"讲解":"这句是教材对智能制造的界定：以计算机为核心，集成有关技术，取代、延伸与强化专门人才在制造中的智能活动。落到技术与应用，可以摊成四条主力线：视觉质检（替代人眼做缺陷检测，对应“取代”）、预测性维护（用设备振动与温度数据预测故障，对应“延伸”）、数字孪生（在虚拟空间仿真产线与工艺，对应“强化”）、智能排产（用优化算法调度订单与工位）。判断某案例属不属于智能制造，看它有没有落在“智能活动被集成”上，而不是看车间里机器人多不多。","讲解来源":"self","核对":"pending","原文核对":"部分相符"}]},"L3":{"img":"bookimg/dx4-p26.jpg","focus":"img/kp-综合-智能制造技术-应用.jpg","bbox":[0.0621,0.7345,0.9494,0.9894],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-智能创意技术-应用","模块":"综合模块","知识领域":"人工智能应用","知识单元":"智能创意","知识点":"智能创意技术、应用","要求":"理解","考纲来源":"官方","题数":6,"题id":["TB-NOTE-22","DIG-89-01","DIG-89-02","DIG-89-03","DIG-89-04","DIG-89-05"],"教材":"yl","教材名":"人工智能引论","章节":"附录 A.6 生成式对抗学习","书内页":326,"PDF页":341,"状态":"完整","L1":{"一句话":"智能创意的技术栈是「多模态生成」：文本靠大语言模型自回归续写，图像靠扩散模型去噪生成，音视频靠扩散 + 时序建模，风格迁移靠 GAN——而落地成败往往取决于「可控性」，不是能不能生成。","易错":["以为生成式 AI 只有 GAN。扩散模型与大语言模型同样是主力。","把「能生成」等同于「能商用」。可控性、一致性、版权才是卡点。","以为扩散模型与 GAN 原理相近。前者去噪，后者对抗，机制完全不同。","忽略深度伪造带来的安全与法律风险。"],"对比":[{"维度":"生成机制","扩散模型":"从噪声多步去噪","GAN":"生成器与判别器对抗，一次前向","大语言模型":"按概率逐词自回归"},{"维度":"速度","扩散模型":"采样慢，需多步","GAN":"快，单次前向","大语言模型":"逐词生成，长度越长越慢"},{"维度":"典型模态","扩散模型":"图像、视频、音频","GAN":"图像为主","大语言模型":"文本、代码"},{"维度":"主要短板","扩散模型":"推理成本高、可控性仍需引导","GAN":"训练不稳定、模式崩溃","大语言模型":"幻觉、长文本一致性弱"}]},"L2":{"档":"general","段":[{"n":1,"文":"教材附录 A.6 介绍生成式对抗学习：生成器力图产生以假乱真的样本，判别器力图区分真伪，二者对抗中共同提升。","页":"《人工智能引论》附录 A.6，书内 p.326","书内页":326,"PDF页":341,"讲解":"这句是教材附录对生成式对抗学习的概括：生成器力图产生以假乱真的样本，判别器力图区分真伪，二者在对抗中共同提升。把它当“智能创意的技术底座”来读：文本生成靠大语言模型自回归续写；图像生成主流是扩散模型去噪；音视频生成是扩散加时序建模；风格迁移常用 GAN。真正决定能不能落地的不是“能不能生成”，而是“可控性”——能不能按指定风格、指定结构、指定版权来源生成。此外还要记住深度伪造带来的安全与法律风险，这是伦理题的常见落点。","讲解来源":"self","核对":"pending","原文核对":"对不上"}]},"L3":{"img":"bookimg/yl-p341.jpg","页来源":"scan","核对":"pending"}},{"id":"kp-综合-智能推荐技术-应用","模块":"综合模块","知识领域":"人工智能应用","知识单元":"智能推荐","知识点":"智能推荐技术、应用","要求":"理解","考纲来源":"官方","题数":6,"题id":["TB-NOTE-23","DIG-90-01","DIG-90-02","DIG-90-03","DIG-90-04","DIG-90-05"],"教材":"dx4","教材名":"大学信息技术4—人工智能基础与实践","章节":"第2章 · 2.1.1 图像识别体验（推荐系统应用提及）","书内页":37,"PDF页":50,"状态":"完整","L1":{"一句话":"推荐系统的三代主力：协同过滤（看别人买了啥）、矩阵分解（把用户和物品压成隐向量做匹配）、深度模型（把用户行为序列喂进网络预测下一次点击）——共同难题是冷启动和信息茧房。","易错":["把 UserCF 与 ItemCF 记反。判据是「相似的是人还是物」。","以为推荐系统追求的是「预测评分最准」。工业界核心是排序质量（CTR/CVR）。","忽略冷启动，以为算法能凭空推荐。","把信息茧房当成技术缺陷。它更多是目标函数只优化点击导致的系统性后果。"],"对比":[{"维度":"相似度基于","UserCF":"用户之间的行为相似度","ItemCF":"物品之间的共现相似度"},{"维度":"推荐解释","UserCF":"「和你相似的人喜欢」","ItemCF":"「看了这个的人也看了」"},{"维度":"适用情形","UserCF":"用户数少于物品数、用户兴趣稳定","ItemCF":"物品数少于用户数、物品更新不快"},{"维度":"主要问题","UserCF":"用户增长后相似度计算开销大","ItemCF":"难挖掘跨类目的潜在兴趣"}]},"L2":{"档":"general","段":[{"n":1,"文":"教材第 2 章在介绍人工智能应用体验时提及推荐系统，但<b>未展开具体算法</b>。考纲对本条要求为「理解」，故按学科通用表述补足，教材定位为第 2 章应用部分（书内 p.37）。","页":"教材仅提及，以下为通用表述","书内页":37,"PDF页":50,"讲解":"这段定位说明：教材第 2 章在介绍人工智能应用体验时提及推荐系统，但没有展开具体算法；考纲要求“理解”，故按通用表述补足。三代主力算法要能各说一句：协同过滤——用“相似用户喜欢什么”或“相似物品被谁喜欢”来推荐（UserCF / ItemCF）；矩阵分解——把用户与物品压成低维隐向量、用内积预测偏好；深度模型——把用户行为序列喂进网络直接预测下一次点击。工业界真正的指标是排序质量（CTR/CVR），不是评分误差。共同难题是冷启动与信息茧房。","讲解来源":"self","核对":"pending","原文核对":"对不上"}]},"L3":{"img":"bookimg/dx4-p50.jpg","focus":"img/kp-综合-智能推荐技术-应用.jpg","bbox":[0.0598,0.5098,0.8953,0.9267],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-智慧教育技术-应用","模块":"综合模块","知识领域":"人工智能应用","知识单元":"智慧教育","知识点":"智慧教育技术、应用","要求":"理解","考纲来源":"官方","题数":6,"题id":["TB-NOTE-24","DIG-91-01","DIG-91-02","DIG-91-03","DIG-91-04","DIG-91-05"],"教材":"dx4","教材名":"大学信息技术4—人工智能基础与实践","章节":"第1章 · 1.3.3 自然语言处理（用户画像建模）","书内页":17,"PDF页":30,"状态":"完整","L1":{"一句话":"智慧教育的核心不是「把课搬到线上」，而是用数据给每个学生建画像、追踪他掌握了哪些知识点，再据此推送不同的练习与讲解——也就是个性化学习路径。","易错":["把智慧教育等同于「上网课」。核心在数据驱动的个性化，不在媒介。","把知识追踪与知识图谱混淆。前者追踪「学生掌握程度」，后者组织「知识之间的关系」。","以为 AI 批改可以直接替代教师评阅主观题。主观题仍需人工复核。","只谈技术不谈隐私与公平，简答题失分。"],"对比":[{"维度":"核心目标","智慧教育":"个性化学习路径与即时反馈","传统在线教育":"把课程内容搬到线上播放"},{"维度":"数据使用","智慧教育":"采集答题与行为数据驱动决策","传统在线教育":"以内容分发为主"},{"维度":"关键算法","智慧教育":"知识追踪（BKT/DKT）、推荐、RAG 答疑","传统在线教育":"视频播放与题库检索"},{"维度":"主要风险","智慧教育":"数据隐私、算法偏见、数字鸿沟","传统在线教育":"完课率低、互动不足"}]},"L2":{"档":"general","段":[{"n":1,"文":"教材 1.3.3 节在自然语言处理部分提及通过用户画像建模刻画学习者特征，但<b>未展开智慧教育的技术体系</b>。考纲对本条要求为「理解」，故按学科通用表述补足，教材定位为第 1 章自然语言处理部分（书内 p.17）。","页":"教材仅提及，以下为通用表述","书内页":17,"PDF页":30,"讲解":"这段定位说明：教材 1.3.3 节在自然语言处理部分提及通过用户画像建模刻画学习者特征，但没有展开智慧教育的技术体系；考纲要求“理解”，故按通用表述补足。技术栈可以按四层说：数据层采集答题、观看、停留等行为；建模层做知识追踪（估计每个知识点的掌握概率）与学习者画像；决策层生成个性化学习路径与推荐练习；交互层做智能答疑、自动批改与学情报告。要能区分知识追踪与知识图谱——前者追踪“学生掌握到什么程度”，后者组织“知识点之间是什么关系”。","讲解来源":"self","核对":"pending","原文核对":"对不上"}]},"L3":{"img":"bookimg/dx4-p30.jpg","focus":"img/kp-综合-智慧教育技术-应用.jpg","bbox":[0.0575,0.145,0.8941,0.5293],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-机器人技术-应用","模块":"综合模块","知识领域":"人工智能应用","知识单元":"机器人","知识点":"机器人技术、应用","要求":"理解","考纲来源":"官方","题数":6,"题id":["38A-G-10","DIG-92-01","DIG-92-02","DIG-92-03","DIG-92-04","DIG-92-05"],"教材":"yl","教材名":"人工智能引论","章节":"10.7 机器人控制","书内页":313,"PDF页":328,"状态":"完整","L1":{"一句话":"机器人技术按模块分为感知、规划、操作三部分；人工智能在机器人上的典型应用覆盖医疗、农业、工业自动化、仓储物流、仿人、水下等方向。","关键词":["感知/规划/操作","多学科交叉","典型应用方向"],"易错点":"把机器人技术只归结为“控制”——教材明确是三模块＋多学科交叉；也容易漏掉规划（路径与任务规划）这一层。"},"L2":{"档":"locator","段":[{"n":1,"文":"cting）的脚轮、驱动电机和驱动轮。近年来，越来越多的机器人产品被众人所知，如美国波士顿动力公司（BostonDynamics）的仿人机器人Atlas、动力平衡四足机械狗BigDog，以及美国特斯拉公司（Tesla）的TeslaBot等。研制机器人是一项复杂的系统工程，涉及机械、电子、控制、人工智能等多学科交叉领域。机器人技术按模块可分为感知、规划和操作（manipulation）三个主要模块（Thrun，2002）。人工智能特别是深度学习技术在计算机视觉领域的蓬勃发展，大大促进了机器人向智能化和通用化迈进。概括而言，人工智能在机器人技术中的应用涉及方方面面，一些典型的应用包括医疗服务机器人（healthcare）、农业机器人（agriculture）、工业自动化机器人（automotiveprocess）、仓储和物流机器人（warehousing）、仿人机器人（humanoid）、水下机器人（automatedunderwatervehicles）等，如图10.17所示。传统机器人的诸多任务可大致归类为导航（navigation）和操作，典型的经典机器","页":"书内 p.313 / PDF p.328","书内页":313,"PDF页":328,"讲解":"这段从产品讲到模块再讲到应用。产品层举了 Atlas（仿人）、BigDog（动力平衡四足）、TeslaBot；工程层强调机器人是机械、电子、控制、人工智能多学科交叉的系统工程；架构层给出三模块划分——感知、规划、操作。应用层列得很全：医疗服务、农业、工业自动化、仓储与物流、仿人、水下等。理解要点是把三模块与具体技术对上：感知对应视觉与传感器融合，规划对应路径与任务规划（含强化学习策略），操作对应机械臂运动控制与抓取。问“机器人为什么难”，就答“三模块强耦合、且要在真实物理环境中容错”。","讲解来源":"self","核对":"locator","原文核对":"通过"}]},"L3":{"img":"bookimg/yl-p328.jpg","focus":"img/kp-综合-机器人技术-应用.jpg","bbox":[0.1047,0.0236,0.9459,0.4642],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-AI4Science-技术-应用","模块":"综合模块","知识领域":"人工智能应用","知识单元":"智能驱动科学研究","知识点":"AI4Science 技术、应用","要求":"理解","考纲来源":"官方","题数":6,"题id":["TB-NOTE-25","DIG-93-01","DIG-93-02","DIG-93-03","DIG-93-04","DIG-93-05"],"教材":"yl","教材名":"人工智能引论","章节":"10.5 科学计算","书内页":309,"PDF页":324,"状态":"完整","L1":{"一句话":"科学智能（AI4Science）把深度学习当成科学计算的「模拟器」：用物理方程约束训练，让模型学懂规律；训练好之后算得比传统数值方法快几个数量级。代表技术是 PINN，代表成果是蛋白质结构预测。","易错":["把 AI4Science 理解成「用 AI 写论文」。它做的是科学计算与预测，不是写作。","以为 AI4Science 需要海量标注数据。教材明确：数据来自采样与模拟，额外标注需求少。","把 PINN 当成一种新的网络结构。它本质是<b>把方程残差写进损失函数</b>的训练范式，网络本身可以很普通。","夸大其能力，认为可替代理论推导。它加速求解，不提供因果解释。"],"对比":[{"维度":"求解方式","传统数值方法":"网格离散 + 迭代求解微分方程","AI4Science（PINN 等）":"神经网络拟合解函数"},{"维度":"速度","传统数值方法":"每个新情形都要重算，慢","AI4Science（PINN 等）":"训练慢、推理快，可快数个数量级"},{"维度":"数据依赖","传统数值方法":"依赖初始/边界条件与网格","AI4Science（PINN 等）":"数据少，靠物理方程约束补足"},{"维度":"可信度","传统数值方法":"有收敛性与误差界保证","AI4Science（PINN 等）":"缺乏严格保证，分布外易失效"}]},"L2":{"档":"paraphrase","段":[{"n":1,"文":"近年来，科学智能（AI4Science）成为机器学习和自然科学的一个重要交叉领域。将深度学习模型作为科学计算的一个模拟器，利用现有的数学物理方程对模拟的结果进行约束和训练，成为将机器学习应用于自然科学研究的一种新方式。","页":"《人工智能引论》10.5 节，书内 p.309","书内页":309,"PDF页":324,"讲解":"这段是本节的总起：近年科学智能（AI4Science）成为机器学习与自然科学的重要交叉领域；把深度学习模型作为科学计算的一个模拟器，用现有数学物理方程对模拟结果进行约束和训练，成为把机器学习用于自然科学研究的新方式。理解要点在“约束”二字——不是让网络自由拟合，而是让方程残差进入损失函数，把物理规律当先验。","讲解来源":"self","核对":"pending","原文核对":"通过"},{"n":2,"文":"科学智能具有两个显著特点：首先，数据本身来源于采样与模拟，因此需要的额外标注信息较少，数据的规模取决于模拟所消耗的计算开销；其次，训练完成的深度学习模型在新数据上的计算速度相比传统数值方法大幅度提升，甚至高出几个数量级。","页":"《人工智能引论》10.5 节，书内 p.309","书内页":309,"PDF页":324,"讲解":"这段给出科学智能的两个显著特点，两个都值得记清：第一，数据本身来源于采样与模拟，因此需要的额外标注信息较少，数据规模取决于模拟所消耗的计算开销；第二，训练完成的深度学习模型在新数据上的计算速度相比传统数值方法大幅提升，甚至高出几个数量级。理解时要能解释“为什么快”——训练是一次性的昂贵成本，推理是廉价的前向计算；也要能解释“为什么标注少”——标签由方程与模拟给出，不需人工标注。","讲解来源":"self","核对":"pending","原文核对":"通过"},{"n":3,"文":"知识与数据在科学智能中相辅相成，通过数据驱动与知识引导相结合的方式，人工智能方法能够解决大量科学问题。无论是物理仿真、化学合成、蛋白质结构预测等基础科学问题，还是药物虚拟筛选、新材料合成、天气预测等应用科学问题，都在机器学习的帮助下开拓了新的研究道路。","页":"《人工智能引论》10.5 节，书内 p.310","书内页":309,"PDF页":324,"讲解":"这段讲知识与数据的关系与应用面：知识与数据在科学智能中相辅相成，通过数据驱动与知识引导相结合，人工智能方法能够解决大量科学问题。随后列出两类问题：基础科学问题（物理仿真、化学合成、蛋白质结构预测）与应用科学问题（药物虚拟筛选、新材料合成、天气预测）。答题时先给“数据驱动＋知识引导”这个总纲，再各举一例，最后补一句边界——它擅长高维拟合与加速求解，但不能替代理论推导与实验验证。","讲解来源":"self","核对":"pending","原文核对":"部分相符"}]},"L3":{"img":"bookimg/yl-p324.jpg","focus":"img/kp-综合-AI4Science-技术-应用.jpg","bbox":[0.1059,0.0212,0.9471,0.4829],"页来源":"scan","核对":"pending"}},{"id":"kp-综合-状态空间表示与盲目搜索-BFS-DFS","模块":"综合模块","知识领域":"搜索与博弈","知识单元":"状态空间搜索","知识点":"状态空间表示与盲目搜索（BFS/DFS）","要求":"掌握","考纲来源":"扩展","题数":10,"题id":["38A-C-11","38A-D-11","TB-YL-HW-14","TB-YL-HW-61","TB-YL-HW-69","DIG-P-09","DIG-P-10","DIG-P-11","DIG-P-12","DIG-P-13"],"教材":"yinlun","教材名":"人工智能引论","章节":"3.1 搜索算法框架","书内页":63,"PDF页":78,"状态":"完整","L1":{"一句话":"搜索算法的复杂度由分支因子 b、目标最浅深度 d、最大路径长度 m 与状态空间大小描述；不利用额外信息的 BFS、DFS 属无信息搜索（盲目搜索）。","关键词":["分支因子 b","深度 d / 最大长度 m","无信息搜索","BFS/DFS"],"易错点":"把 d 与 m 混淆——d 是最浅目标深度（BFS 的时间量级），m 是最大路径长度（DFS 的空间量级）；也容易把 DFS 说成完备且最优。"},"L2":{"档":"locator","段":[{"n":1,"文":")来描述。一般地，时间复杂度将通过扩展的结点数量，空间复杂度将通过算法同时记录的结点数量来衡量。具体而言，搜索算法的复杂度可能与以下变量有关：分支因子b，即搜索树中每个结点的最大分支数目；目标结点到根结点的最浅深度即搜索树中最早出现的目标结点所在层数；搜索树中路径的最大可能长度叫状态空间的大小牖表3，1给出了这些变量的含义。表3．1搜索树中用于估计复杂度的变量含义含义分支因子，即搜索树中每个结点最大的分支数目根结点到最浅的目标结点的路径长度搜索树中路径的最大可能长度状态空间中状态的数量3韭3搜索算法框架一个简单的搜索算法框架如算法3．1所示。在算法中，集合F用于保存搜索树中可用于下一步探索的所有候选结点，这个集合称为边缘（fringe）集合，有时也叫作开表（openlist）。算法中有两个函数需要进一步说明：函数pick一m用于从边缘集合中选出一个结点元素，函数successor-nodes用于计算当前结点需要探索的后继结点（孩子结，占）算法中，第1行对边缘集合进行初始化，将根结点作为边缘集合的第一个元素；第3行从当前边缘集合中选出结点荪第4行将结点，7从边缘集合中去除；第5、7行判断取出的结点“是否通过目标测试，如果通过目标测试，则返回从根结点到该结点的搜索路径。注意，如果此时不停止算法而是继续搜索，","页":"书内 p.63 / PDF p.78","书内页":63,"PDF页":78,"讲解":"这段给出衡量搜索代价的变量组，是后面所有复杂度分析的基础。一般地，时间复杂度通过扩展的结点数量衡量，空间复杂度通过算法同时记录的结点数量衡量。影响复杂度的变量：分支因子 b，即搜索树中每个结点的最大分支数目；目标结点到根结点的最浅深度（BFS 找到解的时间量级）；搜索树中路径的最大可能长度，也就是状态空间的大小。理解要点：b 越大树越宽，d 越大最优解越深，m 决定 DFS 可能一头扎多深。","讲解来源":"self","核对":"locator","原文核对":"OCR 摘录（非逐字承诺）"},{"n":2,"文":"64第3章搜索探寻与问题求解对结点“进行扩展（expand）。某个非目标结点被扩展意味着该结点从边缘集合F中被取出（然后将其从该集合中删除），接着将该结点的后继结点放人边缘集合0算法3．1简单的搜索算法框架函数：TreeSearch输入：结点选择函数p主ck一fr。m，后继结点计算函数successornodes输出：从初始状态到终止状态的路径12345678F-{根结点}whi1eFd0n«¯pickfrom(F)ifgoaltest(n)thenreturnn.pathendF-FUsuccessornodes(n)9end函数pick-from决定了扩展结点的顺序，函数successor-nodes决定了哪些结点可被放人边缘集合供后续被扩展。在这一章的讨论中将会看到，如何扩展结点往往是搜索算法要解决的核心问题。有多种方法从边缘集合中取出结点进行扩展。当每次均从边缘集合中取出最上层（最浅）的结点时，该算法称为广度优先搜索(breadthfirstsearch）；当每次从边缘集合中取出搜索树最下层（最深）","页":"书内 p.64 / PDF p.79","书内页":64,"PDF页":79,"讲解":"这段讲搜索算法框架的基本动作，也顺带定义了“无信息搜索”。术语：对结点进行扩展（expand），指某个非目标结点从边缘集合中被取出、随后把它从集合中删除，再把它的后继结点放入边缘集合。算法 3.1 给出通用框架：初始化边缘集合、循环取点、判断是否目标、扩展后继。不利用任何额外信息的算法（如深度优先、广度优先）称为无信息搜索（uninformed search）；与之相对，利用启发信息的叫启发式搜索。记住这组对照：盲目＝不估计离目标多远，启发＝有估计。","讲解来源":"self","核对":"locator","原文核对":"OCR 摘录（非逐字承诺）"}]},"L3":{"页来源":"none","核对":"页图缺失","说明":"页图源未覆盖该页；页码来自整本 OCR，正文摘录见 L2，未附截图"}},{"id":"kp-综合-启发函数-评价函数与-A-算法","模块":"综合模块","知识领域":"搜索与博弈","知识单元":"启发式搜索","知识点":"启发函数、评价函数与 A* 算法","要求":"掌握","考纲来源":"扩展","题数":10,"题id":["38A-C-08","TB-YL-HW-15","TB-YL-HW-50","TB-YL-HW-62","TB-YL-HW-63","TB-YL-HW-66","DIG-P-14","DIG-P-15","DIG-P-16","DIG-P-17"],"教材":"yinlun","教材名":"人工智能引论","章节":"3.4 启发式搜索：启发函数与评价函数","书内页":66,"PDF页":81,"状态":"完整","L1":{"一句话":"启发函数 h(n) 估计从结点 n 到目标还要付出多少代价，评价函数 f(n) 决定下一步扩展谁；A* 用 f＝g＋h，并要求 h 可容（不高估）。","关键词":["h(n) 估价","f(n) 选点","A*：f=g+h","可容性"],"易错点":"把启发函数与评价函数当成同一个（A* 里二者可同值，但概念不同：h 只看未来，f 还要加已走的代价）；也容易漏掉“可容性＝不高估”这个前提。"},"L2":{"档":"locator","段":[{"n":1,"文":"解相对地，像深度优先搜索和广度优先搜索这样不利用额外信息的算法称为无信息（uninformed）搜索。下面介绍具有代表性的启发式搜索算法：贪婪最佳优先搜索算法(greedybest-firstsearch）（Doranetal.，1966）。搜索算法对每个结点“的选择过程需要用到启发函数和评价函数。启发函数（heuristicfunction）//同用于估计从结点到目标结点还须付出多少代价。启发函数同可定义为从结点”到目标结点之间的直线距离。评价函数（evaluationfunction）司被用来决定搜索算法位于当前结点”时，下一步应该选择的后继结点。在边缘结点集合中，当前结点的某个相邻后继结点的评价函数取值越小，该相邻后继结点被挑选的优先级越高。贪婪最佳优先搜索算法将启发函数与评价函数视为同一个函数，即丿、@=/，。每次位于当前结点”时，贪婪最佳优先搜索算法总是从当前结点的所有相邻结点中，“贪婪地\"将离目标结点直线距离最近的结点作为后继结点。令评价函数取值和启发函数取值相等的启发式搜索算法称为贪婪最佳优先搜索算法。表3，2给出了每一个城市到目标城市（即城市K)的直线距离（即启发函数取值）。启发函数取值可作为额外信息来辅助路径搜索。表3，2每个城市到目标城市的直线距离（启发函数取亻直）状态131012根","页":"书内 p.66 / PDF p.81","书内页":66,"PDF页":81,"讲解":"这段给出两个函数的定义与分工：搜索算法对每个结点的选择过程需要用到启发函数和评价函数。启发函数（heuristic function）用于估计从结点到目标结点还须付出多少代价，可以定义为从该结点到目标结点之间的直线距离；评价函数（evaluation function）用来决定搜索算法位于当前结点时，下一步应该选择哪个后继结点。理解要点：h 是“离目标还有多远”的猜测，f 是“值不值得走这一步”的打分；贪婪最佳优先搜索只按 h 选点，因此快但可能不最优。","讲解来源":"self","核对":"locator","原文核对":"OCR 摘录（非逐字承诺）"},{"n":2,"文":"3．3A•搜索表3．3含义结点”的启发函数从起始结点到结点”所对应路径的代价结点”的评价函数从结点”执行动作到达结点”'的单步代价从结点“出发到达终止结点的最小代价设计一个良好的启发函数需要满足如下两种性质。性质1：可容性（admissible）本节中使用的若十符号对于任意结点”，有方同，如果”是目标结点，则有h=0。如表3．3所示，/了同是从结点”出发到达终止结点所付出的最小代价。可以这样理解满足可容性的启发函数，启发函数不会过高估计（over-estimate）从结点”到终止结点所应该付出的代价（即估计代价小于或等于实际代价）。在图3．1中，对每个结点而言，其状态（城市）到目标状态（城市）K之间的行驶距离不会小于两城之间的距离，因此列车以最大行驶速度通过直线距离花费的时间必然不会超过实际代价，将该时间作为启发函数值是满足可容性条件的。性质2：一致性（consistency）启发函数的一致性指满足条件）”，，到+h@），这里c(),a，到表示结点“通过动作到达其相应的后继结点”'的代价。在图3，1中，假设","页":"书内 p.69 / PDF p.84","书内页":69,"PDF页":84,"讲解":"这段讲 A* 如何保证最优。先给符号：h(n) 是结点 n 的启发函数，g(n) 是从起始结点到 n 的路径代价，f(n) 是 n 的评价函数，另有两个量分别表示单步代价与从 n 出发到终止结点的最小代价。核心结论：设计良好的启发函数要满足可容性（admissible）——对任意结点，h 都不能高估真实剩余代价。直观理由：只要不高估，A* 就不会因为“看起来远”而错过真正的最优路径，因此可找到最优解。若 h 恒为 0，A* 退化为 Dijkstra/一致代价搜索。","讲解来源":"self","核对":"locator","原文核对":"OCR 摘录（非逐字承诺）"}]},"L3":{"页来源":"none","核对":"页图缺失","说明":"页图源未覆盖该页；页码来自整本 OCR，正文摘录见 L2，未附截图"}},{"id":"kp-综合-minimax-与-alpha-beta-剪枝","模块":"综合模块","知识领域":"搜索与博弈","知识单元":"对抗搜索","知识点":"minimax 与 alpha-beta 剪枝","要求":"掌握","考纲来源":"扩展","题数":10,"题id":["TB-YL-HW-16","TB-YL-HW-64","TB-YL-HW-68","DIG-P-18","DIG-P-19","DIG-P-20","DIG-P-21","DIG-P-22","DIG-P-23","DIG-P-24"],"教材":"yinlun","教材名":"人工智能引论","章节":"3.4 最小最大搜索","书内页":71,"PDF页":86,"状态":"完整","L1":{"一句话":"minimax 假设对手总走最不利于我的一步，因此在“我取最大、对手取最小”之间交替回溯；alpha-beta 剪枝在已知某分支不可能被选中时提前放弃，结果不变但更快。","关键词":["MAX/MIN 交替","回溯取极值","α 下界 / β 上界","剪枝不改结果"],"易错点":"以为剪枝可能剪掉最优解（正确实现下结果与 minimax 完全一致）；也容易把 α、β 的角色记反——α 是 MAX 已确保的下界，β 是 MIN 已确保的上界。"},"L2":{"档":"locator","段":[{"n":1,"文":"3．4最小最大搜索3，4最小最大搜索3，1和3．2两节中所介绍内容是智能体根据环境提供的信息来进行问题求解。在这些算法模型中，智能体本身在一个不变且已知环境中进行搜索。然而在现实中，智能体往往不是孤立存在的，它进行问题求解活动时不能避免与其他智能体打交道。一个简单的例子是在进行多人游戏时，每个角色在求解最佳行动方案时不可能不将其他角色的行动考虑在内。本节和稍后章节将介绍一种特殊情况下的多智能体搜索问题，即在信息确定、全局可观察、竞争对手轮流行动、输贏收益零和（zero-sum）假设下的二人博弈问题。其中，零和是博弈论的一个概念，属非合作博弈范畴，指参与博弈各方在严格竞争下，方获得收益必然意味着另一方遭受损失，博弈各方收益和损失相加的总和永远为“零\"，使得双方不存在合作的可能。求解该问题的算法称为对抗搜索(adversarialsearch)，也称为博弈搜索(gamesearch)。在这个搜索框架中，两个智能体同处于一个竞争的环境，智能体之间通过竞争实现各自相反的目标，即一方想最大化自身的利益，而另一方则想最小化对手的利益。通俗地说，对抗搜索的过程就是两个智能体各自选择对自己有利的策略。与3．1节中对问题进行形式化描述一致，对二人博弈问题求解也需要先形式化描述如下元素。状态：状态5包括当前的游戏局面和当前","页":"书内 p.71 / PDF p.86","书内页":71,"PDF页":86,"讲解":"这段交代 minimax 的适用前提：前面几节讲的都是智能体在一个不变且已知的环境里独自搜索；而现实中智能体往往不是孤立存在的，还要面对其他会行动的主体。于是进入对抗搜索（博弈搜索）。最小最大搜索是这类方法中最基本的一种：一方最大化自己的利益，另一方最小化这个利益，所以搜索时要在“轮到我取最大、轮到对手取最小”之间交替，把叶子上的得分回溯上来。理解要点：它假设对手永远走最坏的那步，因此是保守而稳的策略。","讲解来源":"self","核对":"locator","原文核对":"OCR 摘录（非逐字承诺）"},{"n":2,"文":"3，5alpha-beta剪枝搜索输出：玩家MIN行动下，当前状态的得分v=minimax(s,MIN)7512345ifterminaltest(s)utility(s)thenreturnforeachaeactions(s)dO《v<—min(),MaxVaIue(result(s,a）））end35alpha-beta剪枝搜索alpha-beta剪枝索与深度优先搜索类似，如果搜索树极大，则最小最大搜索无法在合理时间内返回结果。对于比较复杂的游戏如国际象棋等，执行最小最大搜索的时间开销将是巨大的。为了减少时间开销，可在最小最大搜索中采用一种常见的剪枝方法一一alpha一beta剪枝(Samuel，1959；Knuthetal.,197引，以减少搜索空间。如前对剪枝的定义，alpha-beta剪枝搜索算法在最小最大搜索中可减少被搜索的结点数，即在保证得到与原最小最大搜索算法同样的搜索结果时，剪去不影响最终结果的搜索分支。图3．10中假设叶子结点不代表终局状态，而是各自代表一棵子树，其中搜索算法尚不知道动","页":"书内 p.75 / PDF p.90","书内页":75,"PDF页":90,"讲解":"这段进入 alpha-beta 剪枝：它在最小最大搜索的基础上改进“必须遍历整个搜索空间”这一不足，在搜索过程中可剪除不可能影响最终决策的分支。机制用两个界描述：α 是 MAX 结点当前已能确保的最好值（下界），β 是 MIN 结点当前已能确保的最好值（上界）；当某结点的估值不再落在 (α, β) 区间内，其剩余子结点就不必再看。关键结论：剪枝只减少搜索量，不改变 minimax 的最终结果，因此正确实现下两者答案完全一致，剪枝效果依赖子结点顺序。","讲解来源":"self","核对":"locator","原文核对":"OCR 摘录（非逐字承诺）"}]},"L3":{"页来源":"none","核对":"页图缺失","说明":"页图源未覆盖该页；页码来自整本 OCR，正文摘录见 L2，未附截图"}},{"id":"kp-综合-蒙特卡洛树搜索","模块":"综合模块","知识领域":"搜索与博弈","知识单元":"对抗搜索","知识点":"蒙特卡洛树搜索","要求":"掌握","考纲来源":"扩展","题数":10,"题id":["38A-A-03","TB-YL-HW-02","TB-YL-HW-17","TB-YL-HW-18","TB-YL-HW-65","TB-YL-HW-67","DIG-P-25","DIG-P-26","DIG-P-27","DIG-P-28"],"教材":"yinlun","教材名":"人工智能引论","章节":"3.6 蒙特卡洛树搜索","书内页":80,"PDF页":95,"状态":"完整","L1":{"一句话":"蒙特卡洛树搜索用大量随机模拟的统计结果来估计走子的价值，通过“选择—扩展—模拟—回传”四步迭代，把计算资源集中到更有希望的分支上。","关键词":["随机模拟","选择/扩展/模拟/回传","UCT/UCB","AlphaGo"],"易错点":"以为它靠穷举（它恰恰是采样近似）；也容易把“探索与利用”的平衡漏掉——上限置信区间就是为平衡这两者。"},"L2":{"档":"locator","段":[{"n":1,"文":"中对分数相同情况的处理方法与正文中不同，此处只保留一个可行解，而放弃所有分数相同的解根据图3．14和图3，15，原本最小最大搜索树中有26个结点，经过alpha-beta剪枝后只扩展（访问）了其中15个结点，可见alpha一beta剪枝技术能够有效地减少搜索树中结点的数目。3，6蒙特卡洛树搜索3．6．1探索与利用机制的平衡在有些问题中，智能体对环境并没有完整的认识，它们事先并不知道每种行动的优劣及这些行动造成的不同结果，只有当它们实际尝试过后才能确定。","页":"书内 p.80 / PDF p.95","书内页":80,"PDF页":95,"讲解":"这段落在 3.6 节蒙特卡洛树搜索的入口，关键词是“蒙特卡洛”与“树”。要点：面对分支因子极大、无法穷举的博弈（如围棋），用大量随机模拟的统计结果替代精确估值；每次迭代走四步——按一定策略从根往下选择结点（选择）、给叶结点增加一个新子结点（扩展）、从该结点随机模拟到终局得到胜负（模拟）、把结果沿路径回传更新统计量（回传）。选择阶段常用上限置信区间（UCT/UCB）来平衡“探索没试过的分支”和“利用当前看起来好的分支”。教材随后用 AlphaGo 说明它与深度学习、强化学习结合后的威力。","讲解来源":"self","核对":"locator","原文核对":"OCR 摘录（非逐字承诺）"}]},"L3":{"页来源":"none","核对":"页图缺失","说明":"页图源未覆盖该页；页码来自整本 OCR，正文摘录见 L2，未附截图"}},{"id":"kp-综合-博弈分类与纳什均衡","模块":"综合模块","知识领域":"搜索与博弈","知识单元":"博弈论基础","知识点":"博弈分类与纳什均衡","要求":"知道","考纲来源":"扩展","题数":6,"题id":["TB-YL-HW-40","TB-YL-HW-41","RAW-YL-7-02","RAW-YL-7-04","RAW-YL-7-06","RAW-YL-7-09"],"教材":"yinlun","教材名":"人工智能引论","章节":"7.1 博弈论的相关概念（博弈的分类与纳什均衡）","书内页":230,"PDF页":245,"状态":"完整","L1":{"一句话":"博弈可按参与者能否达成约束性协议分为合作与非合作，按行动先后分为静态与动态，按信息了解程度分为完全信息与不完全信息；纳什均衡指任何一方单方面改变策略都不能变得更好的策略组合。","关键词":["合作/非合作","静态/动态","完全/不完全信息","纳什均衡"],"易错点":"把“完全信息”与“完美信息”混为一谈（前者指各方收益函数公开，后者指能观察到自己之前的所有行动）；也容易把纳什均衡等同于“对所有人最优”。"},"L2":{"档":"locator","段":[{"n":1,"文":"230第7章人工智能博弈对方的决策；而在动态博弈中，参与者所采取行动的先后顺序由规则决定，且后行动者知道先行动者所采取的行动。按照博弈过程中参与者对信息的了解程度，博弈可以划分为完全信息博弈（completeinformationgame)和不完全信息博弈(incompleteinformationgame)。所谓完全信息，是指所有参与者均了解其他参与者的策略集、收益等信息；而不完全信息指并非所有参与者均掌握所有信息。若博弈的参与者知道所有参与者之前采取的行动，这种博弈称为一美佇审博弈(perfectinformationgame）。7匚口'孬、按照博弈局势中所有参与者的总收益，博弈可以划分为零和博弈(zero-sumgame)和非零和博弈（non-zero-sumgame)。所谓零和博弈，是指在终结局势下，所有参与者的收益总和为零；而非零和博弈是指在终结局势下，所有参与者的收益总和不为零。前文提到的囚徒困境属于非合作、完全信息的不完美信息静态博弈。7．14纳什均衡博弈的稳定局势即为纳什均衡，其指参与者做出了这样一种策略组合，在该策略组合中，任何参与者单独改变策略都不会得到好处。换句话说，如果在一个策略组合中，当所有博弈参与者都不改变策略时，就不会有任何博弈参与者有动机改变其自身做出的策略，则该策略组合","页":"书内 p.230 / PDF p.245","书内页":230,"PDF页":245,"讲解":"这段用囚徒困境把博弈的要素摆出来：参与者为甲和乙两个嫌疑犯，两人只能独立决策、不能得知对方的决定，即以非合作方式博弈；可采取的策略集是“认罪、沉默”。这个例子同时说明了三件事——参与者、策略集、以及各自收益取决于双方选择的局势。理解要点：非合作博弈的关键特征是“不能达成有约束力的协议”，所以每个人只能按自己的理性算，结果可能对双方都不好（这正是囚徒困境的意义）。","讲解来源":"self","核对":"locator","原文核对":"OCR 摘录（非逐字承诺）"},{"n":2,"文":"7．1博弈论的相关概念在这一博弈过程中，参与者为甲和乙两个嫌疑犯，两人只能独立决策而不能得知对方做出的决定，即以非合作方式进行博弈。两人可采取的策略集s={认罪，沉默}。表7，3所示为甲和乙分别采取不同行动后所得到的局势及其收益情况。表7．3因徒困境中甲、乙博弈局势及收益甲认罪，乙沉默甲沉默，乙认罪229局势甲认罪，乙认罪（均衡解）甲沉默，乙沉默（最优解）甲收益0一0．5乙收益一100一0．5从表7，3可知，甲、乙同时保持沉默对两者而言是最优解。但是实际上，甲和乙两人均倾向于选择同时认罪而达到一种均衡解，这也是这一博弈被称为困境的原因。在博弈过程中，对甲而言，如果乙选择沉默，那么甲选择认罪会被释放，而选择沉默会被判刑半年，所以甲选择认罪；如果乙选择认罪，那么甲选择认罪会被判刑五年，而选择沉默会被判刑十年，所以甲仍然应该选择认罪。因此，不论乙的选择是什么，甲都应该选择认罪。对乙也是同理，不论甲的选择是什么，乙都应该选择认罪。最终在囚徒困境的博弈中，甲和乙都从理性角度考虑各自的选择，选择了同时认罪这一行为。在甲","页":"书内 p.229 / PDF p.244","书内页":229,"PDF页":244,"讲解":"这段给出博弈的三种分类维度，三个维度都要分清。第一维按能否达成约束性协议：合作博弈与非合作博弈。第二维按行动先后：静态博弈（参与者同时行动或虽不同时但不知道对方行动）与动态博弈（行动顺序由规则决定，且后行动者知道先行动者做了什么）。第三维按对信息的了解程度：完全信息博弈与不完全信息博弈。三个维度各有一条判据，先立判据再看名词：静态/动态看“时间与观察”，完全/不完全看“收益函数是否公开”。纳什均衡则是在这些结构下“谁都不愿单方面改变”的策略组合。","讲解来源":"self","核对":"locator","原文核对":"OCR 摘录（非逐字承诺）"}]},"L3":{"页来源":"none","核对":"页图缺失","说明":"页图源未覆盖该页；页码来自整本 OCR，正文摘录见 L2，未附截图"}},{"id":"kp-综合-遗憾最小化与稳定匹配","模块":"综合模块","知识领域":"搜索与博弈","知识单元":"博弈论基础","知识点":"遗憾最小化与稳定匹配","要求":"知道","考纲来源":"扩展","题数":5,"题id":["TB-YL-HW-42","RAW-YL-7-07","RAW-YL-7-08","RAW-YL-7-10","RAW-YL-7-11"],"教材":"yinlun","教材名":"人工智能引论","章节":"7.2.2 虚拟遗憾最小化算法；7.3 Gale-Shapley 稳定匹配算法","书内页":234,"PDF页":249,"状态":"完整","L1":{"一句话":"遗憾最小化用“如果当初总选某个策略会多赚多少”的累计遗憾来调整策略，从而近似求解纳什均衡；稳定匹配用 Gale-Shapley 算法求不存在“互相更想配对”的匹配。","关键词":["遗憾值","近似纳什均衡","Gale-Shapley","稳定＝无阻塞对"],"易错点":"以为遗憾最小化一定能精确得到纳什均衡（它是近似、且随迭代收敛）；也容易把稳定匹配说成“最优匹配”——稳定只保证没有阻塞对。"},"L2":{"档":"locator","段":[{"n":1,"文":"x01、02在博弈策略求解的过程中，希望求解得到每个玩家的最优反应策略，若所有玩家都是理性的，则算法求解的最优反应策略就是一个纳什均衡。考虑到计算资源有限这一前提，难以通过遍历博弈中的所有策略组合来找到一个最优反应策略，因此需要找到一种能快速发现近似纳什均衡的方法。接下来介绍通过遗憾最小化(regretminimization）算法来近似求解纳什均衡。遗憾最小化算法是一种根据以往博弈过程中所得遗憾程度来选择未来行为的方法。玩家i在过去7'轮中采取策略的累加遗憾值定义如下：其中，和分别表示第，轮中所有玩家的策略组合和除了玩家以外的策略组合。简单地说，累加遗憾值代表在过去7'轮中，玩家i在每一轮中选择策略0所得收益与采取其他策略所得收益之差的累加。在得到玩家/的所有可选策略的遗憾值后，可以根据遗憾值的大小来选择后续第7'+1轮博弈的策略，这种选择方式称为遗憾匹配℃reenwaldetal.，2006）。通常，遗憾值为负数的策略被认为不能提升下一时刻的收益，因此如下定义有效遗憾值：Regret,T'、（0）=max(Regretl(q)，0）（7，2）利用有效遗憾值的遗憾匹配，可得到玩家i在T轮后第7'+1轮选择策略0的概率p@'内为RegretT•+@），如果乥RegretT•、．@）>0RegretT、@","页":"书内 p.234 / PDF p.249","书内页":234,"PDF页":249,"讲解":"这段讲为什么要用近似方法：求解博弈时希望得到每个玩家的最优反应策略，若所有玩家都理性，最优反应策略的组合就是纳什均衡；但计算资源有限，难以遍历所有策略组合去找它，于是需要“快速发现近似纳什均衡”的方法。遗憾最小化的思路是：记录过去每次没有选择某策略而少得的收益（遗憾），按累计遗憾的大小调整下一次的选择概率——长期看，平均遗憾趋近于零，策略就逼近纳什均衡。教材用石头-布-剪刀的具体过程演示这个迭代。","讲解来源":"self","核对":"locator","原文核对":"OCR 摘录（非逐字承诺）"},{"n":2,"文":"A）（3，C）（4，D）匹配4修补（2，D）（2，B）（3，C）（4，B）匹配5（2，B）（3，C）（4，D）可以看出，最终的匹配结果与初始结果相同，算法陷人死循环。1962年，美国数学家大卫·盖尔和博弈论学家沙普利提出了针对双边稳定匹配问题的解决算法（也称为Gale-Shapley算法或G-S算法），并将其应用于稳定婚姻问题的求解℃aleetal.，1962）。算法过程如下：(1)单身男性向最喜欢的女性表白。GaIe-Shapley筛法（2）所有收到表白的女性从向其表白的男性中选择最喜欢的男性，暂时匹配。（3）未匹配的男性继续向没有拒绝过他的女性表白。收到表白的女性如果没有完成匹配，则从这一批表白者中选择最喜欢的男性。即使收到表白的女性已经完成匹配，但是如果她认为有更喜欢的男性，则可以拒绝之前的匹配者，重新匹配。（4）如此循环迭代，直到所有人都成功匹配为止。这一过程中，男性使用贪心策略表白，而女性具有选择权，一旦出现不稳定的匹配，即替换当前匹配。对于表7彐1中的示例，匹配过程如表7，12所示。表7．12G","页":"书内 p.245 / PDF p.260","书内页":245,"PDF页":260,"讲解":"这段讲稳定匹配与 G-S 算法。教材先用一个反例说明“随便配对”会出问题：反复修补的匹配过程可能在几个匹配之间循环、陷入死循环，说明需要一个有终止性保证的算法。1962 年，美国数学家大卫·盖尔与博弈论学家沙普利提出了针对双边稳定匹配问题的解法，即 Gale-Shapley 算法（G-S 算法），最初用于求解稳定婚姻问题。稳定的含义是：不存在一对男女，彼此都更想和对方配对而不愿维持现有配对（即不存在“阻塞对”）。要记住它是单边提出、逐步拒绝的延迟接受过程，且结果稳定但不一定唯一最优。","讲解来源":"self","核对":"locator","原文核对":"OCR 摘录（非逐字承诺）"}]},"L3":{"页来源":"none","核对":"页图缺失","说明":"页图源未覆盖该页；页码来自整本 OCR，正文摘录见 L2，未附截图"}},{"id":"kp-补充-遗传算法-轮盘赌选择","模块":"补充","知识领域":"考纲外·演化学习","知识单元":"遗传算法基本流程","知识点":"遗传算法（轮盘赌选择）","要求":"知道","考纲来源":"考纲外","题数":1,"题id":["38A-F-11"],"教材":"yinlun","教材名":"人工智能引论","章节":"4.8 演化学习（遗传算法）","书内页":127,"PDF页":142,"状态":"完整","L1":{"一句话":"遗传算法是演化学习的代表算法，受“物竞天择、适者生存”启发，用选择、交叉、变异迭代进化种群；轮盘赌按适应度占比分配被选中的概率。","关键词":["种群/个体/适应度","选择-交叉-变异","轮盘赌","适者生存"],"易错点":"以为轮盘赌是“选适应度最高的那个”（它是按比例随机，最差的也有小概率被选中）；也容易漏掉“变异”这一步，只答选择与交叉。"},"L2":{"档":"locator","段":[{"n":1,"文":"4．8演化学习过程。演化算法有很多种实现方法，如遗传算法（geneticalgorithm，(A)、遗传规划(geneticprogrammmg，GP）、演化策略（evolutionarystrategy)等。遗传算法是演化学习的代表性算法，其受到达尔文“物竞天择，适者生存\"进化论思想的启示，引人选择(selection)、交叉(crossover)和变异(mutation)等操作，以搜索方式来进行优化求解。遗传算法由密歇根大学的约翰·霍兰(JohnH.HoIIand)和他的同事于20世纪60年代在对细胞自动机(cellularautomata）进行研究时率先提出（Holland，1992）。在遗传算法中，对于一个待求解的最优化问题，先给定一定数量的候选解（称为个体或染色体
